<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a25;
            --bg-input: #1e1e2a;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #e8e8ed;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-light: #818cf8;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --success-border: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-border: rgba(239, 68, 68, 0.3);
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --max-width: 820px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        /* ── Score Bar ── */
        #score-stats-container {
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0 24px;
        }

        #score-stats-container>div {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #score-stats-container span {
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        #current-score {
            color: var(--accent-light);
        }

        #correct-answers {
            color: var(--success);
        }

        #wrong-answers {
            color: var(--danger);
        }

        /* ── Quiz Meta ── */
        #quiz-meta-container {
            text-align: center;
            margin-bottom: 32px;
            padding: 32px 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.06), rgba(168, 85, 247, 0.04));
            border: 1px solid var(--border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        #quiz-meta-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        #quiz-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e8e8ed, #a5a5ba);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #quiz-description {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Quiz Container ── */
        #quiz-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Question Card ── */
        .single-question-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color var(--transition);
            overflow: hidden;
        }

        .single-question-container:hover {
            border-color: var(--border-hover);
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .question-number {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-light);
        }

        .question-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .question-text p {
            margin: 4px 0;
        }

        /* Images inside questions (Udemy embeds screenshots in prompt HTML) */
        .question-text img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            margin: 12px 0;
            display: block;
            border: 1px solid var(--border);
        }

        /* Also constrain images in option labels */
        .question-lable img,
        .question-lable label img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            vertical-align: middle;
        }

        
        /* -- Inline Code and Pre blocks -- */
        code {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            margin: 8px 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        /* ── Options ── */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-lable {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-input);
            transition: all var(--transition);
        }

        .question-lable:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .question-lable label {
            cursor: pointer;
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* Normalize p tags inside labels (Udemy wraps answers in <p>) */
        .question-lable label p {
            margin: 0;
            display: inline;
        }

        /* Custom Radio */
        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        input[type="radio"]:checked {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 3px var(--bg-input);
        }

        input[type="radio"]:hover {
            border-color: var(--accent-light);
        }

        /* Custom Checkbox (multi-answer) */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        input[type="checkbox"]:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        input[type="checkbox"]:hover {
            border-color: var(--accent-light);
        }

        /* Multi-answer hint badge */
        .multi-answer-hint {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* ── Answer States ── */
        .correct-answer .question-lable,
        .correct-answer.question-lable {
            border-color: var(--success-border) !important;
            background: var(--success-bg) !important;
        }

        .correct-answer input[type="radio"],
        .correct-answer input[type="checkbox"] {
            border-color: var(--success) !important;
            background: var(--success) !important;
            box-shadow: inset 0 0 0 3px var(--success-bg) !important;
        }

        .incorrect-answer .question-lable,
        .incorrect-answer.question-lable {
            border-color: var(--danger-border) !important;
            background: var(--danger-bg) !important;
        }

        .incorrect-answer input[type="radio"],
        .incorrect-answer input[type="checkbox"] {
            border-color: var(--danger) !important;
            background: var(--danger) !important;
            box-shadow: inset 0 0 0 3px var(--danger-bg) !important;
        }

        /* ── Buttons ── */
        button {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .button {
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            flex-grow: 1;
            transition: all var(--transition);
            letter-spacing: 0.01em;
        }

        .button:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .button:active {
            transform: translateY(0);
        }

        .explanation-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all var(--transition);
        }

        .explanation-btn:hover {
            color: var(--accent-light);
            background: var(--accent-glow);
        }

        /* ── Modal ── */
        dialog {
            position: fixed;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 0;
            border-radius: 16px;
            width: min(90vw, 640px);
            max-height: 80vh;
            overflow: hidden;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        #modal-content {
            padding: 28px;
            line-height: 1.7;
            font-size: 14px;
            overflow-y: auto;
            max-height: 80vh;
        }

        #modal-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
        }

        #modal-content p {
            color: var(--text-secondary);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--transition);
        }

        .modal-close:hover {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            main {
                padding: 68px 16px 24px;
            }

            .single-question-container {
                padding: 20px;
                border-radius: var(--radius-sm);
            }

            #quiz-meta-container {
                padding: 24px 16px;
                border-radius: var(--radius-sm);
            }

            #quiz-title {
                font-size: 20px;
            }

            #score-stats-container {
                gap: 16px;
                font-size: 12px;
                height: 46px;
                padding: 0 12px;
            }

            .question-lable {
                padding: 10px 12px;
            }

            .question-text {
                font-size: 14px;
            }

            .question-lable label {
                font-size: 13px;
            }

            .question-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            pre {
                font-size: 12px;
                padding: 10px 12px;
            }

            dialog {
                width: min(95vw, 640px);
                max-height: 85vh;
            }

            #modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 420px) {
            main {
                padding: 60px 8px 16px;
            }

            .single-question-container {
                padding: 14px;
                gap: 12px;
            }

            #quiz-meta-container {
                padding: 18px 12px;
                margin-bottom: 20px;
            }

            #quiz-title {
                font-size: 18px;
            }

            #score-stats-container {
                gap: 10px;
                font-size: 11px;
                height: 40px;
            }

            .question-number {
                font-size: 11px;
            }

            .multi-answer-hint {
                font-size: 10px;
                padding: 1px 6px;
            }

            .question-text {
                font-size: 13px;
                line-height: 1.6;
            }

            .question-lable {
                padding: 10px;
                gap: 10px;
            }

            .question-lable label {
                font-size: 12.5px;
            }

            input[type="radio"],
            input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }

            .button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .explanation-btn {
                font-size: 12px;
            }

            pre {
                font-size: 11px;
                padding: 8px 10px;
            }

            dialog {
                width: 98vw;
                border-radius: 12px;
            }

            #modal-content {
                padding: 16px;
                font-size: 13px;
            }

            .modal-close {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
        }

        /* ── Site Footer ── */
        .site-footer {
            text-align: center;
            margin-top: 48px;
            padding: 20px 24px;
            position: relative;
            font-size: 13px;
            color: var(--text-muted);
        }

        .site-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .site-footer a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .site-footer a:hover {
            color: #fff;
            background: rgba(99, 102, 241, 0.15);
        }

        @media print {
            #score-stats-container {
                display: none;
            }

            body {
                background: #fff;
                color: #000;
            }

            .single-question-container {
                border: 1px solid #ddd;
            }

            .question-lable {
                border: 1px solid #ddd;
                background: #f9f9f9;
            }

            input[type="radio"],
            input[type="checkbox"] {
                border-color: #999;
            }

            .site-footer {
                color: #999;
            }

            .site-footer a {
                color: #6366f1;
            }

            .site-footer::before {
                background: #ddd;
            }
        }
    </style>
</head>

    <script>
        const quizData = {"quiz_id": 4493536, "quiz_description": "<p>We recommend that you retake these practice exams until you consistently <strong>score 80%</strong> or higher.</p><p>To access your<strong> free bonus learning material</strong>, visit <a href=\"https://digitalcloud.training/aws-solutions-architect-associate-resources\" rel=\"noopener noreferrer\" target=\"_blank\">https://digitalcloud.training/aws-solutions-architect-associate-resources</a></p><p><strong>REVIEWS really matter </strong>- We'd be thrilled if you could leave us a rating. Simply navigate to your course and click \"<strong>Leave a rating</strong>\" in the top right of the console.</p><p>If you have any questions or concerns, please reach out using the <strong>Q&amp;A forum</strong> or visit <a href=\"https://digitalcloud.training/aws-courses-faq\" rel=\"noopener noreferrer\" target=\"_blank\">https://digitalcloud.training/aws-courses-faq</a> to find answers to the most frequently asked questions. Please note that direct messages (on Udemy or social media) aren't monitored.</p>", "quiz_title": "AWS Certified Solutions Architect Associate", "pass_percent": 72, "questions": [{"_class": "assessment", "id": 103035789, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is migrating a decoupled application to AWS. The application uses a message broker based on the MQTT protocol. The application will be migrated to Amazon EC2 instances and the solution for the message broker must not require rewriting application code.</p><p>Which AWS service can be used for the migrated message broker?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon MQ is a managed message broker service for Apache ActiveMQ that makes it easy to set up and operate message brokers in the cloud. Connecting current applications to Amazon MQ is easy because it uses industry-standard APIs and protocols for messaging, including JMS, NMS, AMQP, STOMP, MQTT, and WebSocket. Using standards means that in most cases, there\u2019s no need to rewrite any messaging code when you migrate to AWS.</p><p><strong>CORRECT: </strong>\"Amazon MQ\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon SQS\" is incorrect. This is an Amazon proprietary service and does not support industry-standard messaging APIs and protocols.</p><p><strong>INCORRECT:</strong> \"Amazon SNS\" is incorrect. This is a notification service not a message bus.</p><p><strong>INCORRECT:</strong> \"AWS Step Functions\" is incorrect. This is a workflow orchestration service, not a message bus.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/amazon-mq/\">https://aws.amazon.com/amazon-mq/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Amazon SQS</p>", "<p>Amazon SNS</p>", "<p>Amazon MQ</p>", "<p>AWS Step Functions</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A company is migrating a decoupled application to AWS. The application uses a message broker based on the MQTT protocol. The application will be migrated to Amazon EC2 instances and the solution for the message broker must not require rewriting application code.Which AWS service can be used for the migrated message broker?", "related_lectures": []}, {"_class": "assessment", "id": 103035791, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A HR application stores employment records on Amazon S3. Regulations mandate the records are retained for seven years. Once created the records are accessed infrequently for the first three months and then must be available within 10 minutes if required thereafter.</p><p>Which lifecycle action meets the requirements whilst MINIMIZING cost?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The most cost-effective solution is to first store the data in S3 Standard-IA where it will be infrequently accessed for the first three months. Then, after three months expires, transition the data to S3 Glacier where it can be stored at lower cost for the remainder of the seven year period. Expedited retrieval can bring retrieval times down to 1-5 minutes.</p><p><strong>CORRECT: </strong>\"Store the data in S3 Standard-IA for 3 months, then transition to S3 Glacier\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Store the data in S3 Standard for 3 months, then transition to S3 Glacier\" is incorrect. S3 Standard is more costly than S3 Standard-IA and the data is only accessed infrequently.</p><p><strong>INCORRECT:</strong> \"Store the data in S3 Standard for 3 months, then transition to S3 Standard-IA\" is incorrect. Neither storage class in this answer is the most cost-effective option.</p><p><strong>INCORRECT:</strong> \"Store the data in S3 Intelligent Tiering for 3 months, then transition to S3 Standard-IA\" is incorrect. Intelligent tiering moves data between tiers based on access patterns, this is more costly and better suited to use cases that are unknown or unpredictable.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p><p><a href=\"https://docs.aws.amazon.com/amazonglacier/latest/dev/downloading-an-archive-two-steps.html#api-downloading-an-archive-two-steps-retrieval-options\">https://docs.aws.amazon.com/amazonglacier/latest/dev/downloading-an-archive-two-steps.html#api-downloading-an-archive-two-steps-retrieval-options</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Store the data in S3 Standard for 3 months, then transition to S3 Glacier</p>", "<p>Store the data in S3 Standard-IA for 3 months, then transition to S3 Glacier</p>", "<p>Store the data in S3 Standard for 3 months, then transition to S3 Standard-IA</p>", "<p>Store the data in S3 Intelligent Tiering for 3 months, then transition to S3 Standard-IA</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A HR application stores employment records on Amazon S3. Regulations mandate the records are retained for seven years. Once created the records are accessed infrequently for the first three months and then must be available within 10 minutes if required thereafter.Which lifecycle action meets the requirements whilst MINIMIZING cost?", "related_lectures": []}, {"_class": "assessment", "id": 103035793, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A highly elastic application consists of three tiers. The application tier runs in an Auto Scaling group and processes data and writes it to an Amazon RDS MySQL database. The Solutions Architect wants to restrict access to the database tier to only accept traffic from the instances in the application tier. However, instances in the application tier are being constantly launched and terminated.</p><p>How can the Solutions Architect configure secure access to the database tier?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The best option is to configure the database security group to only allow traffic that originates from the application security group. You can also define the destination port as the database port. This setup will allow any instance that is launched and attached to this security group to connect to the database.</p><p><strong>CORRECT: </strong>\"Configure the database security group to allow traffic only from the application security group\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Configure the database security group to allow traffic only from port 3306\" is incorrect. Port 3306 for MySQL should be the destination port, not the source.</p><p><strong>INCORRECT:</strong> \"Configure a Network ACL on the database subnet to deny all traffic to ports other than 3306\" is incorrect. This does not restrict access specifically to the application instances.</p><p><strong>INCORRECT:</strong> \"Configure a Network ACL on the database subnet to allow all traffic from the application subnet\" is incorrect. This does not restrict access specifically to the application instances.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html\">https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Configure the database security group to allow traffic only from the application security group</p>", "<p>Configure the database security group to allow traffic only from port 3306</p>", "<p>Configure a Network ACL on the database subnet to deny all traffic to ports other than 3306</p>", "<p>Configure a Network ACL on the database subnet to allow all traffic from the application subnet</p>"]}, "correct_response": ["a"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A highly elastic application consists of three tiers. The application tier runs in an Auto Scaling group and processes data and writes it to an Amazon RDS MySQL database. The Solutions Architect wants to restrict access to the database tier to only accept traffic from the instances in the application tier. However, instances in the application tier are being constantly launched and terminated.How can the Solutions Architect configure secure access to the database tier?", "related_lectures": []}, {"_class": "assessment", "id": 103035795, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect is rearchitecting an application with decoupling. The application will send batches of up to 1000 messages per second that must be received in the correct order by the consumers.</p><p>Which action should the Solutions Architect take?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Only FIFO queues guarantee the ordering of messages and therefore a standard queue would not work. The FIFO queue supports up to 3,000 messages per second with batching so this is a supported scenario.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-06-28_19-53-23-3f1e752167769131a330719cd1b24d10.png\"></p><p><strong>CORRECT: </strong>\"Create an Amazon SQS FIFO queue\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SQS Standard queue\" is incorrect as it does not guarantee ordering of messages.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SNS topic\" is incorrect. SNS is a notification service and a message queue is a better fit for this use case.</p><p><strong>INCORRECT:</strong> \"Create an AWS Step Functions state machine\" is incorrect. Step Functions is a workflow orchestration service and is not useful for this scenario.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-quotas.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-quotas.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Create an Amazon SQS Standard queue</p>", "<p>Create an Amazon SNS topic</p>", "<p>Create an Amazon SQS FIFO queue</p>", "<p>Create an AWS Step Functions state machine</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A Solutions Architect is rearchitecting an application with decoupling. The application will send batches of up to 1000 messages per second that must be received in the correct order by the consumers.Which action should the Solutions Architect take?", "related_lectures": []}, {"_class": "assessment", "id": 103035797, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect is designing an application that consists of AWS Lambda and Amazon RDS Aurora MySQL. The Lambda function must use database credentials to authenticate to MySQL and security policy mandates that these credentials must not be stored in the function code.</p><p>How can the Solutions Architect securely store the database credentials and make them available to the function?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>In this case the scenario requires that credentials are used for authenticating to MySQL. The credentials need to be securely stored outside of the function code. Systems Manager Parameter Store provides secure, hierarchical storage for configuration data management and secrets management.</p><p>You can easily reference the parameters from services including AWS Lambda as depicted in the diagram below:</p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-06-28_19-54-15-28bb13e5c530a63a9405297b225a7cac.png\"><p><strong>CORRECT: </strong>\"Store the credentials in Systems Manager Parameter Store and update the function code and execution role\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Store the credentials in AWS Key Management Service and use environment variables in the function code pointing to KMS\" is incorrect. You cannot store credentials in KMS, it is used for creating and managing encryption keys</p><p><strong>INCORRECT:</strong> \"Use the AWSAuthenticationPlugin and associate an IAM user account in the MySQL database\" is incorrect. This is a great way to securely authenticate to RDS using IAM users or roles. However, in this case the scenario requires database credentials to be used by the function.</p><p><strong>INCORRECT:</strong> \"Create an IAM policy and store the credentials in the policy. Attach the policy to the Lambda function execution role\" is incorrect. You cannot store credentials in IAM policies.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html</a></p>", "answers": ["<p>Store the credentials in AWS Key Management Service and use environment variables in the function code pointing to KMS</p>", "<p>Store the credentials in Systems Manager Parameter Store and update the function code and execution role</p>", "<p>Use the AWSAuthenticationPlugin and associate an IAM user account in the MySQL database</p>", "<p>Create an IAM policy and store the credentials in the policy. Attach the policy to the Lambda function execution role</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A Solutions Architect is designing an application that consists of AWS Lambda and Amazon RDS Aurora MySQL. The Lambda function must use database credentials to authenticate to MySQL and security policy mandates that these credentials must not be stored in the function code.How can the Solutions Architect securely store the database credentials and make them available to the function?", "related_lectures": []}, {"_class": "assessment", "id": 103035799, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company are finalizing their disaster recovery plan. A limited set of core services will be replicated to the DR site ready to seamlessly take over the in the event of a disaster. All other services will be switched off.</p><p>Which DR strategy is the company using?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>In this DR approach, you simply replicate part of your IT structure for a limited set of core services so that the AWS cloud environment seamlessly takes over in the event of a disaster.</p><p>A small part of your infrastructure is always running simultaneously syncing mutable data (as databases or documents), while other parts of your infrastructure are switched off and used only during testing.</p><p>Unlike a backup and recovery approach, you must ensure that your most critical core elements are already configured and running in AWS (the pilot light). When the time comes for recovery, you can rapidly provision a full-scale production environment around the critical core.</p><p><strong>CORRECT: </strong>\"Pilot light\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Backup and restore\" is incorrect. This is the lowest cost DR approach that simply entails creating online backups of all data and applications.</p><p><strong>INCORRECT:</strong> \"Warm standby\" is incorrect. The term warm standby is used to describe a DR scenario in which a scaled-down version of a fully functional environment is always running in the cloud.</p><p><strong>INCORRECT:</strong> \"Multi-site\" is incorrect. A multi-site solution runs on AWS as well as on your existing on-site infrastructure in an active- active configuration.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/blogs/publicsector/rapidly-recover-mission-critical-systems-in-a-disaster/\">https://aws.amazon.com/blogs/publicsector/rapidly-recover-mission-critical-systems-in-a-disaster/</a></p>", "answers": ["<p>Backup and restore</p>", "<p>Pilot light</p>", "<p>Warm standby</p>", "<p>Multi-site</p>"]}, "correct_response": ["b"], "section": "AWS Cloud Architecture & Design", "question_plain": "A company are finalizing their disaster recovery plan. A limited set of core services will be replicated to the DR site ready to seamlessly take over the in the event of a disaster. All other services will be switched off.Which DR strategy is the company using?", "related_lectures": []}, {"_class": "assessment", "id": 103035801, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application that runs a computational fluid dynamics workload uses a tightly-coupled HPC architecture that uses the MPI protocol and runs across many nodes. A service-managed deployment is required to minimize operational overhead.</p><p>Which deployment option is MOST suitable for provisioning and managing the resources required for this use case?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Batch Multi-node parallel jobs enable you to run single jobs that span multiple Amazon EC2 instances. With AWS Batch multi-node parallel jobs, you can run large-scale, tightly coupled, high performance computing applications and distributed GPU model training without the need to launch, configure, and manage Amazon EC2 resources directly.</p><p>An AWS Batch multi-node parallel job is compatible with any framework that supports IP-based, internode communication, such as Apache MXNet, TensorFlow, Caffe2, or Message Passing Interface (MPI).</p><p>This is the most efficient approach to deploy the resources required and supports the application requirements most effectively.</p><p><strong>CORRECT: </strong>\"Use AWS Batch to deploy a multi-node parallel job\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon EC2 Auto Scaling to deploy instances in multiple subnets \" is incorrect. This is not the best solution for a tightly-coupled HPC workload with specific requirements such as MPI support.</p><p><strong>INCORRECT:</strong> \"Use AWS CloudFormation to deploy a Cluster Placement Group on EC2\" is incorrect. This would deploy a cluster placement group but not manage it. AWS Batch is a better fit for large scale workloads such as this.</p><p><strong>INCORRECT:</strong> \"Use AWS Elastic Beanstalk to provision and manage the EC2 instances\" is incorrect. You can certainly provision and manage EC2 instances with Elastic Beanstalk but this scenario is for a specific workload that requires MPI support and managing a HPC deployment across a large number of nodes. AWS Batch is more suitable.</p><p><strong>References:</strong></p><p><a href=\"https://d1.awsstatic.com/whitepapers/architecture/AWS-HPC-Lens.pdf\">https://d1.awsstatic.com/whitepapers/architecture/AWS-HPC-Lens.pdf</a></p><p><a href=\"https://docs.aws.amazon.com/batch/latest/userguide/multi-node-parallel-jobs.html\">https://docs.aws.amazon.com/batch/latest/userguide/multi-node-parallel-jobs.html</a></p>", "answers": ["<p>Use Amazon EC2 Auto Scaling to deploy instances in multiple subnets</p>", "<p>Use AWS CloudFormation to deploy a Cluster Placement Group on EC2</p>", "<p>Use AWS Batch to deploy a multi-node parallel job</p>", "<p>Use AWS Elastic Beanstalk to provision and manage the EC2 instances</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "An application that runs a computational fluid dynamics workload uses a tightly-coupled HPC architecture that uses the MPI protocol and runs across many nodes. A service-managed deployment is required to minimize operational overhead.Which deployment option is MOST suitable for provisioning and managing the resources required for this use case?", "related_lectures": []}, {"_class": "assessment", "id": 103035803, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect is designing an application that will run on an Amazon EC2 instance. The application must asynchronously invoke an AWS Lambda function to analyze thousands of .CSV files. The services should be decoupled.</p><p>Which service can be used to decouple the compute services?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>You can use a Lambda function to process Amazon Simple Notification Service notifications. Amazon SNS supports Lambda functions as a target for messages sent to a topic. This solution decouples the Amazon EC2 application from Lambda and ensures the Lambda function is invoked.</p><p><strong>CORRECT: </strong>\"Amazon SNS\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon SWF\" is incorrect. The Simple Workflow Service (SWF) is used for process automation. It is not well suited to this requirement.</p><p><strong>INCORRECT:</strong> \"Amazon Kinesis\" is incorrect as this service is used for ingesting and processing real time streaming data, it is not a suitable service to be used solely for invoking a Lambda function.</p><p><strong>INCORRECT:</strong> \"Amazon OpsWorks\" is incorrect as this service is used for configuration management of systems using Chef or Puppet.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-sns.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-sns.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p>", "answers": ["<p>Amazon SWF</p>", "<p>Amazon SNS</p>", "<p>Amazon Kinesis</p>", "<p>Amazon OpsWorks</p>"]}, "correct_response": ["b"], "section": "AWS Application Integration", "question_plain": "A Solutions Architect is designing an application that will run on an Amazon EC2 instance. The application must asynchronously invoke an AWS Lambda function to analyze thousands of .CSV files. The services should be decoupled.Which service can be used to decouple the compute services?", "related_lectures": []}, {"_class": "assessment", "id": 103035805, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A large MongoDB database running on-premises must be migrated to Amazon DynamoDB within the next few weeks. The database is too large to migrate over the company\u2019s limited internet bandwidth so an alternative solution must be used. What should a Solutions Architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Larger data migrations with AWS DMS can include many terabytes of information. This process can be cumbersome due to network bandwidth limits or just the sheer amount of data. AWS DMS can use Snowball Edge and Amazon S3 to migrate large databases more quickly than by other methods.</p><p>When you're using an Edge device, the data migration process has the following stages:</p><p>1. You use the AWS Schema Conversion Tool (AWS SCT) to extract the data locally and move it to an Edge device.</p><p>2. You ship the Edge device or devices back to AWS.</p><p>3. After AWS receives your shipment, the Edge device automatically loads its data into an Amazon S3 bucket.</p><p>4. AWS DMS takes the files and migrates the data to the target data store. If you are using change data capture (CDC), those updates are written to the Amazon S3 bucket and then applied to the target data store.</p><p><strong>CORRECT: </strong>\"Use the Schema Conversion Tool (SCT) to extract and load the data to an AWS Snowball Edge device. Use the AWS Database Migration Service (DMS) to migrate the data to Amazon DynamoDB\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Setup an AWS Direct Connect and migrate the database to Amazon DynamoDB using the AWS Database Migration Service (DMS)\" is incorrect as Direct Connect connections can take several weeks to implement.</p><p><strong>INCORRECT:</strong> \"Enable compression on the MongoDB database and use the AWS Database Migration Service (DMS) to directly migrate the database to Amazon DynamoDB\" is incorrect. It\u2019s unlikely that compression is going to make the difference and the company want to avoid the internet link as stated in the scenario.</p><p><strong>INCORRECT:</strong> \"Use the AWS Database Migration Service (DMS) to extract and load the data to an AWS Snowball Edge device. Complete the migration to Amazon DynamoDB using AWS DMS in the AWS Cloud\" is incorrect. This is the wrong method, the Solutions Architect should use the SCT to extract and load to Snowball Edge and then AWS DMS in the AWS Cloud.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_LargeDBs.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_LargeDBs.html</a></p><p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.DynamoDB.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.DynamoDB.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Setup an AWS Direct Connect and migrate the database to Amazon DynamoDB using the AWS Database Migration Service (DMS)</p>", "<p>Use the Schema Conversion Tool (SCT) to extract and load the data to an AWS Snowball Edge device. Use the AWS Database Migration Service (DMS) to migrate the data to Amazon DynamoDB</p>", "<p>Enable compression on the MongoDB database and use the AWS Database Migration Service (DMS) to directly migrate the database to Amazon DynamoDB</p>", "<p>Use the AWS Database Migration Service (DMS) to extract and load the data to an AWS Snowball Edge device. Complete the migration to Amazon DynamoDB using AWS DMS in the AWS Cloud</p>"]}, "correct_response": ["b"], "section": "AWS Migration & Transfer", "question_plain": "A large MongoDB database running on-premises must be migrated to Amazon DynamoDB within the next few weeks. The database is too large to migrate over the company\u2019s limited internet bandwidth so an alternative solution must be used. What should a Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 103035807, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Every time an item in an Amazon DynamoDB table is modified a record must be retained for compliance reasons. What is the most efficient solution to recording this information?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon DynamoDB Streams captures a time-ordered sequence of item-level modifications in any DynamoDB table and stores this information in a log for up to 24 hours. Applications can access this log and view the data items as they appeared before and after they were modified, in near-real time.</p><p>For example, in the diagram below a DynamoDB stream is being consumed by a Lambda function which processes the item data and records a record in CloudWatch Logs:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-06-28_19-55-43-04c370b6a009c1594a77bd12b9499c3d.png\"></p><p><strong>CORRECT: </strong>\"Enable DynamoDB Streams. Configure an AWS Lambda function to poll the stream and record the modified item data to an Amazon S3 bucket\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Enable Amazon CloudWatch Logs. Configure an AWS Lambda function to monitor the log files and record deleted item data to an Amazon S3 bucket\" is incorrect. The deleted item data will not be recorded in CloudWatch Logs.</p><p><strong>INCORRECT:</strong> \"Enable Amazon CloudTrail. Configure an Amazon EC2 instance to monitor activity in the CloudTrail log files and record changed items in another DynamoDB table\" is incorrect. CloudTrail records API actions so it will not record the data from the item that was modified.</p><p><strong>INCORRECT:</strong> \"Enable DynamoDB Global Tables. Enable DynamoDB streams on the multi-region table and save the output directly to an Amazon S3 bucket\" is incorrect. Global Tables is used for creating a multi-region, multi-master database. It is of no additional value for this requirement as you could just enable DynamoDB streams on the main table. You also cannot save modified data straight to an S3 bucket.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-dynamodb/\">https://digitalcloud.training/amazon-dynamodb/</a></p>", "answers": ["<p>Enable Amazon CloudWatch Logs. Configure an AWS Lambda function to monitor the log files and record deleted item data to an Amazon S3 bucket</p>", "<p>Enable DynamoDB Streams. Configure an AWS Lambda function to poll the stream and record the modified item data to an Amazon S3 bucket</p>", "<p>Enable Amazon CloudTrail. Configure an Amazon EC2 instance to monitor activity in the CloudTrail log files and record changed items in another DynamoDB table</p>", "<p>Enable DynamoDB Global Tables. Enable DynamoDB streams on the multi-region table and save the output directly to an Amazon S3 bucket</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "Every time an item in an Amazon DynamoDB table is modified a record must be retained for compliance reasons. What is the most efficient solution to recording this information?", "related_lectures": []}, {"_class": "assessment", "id": 103035809, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application in a private subnet needs to query data in an Amazon DynamoDB table. Use of the DynamoDB public endpoints must be avoided. What is the most EFFICIENT and secure method of enabling access to the table?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>A VPC endpoint enables you to privately connect your VPC to supported AWS services and VPC endpoint services powered by AWS PrivateLink without requiring an internet gateway, NAT device, VPN connection, or AWS Direct Connect connection.</p><p>Instances in your VPC do not require public IP addresses to communicate with resources in the service. Traffic between your VPC and the other service does not leave the Amazon network.</p><p>With a gateway endpoint you configure your route table to point to the endpoint. Amazon S3 and DynamoDB use gateway endpoints.</p><p>The table below helps you to understand the key differences between the two different types of VPC endpoint:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-06-28_19-56-38-b09d4455515fb71733786fc582abbdfa.png\"></p><p><strong>CORRECT: </strong>\"Create a gateway VPC endpoint and add an entry to the route table\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an interface VPC endpoint in the VPC with an Elastic Network Interface (ENI)\" is incorrect. This would be used for services that are supported by interface endpoints, not gateway endpoints.</p><p><strong>INCORRECT:</strong> \"Create a private Amazon DynamoDB endpoint and connect to it using an AWS VPN\" is incorrect. You cannot create an Amazon DynamoDB private endpoint and connect to it over VPN. Private endpoints are VPC endpoints and are connected to by instances in subnets via route table entries or via ENIs (depending on which service).</p><p><strong>INCORRECT:</strong> \"Create a software VPN between DynamoDB and the application in the private subnet\" is incorrect. You cannot create a software VPN between DynamoDB and an application.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Create an interface VPC endpoint in the VPC with an Elastic Network Interface (ENI)</p>", "<p>Create a gateway VPC endpoint and add an entry to the route table</p>", "<p>Create a private Amazon DynamoDB endpoint and connect to it using an AWS VPN</p>", "<p>Create a software VPN between DynamoDB and the application in the private subnet</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "An application in a private subnet needs to query data in an Amazon DynamoDB table. Use of the DynamoDB public endpoints must be avoided. What is the most EFFICIENT and secure method of enabling access to the table?", "related_lectures": []}, {"_class": "assessment", "id": 103035811, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect needs to select a low-cost, short-term option for adding resilience to an AWS Direct Connect connection. What is the MOST cost-effective solution to provide a backup for the Direct Connect connection?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>This is the most cost-effective solution. With this option both the Direct Connect connection and IPSec VPN are active and being advertised using the Border Gateway Protocol (BGP). The Direct Connect link will always be preferred unless it is unavailable.</p><p><strong>CORRECT: </strong>\"Implement an IPSec VPN connection and use the same BGP prefix\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Implement a second AWS Direct Connection\" is incorrect. This is not a short-term or low-cost option as it takes time to implement and is costly.</p><p><strong>INCORRECT:</strong> \"Configure AWS Transit Gateway with an IPSec VPN backup\" is incorrect. This is a workable solution and provides some advantages. However, you do need to pay for the Transit Gateway so it is not the most cost-effective option and probably not suitable for a short-term need.</p><p><strong>INCORRECT:</strong> \"Configure an IPSec VPN connection over the Direct Connect link\" is incorrect. This is not a solution to the problem as the VPN connection is going over the Direct Connect link. This is something you might do to add encryption to Direct Connect but it doesn\u2019t make it more resilient.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/vpn-connection-as-a-backup-to-aws-dx-connection-example.html\">https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/vpn-connection-as-a-backup-to-aws-dx-connection-example.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-direct-connect/\">https://digitalcloud.training/aws-direct-connect/</a></p>", "answers": ["<p>Implement a second AWS Direct Connection</p>", "<p>Implement an IPSec VPN connection and use the same BGP prefix</p>", "<p>Configure AWS Transit Gateway with an IPSec VPN backup</p>", "<p>Configure an IPSec VPN connection over the Direct Connect link</p>"]}, "correct_response": ["b"], "section": "AWS Networking & Content Delivery", "question_plain": "A Solutions Architect needs to select a low-cost, short-term option for adding resilience to an AWS Direct Connect connection. What is the MOST cost-effective solution to provide a backup for the Direct Connect connection?", "related_lectures": []}, {"_class": "assessment", "id": 103035825, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A computer scientist working for a university is looking to build a machine learning application which will use telemetry data to predict weather for a given area at a given time. This application would benefit from using managed services and will need to find a solution which uses third party data within the application.</p><p><br></p><p>Which of the following combinations of services will deliver the best solution?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon SageMaker allows you to build, train, and deploy machine learning models for any use case with fully managed infrastructure, tools, and workflows. AWS Data Exchange allows you to gain access to third party data sets across Automotive, Financial Services, Gaming, Healthcare &amp; Life Sciences, Manufacturing, Marketing, Media &amp; Entertainment, Retail, and many more industries.</p><p><strong>CORRECT: </strong>\"Use Amazon SageMaker to build the machine learning part of the application and use AWS Data Exchange to gain access to the third-party telemetry data\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Use Amazon SageMaker to build the machine learning part of the application and use AWS DataSync to gain access to the third-party telemetry data\u201d is incorrect. AWS DataSync is a secure, online service that automates and accelerates moving data between on-premises and AWS storage services. It does not give access to third party data.</p><p><strong>INCORRECT:</strong> \"Use a TensorFlow AMI from the AWS Marketplace to build the machine learning part of the application and use AWS DataSync to gain access to the third-party telemetry data\u201d is incorrect. Building an EC2 instance from a TensorFlow AMI would not involve using managed services and AWS DataSync is a secure, online service that automates and accelerates moving data between on-premises and AWS storage services. It does not give access to third party data.</p><p><strong>INCORRECT:</strong> \"Use a TensorFlow AMI from the AWS Marketplace to build the machine learning part of the application and use AWS Data Exchange to gain access to the third-party telemetry data\u201d is incorrect. Building an EC2 instance from a TensorFlow AMI would not involve using managed services.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/data-exchange/\">https://aws.amazon.com/data-exchange/</a></p>", "answers": ["<p>Use Amazon SageMaker to build the machine learning part of the application and use AWS DataSync to gain access to the third-party telemetry data.</p>", "<p>Use a TensorFlow AMI from the AWS Marketplace to build the machine learning part of the application and use AWS DataSync to gain access to the third-party telemetry data.</p>", "<p>Use a TensorFlow AMI from the AWS Marketplace to build the machine learning part of the application and use AWS Data Exchange to gain access to the third-party telemetry data.</p>", "<p>Use Amazon SageMaker to build the machine learning part of the application and use AWS Data Exchange to gain access to the third-party telemetry data.</p>"]}, "correct_response": ["d"], "section": "AWS Machine Learning", "question_plain": "A computer scientist working for a university is looking to build a machine learning application which will use telemetry data to predict weather for a given area at a given time. This application would benefit from using managed services and will need to find a solution which uses third party data within the application.Which of the following combinations of services will deliver the best solution?", "related_lectures": []}, {"_class": "assessment", "id": 103035827, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A financial institution with many departments wants to migrate to the AWS Cloud from their data center. Each department should have their own established AWS accounts with preconfigured, Limited access to authorized services, based on each team's needs, by the principle of least privilege.</p><p>What actions should be taken to ensure compliance with these security requirements?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Control Tower automates the setup of a new landing zone using best practices blueprints for identity, federated access, and account structure.</p><p>The account factory automates provisioning of new accounts in your organization. As a configurable account template, it helps you standardize the provisioning of new accounts with pre-approved account configurations. You can configure your account factory with pre-approved network configuration and region selections.</p><p><strong>CORRECT: </strong>\"Deploy a Landing Zone within AWS Control Tower. Allow department administrators to use the Landing Zone to create new member accounts and networking. Grant the department's AWS power user permissions on the created accounts\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Use AWS CloudFormation to create new member accounts and networking and use IAM roles to allow access to approved AWS services\u201d is incorrect. Although you could perhaps make new AWS Accounts with AWS CloudFormation, the easiest way to do that is by using AWS Control Tower.</p><p><strong>INCORRECT:</strong> \"Configure AWS Organizations with SCPs and create new member accounts. Use AWS CloudFormation templates to configure the member account networking\u201d is incorrect. You can make new accounts using AWS Organizations however the easiest way to do this is by using the AWS Control Tower service.</p><p><strong>INCORRECT:</strong> \"Deploy a Landing Zone within AWS Organizations. Allow department administrators to use the Landing Zone to create new member accounts and networking. Grant the department's AWS power user permissions on the created accounts\u201d is incorrect. Landing Zones do not get deployed within AWS Organizations.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/controltower/\">https://aws.amazon.com/controltower/</a></p>", "answers": ["<p>Use AWS CloudFormation to create new member accounts and networking and use IAM roles to allow access to approved AWS services.</p>", "<p>Deploy a Landing Zone within AWS Control Tower. Allow department administrators to use the Landing Zone to create new member accounts and networking. Grant the department's AWS power user permissions on the created accounts.</p>", "<p>Configure AWS Organizations with SCPs and create new member accounts. Use AWS CloudFormation templates to configure the member account networking.</p>", "<p>Deploy a Landing Zone within AWS Organizations. Allow department administrators to use the Landing Zone to create new member accounts and networking. Grant the department's AWS power user permissions on the created accounts.</p>"]}, "correct_response": ["b"], "section": "AWS Management & Governance", "question_plain": "A financial institution with many departments wants to migrate to the AWS Cloud from their data center. Each department should have their own established AWS accounts with preconfigured, Limited access to authorized services, based on each team's needs, by the principle of least privilege.What actions should be taken to ensure compliance with these security requirements?", "related_lectures": []}, {"_class": "assessment", "id": 103035829, "assessment_type": "multiple-choice", "prompt": {"question": "<p>As part of a company\u2019s shift to the AWS cloud, they need to gain an insight into their total on-premises footprint. They have discovered that they are currently struggling with managing their software licenses. They would like to maintain a hybrid cloud setup, with some of their licenses stored in the cloud with some stored on-premises.</p><p><br></p><p>What actions should be taken to ensure they are managing the licenses appropriately going forward?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS License Manager makes it easier to manage your software licenses from vendors such as Microsoft, SAP, Oracle, and IBM across AWS and on-premises environments. AWS License Manager lets administrators create customized licensing rules that mirror the terms of their licensing agreements.</p><p><strong>CORRECT: </strong>\"Use AWS License Manager to manage the software licenses\" is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Use AWS Secrets Manager to store the licenses as secrets to ensure they are stored securely\" is incorrect. AWS Secrets Manager helps you protect secrets needed to access your applications, services, and IT resources. This does not include license keys.</p><p><strong>INCORRECT:</strong> \"Use the AWS Key Management Service to treat the license key safely and store it securely\" is incorrect. AWS Key Management Service (AWS KMS) makes it easy for you to create and manage cryptographic keys and control their use across a wide range of AWS services and in your applications, not license keys.</p><p><strong>INCORRECT:</strong> \"Use Amazon S3 with governance lock to manage the storage of the licenses\" is incorrect. Amazon S3 is not designed to store software licenses.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/license-manager/\">https://aws.amazon.com/license-manager/</a></p>", "answers": ["<p>Use AWS Secrets Manager to store the licenses as secrets to ensure they are stored securely</p>", "<p>Use the AWS Key Management Service to treat the license key safely and store it securely</p>", "<p>Use AWS License Manager to manage the software licenses</p>", "<p>Use Amazon S3 with governance lock to manage the storage of the licenses</p>"]}, "correct_response": ["c"], "section": "AWS Management & Governance", "question_plain": "As part of a company\u2019s shift to the AWS cloud, they need to gain an insight into their total on-premises footprint. They have discovered that they are currently struggling with managing their software licenses. They would like to maintain a hybrid cloud setup, with some of their licenses stored in the cloud with some stored on-premises.What actions should be taken to ensure they are managing the licenses appropriately going forward?", "related_lectures": []}, {"_class": "assessment", "id": 103035831, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect has been tasked with building an application which stores images to be used for a website. The website will be accessed by thousands of customers. The images within the application need to be able to be transformed and processed as they are being retrieved. The solutions architect would prefer to use managed services to achieve this, and the solution should be highly available and scalable, and be able to serve users from around the world with low latency.</p><p><br></p><p>Which scenario represents the easiest solution for this task?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>With S3 Object Lambda you can add your own code to S3 GET requests to modify and process data as it is returned to an application. For the first time, you can use custom code to modify the data returned by standard S3 GET requests to filter rows, dynamically resize images, redact confidential data, and much more. Powered by AWS Lambda functions, your code runs on infrastructure that is fully managed by AWS, eliminating the need to create and store derivative copies of your data or to run expensive proxies, all with no changes required to your applications.</p><p><strong>CORRECT: </strong>\"Store the images in Amazon S3, behind a CloudFront distribution. Use S3 Object Lambda to transform and process the images whenever a GET request is initiated on an object\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Store the images in a DynamoDB table, with DynamoDB Global Tables enabled. Provision a Lambda function to process the data on demand as it leaves the table\u201d is incorrect. DynamoDB is not as well designed for Write Once Read Many workloads and adding a Lambda function to the DynamoDB table takes more manual provisioning of resources than using S3 Object Lambda.</p><p><strong>INCORRECT:</strong> \"Store the images in Amazon S3, behind a CloudFront distribution. Use S3 Event Notifications to connect to a Lambda function to process and transform the images when a GET request is initiated on an object\u201d is incorrect. This would work; however it is easier to use S3 Object Lambda as this manages the Lambda function for you.</p><p><strong>INCORRECT:</strong> \"Store the images in a DynamoDB table, with DynamoDB Accelerator enabled. Use Amazon EventBridge to pass the data into an event bus as it is retrieved from DynamoDB and use AWS Lambda to process the data\u201d is incorrect. DynamoDB is not as well designed for Write Once Read Many workloads and adding a Lambda function to the DynamoDB table takes more manual provisioning of resources than using S3 Object Lambda.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/s3/features/object-lambda/\">https://aws.amazon.com/s3/features/object-lambda/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p>", "answers": ["<p>Store the images in a DynamoDB table, with DynamoDB Global Tables enabled. Provision a Lambda function to process the data on demand as it leaves the table.</p>", "<p>Store the images in Amazon S3, behind a CloudFront distribution. Use S3 Event Notifications to connect to a Lambda function to process and transform the images when a GET request is initiated on an object.</p>", "<p>Store the images in Amazon S3, behind a CloudFront distribution. Use S3 Object Lambda to transform and process the images whenever a GET request is initiated on an object.</p>", "<p>Store the images in a DynamoDB table, with DynamoDB Accelerator enabled. Use Amazon EventBridge to pass the data into an event bus as it is retrieved from DynamoDB and use AWS Lambda to process the data.</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A Solutions Architect has been tasked with building an application which stores images to be used for a website. The website will be accessed by thousands of customers. The images within the application need to be able to be transformed and processed as they are being retrieved. The solutions architect would prefer to use managed services to achieve this, and the solution should be highly available and scalable, and be able to serve users from around the world with low latency.Which scenario represents the easiest solution for this task?", "related_lectures": []}, {"_class": "assessment", "id": 103035833, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect for a large banking company is configuring access control within the organization for an Amazon S3 bucket containing thousands of financial records. There are 20 different teams which need to have access to this bucket, however they all need different permissions. These 20 teams correspond to 20 accounts within the banking company who are currently using AWS Organizations.</p><p><br></p><p>What is the simplest way to achieve this, whilst adhering to the principle of least privilege?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon S3 Access Points, a feature of S3, simplify data access for any AWS service or customer application that stores data in S3. With S3 Access Points, customers can create unique access control policies for each access point to easily control access to shared datasets. You can also control access point usage using AWS Organizations support for AWS SCPs.</p><p><strong>CORRECT: </strong>\"Use S3 Access points to administer different access policies to each team, and control access points using Service Control Policies within AWS Organizations\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Create a new AWS Organizations. Assign each team to a different Organizational Unit and apply to appropriate permissions granting access to the appropriate resources in the bucket\u201d is incorrect. This would not only be incredibly time consuming but totally unnecessary as you can use the preexisting AWS Organizations and the Service Control policies to control access via S3 Access Points.</p><p><strong>INCORRECT:</strong> \"Copy the items from the bucket to create separate versions of each Separate the items in the bucket into new buckets. Administer Bucket policies to allow each account to access the appropriate bucket\u201d is incorrect. This involves a lot of operational overhead and would be prone to significant error when administering the correct permissions to each account.</p><p><strong>INCORRECT:</strong> \"Create the S3 Bucket in an individual account. Configure an IAM Role for each user to enable cross account access for the S3 Bucket with a permissions policy to only access the appropriate items within the bucket\u201d is incorrect. This is an unnecessary complexity as it would be much easier to provision separate policies per team using S3 Access Points.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/s3/features/access-points/\">https://aws.amazon.com/s3/features/access-points/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Create a new AWS Organizations. Assign each team to a different Organizational Unit and apply to appropriate permissions granting access to the appropriate resources in the bucket.</p>", "<p>Copy the items from the bucket to create separate versions of each Separate the items in the bucket into new buckets. Administer Bucket policies to allow each account to access the appropriate bucket.</p>", "<p>Use S3 Access points to administer different access policies to each team, and control access points using Service Control Policies within AWS Organizations.</p>", "<p>Create the S3 Bucket in an individual account. Configure an IAM Role for each user to enable cross account access for the S3 Bucket with a permissions policy to only access the appropriate items within the bucket.</p>"]}, "correct_response": ["c"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A Solutions Architect for a large banking company is configuring access control within the organization for an Amazon S3 bucket containing thousands of financial records. There are 20 different teams which need to have access to this bucket, however they all need different permissions. These 20 teams correspond to 20 accounts within the banking company who are currently using AWS Organizations.What is the simplest way to achieve this, whilst adhering to the principle of least privilege?", "related_lectures": []}, {"_class": "assessment", "id": 103035835, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect is tasked with designing a fully Serverless, Microservices based web application which requires the use of a GraphQL API to provide a single entry point to the application.</p><p>Which AWS managed service could the Solutions Architect use?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS AppSync is a serverless GraphQL and Pub/Sub API service that simplifies building modern web and mobile applications.</p><p>AWS AppSync GraphQL APIs simplify application development by providing a single endpoint to securely query or update data from multiple databases, microservices, and APIs.</p><p><strong>CORRECT: </strong>\"AWS AppSync\" is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"API Gateway\" is incorrect. You cannot create GraphQL APIs on API Gateway.</p><p><strong>INCORRECT:</strong> \"Amazon Athena\" is incorrect. Amazon Athena is a Serverless query service where you can query S3 using SQL statements.</p><p><strong>INCORRECT:</strong> \"AWS Lambda\" is incorrect. AWS Lambda is a serverless compute service and is not designed to build APIs.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/appsync/\">https://aws.amazon.com/appsync/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/category/aws-cheat-sheets/aws-networking-content-delivery/\">https://digitalcloud.training/category/aws-cheat-sheets/aws-networking-content-delivery/</a></p>", "answers": ["<p>API Gateway</p>", "<p>Amazon Athena</p>", "<p>AWS AppSync</p>", "<p>AWS Lambda</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A Solutions Architect is tasked with designing a fully Serverless, Microservices based web application which requires the use of a GraphQL API to provide a single entry point to the application.Which AWS managed service could the Solutions Architect use?", "related_lectures": []}, {"_class": "assessment", "id": 103035817, "assessment_type": "multiple-choice", "prompt": {"question": "<p>The Chief Financial Officer of a large corporation is looking for an AWS native tool which will help reduce their cloud spend. After receiving a budget alarm, the company has decided that they need to reduce their spend across their different areas of compute and need insights into their spend to decide where they can reduce cost. </p><p>What is the easiest way to achieve this goal?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Compute Optimizer helps you identify the optimal AWS resource configurations, such as Amazon Elastic Compute Cloud (EC2) instance types, Amazon Elastic Block Store (EBS) volume configurations, and AWS Lambda function memory sizes, using machine learning to analyze historical utilization metrics. AWS Compute Optimizer provides a set of APIs and a console experience to help you reduce costs and increase workload performance by recommending the optimal AWS resources for your AWS workloads.</p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2022-08-27_10-50-15-dfca99833259eb55e7d690aacd0593d3.jpg\"><p><strong>CORRECT: </strong>\"AWS Compute Optimizer\" is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"AWS Trusted Advisor\" is incorrect. Whilst
