ct is creating a document submission application for a school. The application will use an Amazon S3 bucket for storage. The solution must prevent accidental deletion of the documents and ensure that all versions of the documents are available. Users must be able to upload and modify the documents.Which combination of actions should be taken to meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035879, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A solutions architect is designing an application on AWS. The compute layer will run in parallel across EC2 instances. The compute layer should scale based on the number of jobs to be processed. The compute layer is stateless. The solutions architect must ensure that the application is loosely coupled and the job items are durably stored.</p><p>Which design should the solutions architect use?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>In this case we need to find a durable and loosely coupled solution for storing jobs. Amazon SQS is ideal for this use case and can be configured to use dynamic scaling based on the number of jobs waiting in the queue.</p><p>To configure this scaling you can use the <em>backlog per instance</em> metric with the target value being the <em>acceptable backlog per instance</em> to maintain. You can calculate these numbers as follows:</p><ul><li><p><strong>Backlog per instance</strong>: To calculate your backlog per instance, start with the ApproximateNumberOfMessages queue attribute to determine the length of the SQS queue (number of messages available for retrieval from the queue). Divide that number by the fleet's running capacity, which for an Auto Scaling group is the number of instances in the InService state, to get the backlog per instance.</p></li><li><p><strong>Acceptable backlog per instance</strong>: To calculate your target value, first determine what your application can accept in terms of latency. Then, take the acceptable latency value and divide it by the average time that an EC2 instance takes to process a message.</p></li></ul><p>This solution will scale EC2 instances using Auto Scaling based on the number of jobs waiting in the SQS queue.</p><p><strong>CORRECT: </strong>\"Create an Amazon SQS queue to hold the jobs that needs to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on the number of items in the SQS queue\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SQS queue to hold the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on network usage\" is incorrect as scaling on network usage does not relate to the number of jobs waiting to be processed.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SNS topic to send the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on CPU usage\" is incorrect. Amazon SNS is a notification service so it delivers notifications to subscribers. It does store data durably but is less suitable than SQS for this use case. Scaling on CPU usage is not the best solution as it does not relate to the number of jobs waiting to be processed.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SNS topic to send the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on the number of messages published to the SNS topic\" is incorrect. Amazon SNS is a notification service so it delivers notifications to subscribers. It does store data durably but is less suitable than SQS for this use case. Scaling on the number of notifications in SNS is not possible.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Create an Amazon SNS topic to send the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on CPU usage</p>", "<p>Create an Amazon SQS queue to hold the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on network usage</p>", "<p>Create an Amazon SQS queue to hold the jobs that needs to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on the number of items in the SQS queue</p>", "<p>Create an Amazon SNS topic to send the jobs that need to be processed. Create an Amazon EC2 Auto Scaling group for the compute application. Set the scaling policy for the Auto Scaling group to add and remove nodes based on the number of messages published to the SNS topic</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A solutions architect is designing an application on AWS. The compute layer will run in parallel across EC2 instances. The compute layer should scale based on the number of jobs to be processed. The compute layer is stateless. The solutions architect must ensure that the application is loosely coupled and the job items are durably stored.Which design should the solutions architect use?", "related_lectures": []}, {"_class": "assessment", "id": 103035881, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A team are planning to run analytics jobs on log files each day and require a storage solution. The size and number of logs is unknown and data will persist for 24 hours only.</p><p>What is the MOST cost-effective solution?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>S3 standard is the best choice in this scenario for a short term storage solution. In this case the size and number of logs is unknown and it would be difficult to fully assess the access patterns at this stage. Therefore, using S3 standard is best as it is cost-effective, provides immediate access, and there are no retrieval fees or minimum capacity charge per object.</p><p><strong>CORRECT: </strong>\"Amazon S3 Standard\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon S3 Intelligent-Tiering\" is incorrect as there is an additional fee for using this service and for a short-term requirement it may not be beneficial.</p><p><strong>INCORRECT:</strong> \"Amazon S3 One Zone-Infrequent Access (S3 One Zone-IA)\" is incorrect as this storage class has a minimum capacity charge per object (128 KB) and a per GB retrieval fee.</p><p><strong>INCORRECT:</strong> \"Amazon S3 Glacier Deep Archive\" is incorrect as this storage class is used for archiving data. There are retrieval fees and it take hours to retrieve data from an archive.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Amazon S3 Glacier Deep Archive</p>", "<p>Amazon S3 Standard</p>", "<p>Amazon S3 Intelligent-Tiering</p>", "<p>Amazon S3 One Zone-Infrequent Access (S3 One Zone-IA)</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A team are planning to run analytics jobs on log files each day and require a storage solution. The size and number of logs is unknown and data will persist for 24 hours only.What is the MOST cost-effective solution?", "related_lectures": []}, {"_class": "assessment", "id": 103035883, "assessment_type": "multi-select", "prompt": {"question": "<p>A company runs a web application that serves weather updates. The application runs on a fleet of Amazon EC2 instances in a Multi-AZ Auto scaling group behind an Application Load Balancer (ALB). The instances store data in an Amazon Aurora database. A solutions architect needs to make the application more resilient to sporadic increases in request rates.</p><p>Which architecture should the solutions architect implement? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>The architecture is already highly resilient but may be subject to performance degradation if there are sudden increases in request rates. To resolve this situation Amazon Aurora Read Replicas can be used to serve read traffic which offloads requests from the main database. On the frontend an Amazon CloudFront distribution can be placed in front of the ALB and this will cache content for better performance and also offloads requests from the backend.</p><p><strong>CORRECT: </strong>\"Add Amazon Aurora Replicas\" is the correct answer.</p><p><strong>CORRECT: </strong>\"Add an Amazon CloudFront distribution in front of the ALB\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Add and AWS WAF in front of the ALB\" is incorrect. A web application firewall protects applications from malicious attacks. It does not improve performance.</p><p><strong>INCORRECT:</strong> \"Add an AWS Transit Gateway to the Availability Zones\" is incorrect as this is used to connect on-premises networks to VPCs.</p><p><strong>INCORRECT:</strong> \"Add an AWS Global Accelerator endpoint\" is incorrect as this service is used for directing users to different instances of the application in different regions based on latency.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html</a></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-aurora/\">https://digitalcloud.training/amazon-aurora/</a></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Add and AWS WAF in front of the ALB</p>", "<p>Add Amazon Aurora Replicas</p>", "<p>Add an AWS Transit Gateway to the Availability Zones</p>", "<p>Add an AWS Global Accelerator endpoint</p>", "<p>Add an Amazon CloudFront distribution in front of the ALB</p>"]}, "correct_response": ["b", "e"], "section": "AWS Database", "question_plain": "A company runs a web application that serves weather updates. The application runs on a fleet of Amazon EC2 instances in a Multi-AZ Auto scaling group behind an Application Load Balancer (ALB). The instances store data in an Amazon Aurora database. A solutions architect needs to make the application more resilient to sporadic increases in request rates.Which architecture should the solutions architect implement? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035885, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A solutions architect is designing the infrastructure to run an application on Amazon EC2 instances. The application requires high availability and must dynamically scale based on demand to be cost efficient.</p><p>What should the solutions architect do to meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>The Amazon EC2-based application must be highly available and elastically scalable. Auto Scaling can provide the elasticity by dynamically launching and terminating instances based on demand. This can take place across availability zones for high availability.</p><p>Incoming connections can be distributed to the instances by using an Application Load Balancer (ALB).</p><p><strong>CORRECT: </strong>\"Configure an Application Load Balancer in front of an Auto Scaling group to deploy instances to multiple Availability Zones\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Configure an Amazon API Gateway API in front of an Auto Scaling group to deploy instances to multiple Availability Zones\" is incorrect as API gateway is not used for load balancing connections to Amazon EC2 instances.</p><p><strong>INCORRECT:</strong> \"Configure an Application Load Balancer in front of an Auto Scaling group to deploy instances to multiple Regions\" is incorrect as you cannot launch instances in multiple Regions from a single Auto Scaling group.</p><p><strong>INCORRECT:</strong> \"Configure an Amazon CloudFront distribution in front of an Auto Scaling group to deploy instances to multiple Regions\" is incorrect as you cannot launch instances in multiple Regions from a single Auto Scaling group.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p><p><a href=\"https://aws.amazon.com/elasticloadbalancing/\">https://aws.amazon.com/elasticloadbalancing/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p><p><a href=\"https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/\">https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/</a></p>", "answers": ["<p>Configure an Application Load Balancer in front of an Auto Scaling group to deploy instances to multiple Regions</p>", "<p>Configure an Amazon CloudFront distribution in front of an Auto Scaling group to deploy instances to multiple Regions</p>", "<p>Configure an Application Load Balancer in front of an Auto Scaling group to deploy instances to multiple Availability Zones</p>", "<p>Configure an Amazon API Gateway API in front of an Auto Scaling group to deploy instances to multiple Availability Zones</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A solutions architect is designing the infrastructure to run an application on Amazon EC2 instances. The application requires high availability and must dynamically scale based on demand to be cost efficient.What should the solutions architect do to meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 103035887, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An organization want to share regular updates about their charitable work using static webpages. The pages are expected to generate a large amount of views from around the world. The files are stored in an Amazon S3 bucket. A solutions architect has been asked to design an efficient and effective solution.</p><p>Which action should the solutions architect take to accomplish this?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon CloudFront can be used to cache the files in edge locations around the world and this will improve the performance of the webpages.</p><p>To serve a static website hosted on Amazon S3, you can deploy a CloudFront distribution using one of these configurations:</p><ul><li><p>Using a REST API endpoint as the origin with access restricted by an <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\">origin access identity (OAI)</a></p></li><li><p>Using a website endpoint as the origin with anonymous (public) access allowed</p></li><li><p>Using a website endpoint as the origin with access restricted by a Referer header</p></li></ul><p><strong>CORRECT: </strong>\"Use Amazon CloudFront with the S3 bucket as its origin\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Generate presigned URLs for the files\" is incorrect as this is used to restrict access which is not a requirement.</p><p><strong>INCORRECT:</strong> \"Use cross-Region replication to all Regions\" is incorrect as this does not provide a mechanism for directing users to the closest copy of the static webpages.</p><p><strong>INCORRECT:</strong> \"Use the geoproximity feature of Amazon Route 53\" is incorrect as this does not include a solution for having multiple copies of the data in different geographic lcoations.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/cloudfront-serve-static-website/\">https://aws.amazon.com/premiumsupport/knowledge-center/cloudfront-serve-static-website/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Generate presigned URLs for the files</p>", "<p>Use cross-Region replication to all Regions</p>", "<p>Use the geoproximity feature of Amazon Route 53</p>", "<p>Use Amazon CloudFront with the S3 bucket as its origin</p>"]}, "correct_response": ["d"], "section": "AWS Networking & Content Delivery", "question_plain": "An organization want to share regular updates about their charitable work using static webpages. The pages are expected to generate a large amount of views from around the world. The files are stored in an Amazon S3 bucket. A solutions architect has been asked to design an efficient and effective solution.Which action should the solutions architect take to accomplish this?", "related_lectures": []}, {"_class": "assessment", "id": 103035889, "assessment_type": "multi-select", "prompt": {"question": "<p>A web application runs in public and private subnets. The application architecture consists of a web tier and database tier running on Amazon EC2 instances. Both tiers run in a single Availability Zone (AZ).</p><p>Which combination of steps should a solutions architect take to provide high availability for this architecture? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>To add high availability to this architecture both the web tier and database tier require changes. For the web tier an Auto Scaling group across multiple AZs with an ALB will ensure there are always instances running and traffic is being distributed to them.</p><p>The database tier should be migrated from the EC2 instances to Amazon RDS to take advantage of a managed database with Multi-AZ functionality. This will ensure that if there is an issue preventing access to the primary database a secondary database can take over.</p><p><strong>CORRECT: </strong>\"Create an Amazon EC2 Auto Scaling group and Application Load Balancer (ALB) spanning multiple AZs\" is the correct answer.</p><p><strong>CORRECT: </strong>\"Create new public and private subnets in the same VPC, each in a new AZ. Migrate the database to an Amazon RDS multi-AZ deployment\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create new public and private subnets in the same AZ for high availability\" is incorrect as this would not add high availability.</p><p><strong>INCORRECT:</strong> \"Add the existing web application instances to an Auto Scaling group behind an Application Load Balancer (ALB)\" is incorrect because the existing servers are in a single subnet. For HA we need to instances in multiple subnets.</p><p><strong>INCORRECT:</strong> \"Create new public and private subnets in a new AZ. Create a database using Amazon EC2 in one AZ\" is incorrect because we also need HA for the database layer.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html</a></p><p><a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/\">https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/</a></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>1. Create new public and private subnets in the same AZ for high availability</p>", "<p>1. Create an Amazon EC2 Auto Scaling group and Application Load Balancer (ALB) spanning multiple AZs</p>", "<p>1. Add the existing web application instances to an Auto Scaling group behind an Application Load Balancer (ALB)</p>", "<p>1. Create new public and private subnets in a new AZ. Create a database using Amazon EC2 in one AZ</p>", "<p>1. Create new public and private subnets in the same VPC, each in a new AZ. Migrate the database to an Amazon RDS multi-AZ deployment</p>"]}, "correct_response": ["b", "e"], "section": "AWS Compute", "question_plain": "A web application runs in public and private subnets. The application architecture consists of a web tier and database tier running on Amazon EC2 instances. Both tiers run in a single Availability Zone (AZ).Which combination of steps should a solutions architect take to provide high availability for this architecture? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035891, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An Amazon RDS Read Replica is being deployed in a separate region. The master database is not encrypted but all data in the new region must be encrypted. How can this be achieved?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>You cannot create an encrypted Read Replica from an unencrypted master DB instance. You also cannot enable encryption after launch time for the master DB instance. Therefore, you must create a new master DB by taking a snapshot of the existing DB, encrypting it, and then creating the new DB from the snapshot. You can then create the encrypted cross-region Read Replica of the master DB.</p><p><strong>CORRECT: </strong>\"Encrypt a snapshot from the master DB instance, create a new encrypted master DB instance, and then create an encrypted cross-region Read Replica\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Enable encryption using Key Management Service (KMS) when creating the cross-region Read Replica\" is incorrect. All other options will not work due to the limitations explained above.</p><p><strong>INCORRECT:</strong> \"Encrypt a snapshot from the master DB instance, create an encrypted cross-region Read Replica from the snapshot\" is incorrect. All other options will not work due to the limitations explained above.</p><p><strong>INCORRECT:</strong> \"Enabled encryption on the master DB instance, then create an encrypted cross-region Read Replica\" is incorrect. All other options will not work due to the limitations explained above.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a></p><p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Enable encryption using Key Management Service (KMS) when creating the cross-region Read Replica</p>", "<p>Encrypt a snapshot from the master DB instance, create an encrypted cross-region Read Replica from the snapshot</p>", "<p>Enabled encryption on the master DB instance, then create an encrypted cross-region Read Replica</p>", "<p>Encrypt a snapshot from the master DB instance, create a new encrypted master DB instance, and then create an encrypted cross-region Read Replica</p>"]}, "correct_response": ["d"], "section": "AWS Database", "question_plain": "An Amazon RDS Read Replica is being deployed in a separate region. The master database is not encrypted but all data in the new region must be encrypted. How can this be achieved?", "related_lectures": []}, {"_class": "assessment", "id": 103035893, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A legacy tightly-coupled High Performance Computing (HPC) application will be migrated to AWS. Which network adapter type should be used?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>An Elastic Fabric Adapter is an AWS Elastic Network Adapter (ENA) with added capabilities. The EFA lets you apply the scale, flexibility, and elasticity of the AWS Cloud to tightly-coupled HPC apps. It is ideal for tightly coupled app as it uses the Message Passing Interface (MPI).</p><p><strong>CORRECT: </strong>\"Elastic Fabric Adapter (EFA)\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Elastic Network Interface (ENI)\" is incorrect. The ENI is a basic type of adapter and is not the best choice for this use case.</p><p><strong>INCORRECT:</strong> \"Elastic Network Adapter (ENA)\" is incorrect. The ENA, which provides Enhanced Networking, does provide high bandwidth and low inter-instance latency but it does not support the features for a tightly-coupled app that the EFA does.</p><p><strong>INCORRECT:</strong> \"Elastic IP Address\" is incorrect. An Elastic IP address is just a static public IP address, it is not a type of network adapter.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/blogs/aws/now-available-elastic-fabric-adapter-efa-for-tightly-coupled-hpc-workloads/\">https://aws.amazon.com/blogs/aws/now-available-elastic-fabric-adapter-efa-for-tightly-coupled-hpc-workloads/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Elastic Network Interface (ENI)</p>", "<p>Elastic Network Adapter (ENA)</p>", "<p>Elastic Fabric Adapter (EFA)</p>", "<p>Elastic IP Address</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A legacy tightly-coupled High Performance Computing (HPC) application will be migrated to AWS. Which network adapter type should be used?", "related_lectures": []}, {"_class": "assessment", "id": 103035895, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application running on an Amazon ECS container instance using the EC2 launch type needs permissions to write data to Amazon DynamoDB.</p><p>How can you assign these permissions only to the specific ECS task that is running the application?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>To specify permissions for a specific task on Amazon ECS you should use IAM Roles for Tasks. The permissions policy can be applied to tasks when creating the task definition, or by using an IAM task role override using the AWS CLI or SDKs. The <em>taskRoleAr</em>n parameter is used to specify the policy.</p><p><strong>CORRECT: </strong>\"Create an IAM policy with permissions to DynamoDB and assign It to a task using the <em>taskRoleArn</em> parameter\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an IAM policy with permissions to DynamoDB and attach it to the container instance\" is incorrect. You should not apply the permissions to the container instance as they will then apply to all tasks running on the instance as well as the instance itself.</p><p><strong>INCORRECT:</strong> \"Use a security group to allow outbound connections to DynamoDB and assign it to the container instance\" is incorrect. Though you will need a security group to allow outbound connections to DynamoDB, the question is asking how to assign permissions to write data to DynamoDB and a security group cannot provide those permissions.</p><p><strong>INCORRECT:</strong> \"Modify the <em>AmazonECSTaskExecutionRolePolicy</em> policy to add permissions for DynamoDB\" is incorrect. The <em>AmazonECSTaskExecutionRolePolicy</em> policy is the Task Execution IAM Role. This is used by the container agent to be able to pull container images, write log file etc.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ecs-and-eks/\">https://digitalcloud.training/amazon-ecs-and-eks/</a></p>", "answers": ["<p>Create an IAM policy with permissions to DynamoDB and attach it to the container instance</p>", "<p>Create an IAM policy with permissions to DynamoDB and assign It to a task using the <em>taskRoleArn</em> parameter</p>", "<p>Use a security group to allow outbound connections to DynamoDB and assign it to the container instance</p>", "<p>Modify the <em>AmazonECSTaskExecutionRolePolicy</em> policy to add permissions for DynamoDB</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "An application running on an Amazon ECS container instance using the EC2 launch type needs permissions to write data to Amazon DynamoDB.How can you assign these permissions only to the specific ECS task that is running the application?", "related_lectures": []}, {"_class": "assessment", "id": 103035897, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An organization has a large amount of data on Windows (SMB) file shares in their on-premises data center. The organization would like to move data into Amazon S3. They would like to automate the migration of data over their AWS Direct Connect link.</p><p>Which AWS service can assist them?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>AWS DataSync can be used to move large amounts of data online between on-premises storage and Amazon S3 or Amazon Elastic File System (Amazon EFS). DataSync eliminates or automatically handles many of these tasks, including scripting copy jobs, scheduling and monitoring transfers, validating data, and optimizing network utilization. The source datastore can be Server Message Block (SMB) file servers.</p><p><strong>CORRECT: </strong>\"AWS DataSync\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"AWS Database Migration Service (DMS)\" is incorrect. AWS Database Migration Service (DMS) is used for migrating databases, not data on file shares.</p><p><strong>INCORRECT:</strong> \"AWS CloudFormation\" is incorrect. AWS CloudFormation can be used for automating infrastructure provisioning. This is not the best use case for CloudFormation as DataSync is designed specifically for this scenario.</p><p><strong>INCORRECT:</strong> \"AWS Snowball\" is incorrect. AWS Snowball is a hardware device that is used for migrating data into AWS. The organization plan to use their Direct Connect link for migrating data rather than sending it in via a physical device. Also, Snowball will not automate the migration.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/datasync/faqs/\">https://aws.amazon.com/datasync/faqs/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>AWS Database Migration Service (DMS)</p>", "<p>AWS CloudFormation</p>", "<p>AWS Snowball</p>", "<p>AWS DataSync</p>"]}, "correct_response": ["d"], "section": "AWS Migration & Transfer", "question_plain": "An organization has a large amount of data on Windows (SMB) file shares in their on-premises data center. The organization would like to move data into Amazon S3. They would like to automate the migration of data over their AWS Direct Connect link.Which AWS service can assist them?", "related_lectures": []}, {"_class": "assessment", "id": 103035899, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A new application will run across multiple Amazon ECS tasks. Front-end application logic will process data and then pass that data to a back-end ECS task to perform further processing and write the data to a datastore. The Architect would like to reduce-interdependencies so failures do no impact other components.</p><p>Which solution should the Architect use?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>This is a good use case for Amazon SQS. SQS is a service that is used for decoupling applications, thus reducing interdependencies, through a message bus. The front-end application can place messages on the queue and the back-end can then poll the queue for new messages. Please remember that Amazon SQS is pull-based (polling) not push-based (use SNS for push-based).</p><p><strong>CORRECT: </strong>\"Create an Amazon SQS queue and configure the front-end to add messages to the queue and the back-end to poll the queue for messages\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon Kinesis Firehose delivery stream and configure the front-end to add data to the stream and the back-end to read data from the stream\" is incorrect. Amazon Kinesis Firehose is used for streaming data. With Firehose the data is immediately loaded into a destination that can be Amazon S3, RedShift, Elasticsearch, or Splunk. This is not an ideal use case for Firehose as this is not streaming data and there is no need to load data into an additional AWS service.</p><p><strong>INCORRECT:</strong> \"Create an Amazon Kinesis Firehose delivery stream that delivers data to an Amazon S3 bucket, configure the front-end to write data to the stream and the back-end to read data from Amazon S3\" is incorrect as per the previous explanation.</p><p><strong>INCORRECT:</strong> \"Create an Amazon SQS queue that pushes messages to the back-end. Configure the front-end to add messages to the queue \" is incorrect as SQS is pull-based, not push-based. EC2 instances must poll the queue to find jobs to process.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/common_use_cases.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/common_use_cases.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-kinesis/\">https://digitalcloud.training/amazon-kinesis/</a></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Create an Amazon Kinesis Firehose delivery stream and configure the front-end to add data to the stream and the back-end to read data from the stream</p>", "<p>Create an Amazon Kinesis Firehose delivery stream that delivers data to an Amazon S3 bucket, configure the front-end to write data to the stream and the back-end to read data from Amazon S3</p>", "<p>Create an Amazon SQS queue that pushes messages to the back-end. Configure the front-end to add messages to the queue</p>", "<p>Create an Amazon SQS queue and configure the front-end to add messages to the queue and the back-end to poll the queue for messages</p>"]}, "correct_response": ["d"], "section": "AWS Application Integration", "question_plain": "A new application will run across multiple Amazon ECS tasks. Front-end application logic will process data and then pass that data to a back-end ECS task to perform further processing and write the data to a datastore. The Architect would like to reduce-interdependencies so failures do no impact other components.Which solution should the Architect use?", "related_lectures": []}, {"_class": "assessment", "id": 103035901, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An Amazon RDS PostgreSQL database is configured as Multi-AZ. A solutions architect needs to scale read performance and the solution must be configured for high availability. What is the most cost-effective solution?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>You can create a read replica as a Multi-AZ DB instance. Amazon RDS creates a standby of your replica in another Availability Zone for failover support for the replica. Creating your read replica as a Multi-AZ DB instance is independent of whether the source database is a Multi-AZ DB instance.</p><p><strong>CORRECT: </strong>\"Create a read replica as a Multi-AZ DB instance\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Deploy a read replica in a different AZ to the master DB instance\" is incorrect as this does not provide high availability for the read replica</p><p><strong>INCORRECT:</strong> \"Deploy a read replica using Amazon ElastiCache\" is incorrect as ElastiCache is not used to create read replicas of RDS database.</p><p><strong>INCORRECT:</strong> \"Deploy a read replica in the same AZ as the master DB instance\" is incorrect as this solution does not include HA for the read replica.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/about-aws/whats-new/2018/01/amazon-rds-read-replicas-now-support-multi-az-deployments/\">https://aws.amazon.com/about-aws/whats-new/2018/01/amazon-rds-read-replicas-now-support-multi-az-deployments/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Create a read replica as a Multi-AZ DB instance</p>", "<p>Deploy a read replica in a different AZ to the master DB instance</p>", "<p>Deploy a read replica using Amazon ElastiCache</p>", "<p>Deploy a read replica in the same AZ as the master DB instance</p>"]}, "correct_response": ["a"], "section": "AWS Database", "question_plain": "An Amazon RDS PostgreSQL database is configured as Multi-AZ. A solutions architect needs to scale read performance and the solution must be configured for high availability. What is the most cost-effective solution?", "related_lectures": []}, {"_class": "assessment", "id": 103035903, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs several NFS file servers in an on-premises data center. The NFS servers must run periodic backups to Amazon S3 using automatic synchronization for small volumes of data.</p><p>Which solution meets these requirements and is MOST cost-effective?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>AWS DataSync is an online data transfer service that simplifies, automates, and accelerates copying large amounts of data between on-premises systems and AWS Storage services, as well as between AWS Storage services. DataSync can copy data between Network File System (NFS) shares, or Server Message Block (SMB) shares, self-managed object storage, <a href=\"https://aws.amazon.com/snowcone/\">AWS Snowcone</a>, <a href=\"https://aws.amazon.com/s3/\">Amazon Simple Storage Service (Amazon S3)</a> buckets, <a href=\"https://aws.amazon.com/efs/\">Amazon Elastic File System (Amazon EFS)</a> file systems, and <a href=\"https://aws.amazon.com/fsx/windows/\">Amazon FSx for Windows File Server</a> file systems.</p><p>This is the most cost-effective solution from the answer options available.</p><p><strong>CORRECT: </strong>\"Set up an AWS DataSync agent on the on-premises servers and sync the data to Amazon S3\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Set up an SFTP sync using AWS Transfer for SFTP to sync data from on premises to Amazon S3\" is incorrect. This solution does not provide the scheduled synchronization features of AWS DataSync and is more expensive.</p><p><strong>INCORRECT:</strong> \"Set up AWS Glue to extract the data from the NFS shares and load it into Amazon S3\" is incorrect. AWS Glue is an ETL service and cannot be used for copying data to Amazon S3 from NFS shares.</p><p><strong>INCORRECT:</strong> \"Set up an AWS Direct Connect connection between the on-premises data center and AWS and copy the data to Amazon S3\" is incorrect. An AWS Direct Connect connection is an expensive option and no solution is provided for automatic synchronization.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/datasync/features/\">https://aws.amazon.com/datasync/features/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Set up AWS Glue to extract the data from the NFS shares and load it into Amazon S3.</p>", "<p>Set up an AWS DataSync agent on the on-premises servers and sync the data to Amazon S3.</p>", "<p>Set up an SFTP sync using AWS Transfer for SFTP to sync data from on premises to Amazon S3.</p>", "<p>Set up an AWS Direct Connect connection between the on-premises data center and AWS and copy the data to Amazon S3.</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A company runs several NFS file servers in an on-premises data center. The NFS servers must run periodic backups to Amazon S3 using automatic synchronization for small volumes of data.Which solution meets these requirements and is MOST cost-effective?", "related_lectures": []}, {"_class": "assessment", "id": 103035905, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company has divested a single business unit and needs to move the AWS account owned by the business unit to another AWS Organization. How can this be achieved?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>Accounts can be migrated between organizations. To do this you must have root or IAM access to both the member and master accounts. Resources will remain under the control of the migrated account.</p><p><strong>CORRECT: </strong>\"Migrate the account using the AWS Organizations console\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create a new account in the destination AWS Organization and migrate resources\" is incorrect. You do not need to create a new account in the destination AWS Organization as you can just migrate the existing account.</p><p><strong>INCORRECT:</strong> \"Create a new account in the destination AWS Organization and share the original resources using AWS Resource Access Manager\" is incorrect. You do not need to create a new account in the destination AWS Organization as you can just migrate the existing account.</p><p><strong>INCORRECT:</strong> \"Migrate the account using AWS CloudFormation\" is incorrect. You do not need to use AWS CloudFormation. You can use the Organizations API or AWS CLI for when there are many accounts to migrate and therefore you could use CloudFormation for any additional automation but it is not necessary for this scenario.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/organizations-move-accounts/\">https://aws.amazon.com/premiumsupport/knowledge-center/organizations-move-accounts/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-organizations/\">https://digitalcloud.training/aws-organizations/</a></p>", "answers": ["<p>Create a new account in the destination AWS Organization and migrate resources</p>", "<p>Create a new account in the destination AWS Organization and share the original resources using AWS Resource Access Manager</p>", "<p>Migrate the account using AWS CloudFormation</p>", "<p>Migrate the account using the AWS Organizations console</p>"]}, "correct_response": ["d"], "section": "AWS Migration & Transfer", "question_plain": "A company has divested a single business unit and needs to move the AWS account owned by the business unit to another AWS Organization. How can this be achieved?", "related_lectures": []}, {"_class": "assessment", "id": 103035907, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application has been deployed on Amazon EC2 instances behind an Application Load Balancer (ALB). A Solutions Architect must improve the security posture of the application and minimize the impact of a DDoS attack on resources.</p><p>Which of the following solutions is MOST effective?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>A rate-based rule tracks the rate of requests for each originating IP address, and triggers the rule action on IPs with rates that go over a limit. You set the limit as the number of requests per 5-minute time span.</p><p>You can use this type of rule to put a temporary block on requests from an IP address that's sending excessive requests. By default, AWS WAF aggregates requests based on the IP address from the web request origin, but you can configure the rule to use an IP address from an HTTP header, like X-Forwarded-For, instead.</p><p><strong>CORRECT: </strong>\"Configure an AWS WAF ACL with rate-based rules. Enable the WAF ACL on the Application Load Balancer\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create a custom AWS Lambda function that monitors for suspicious traffic and modifies a network ACL when a potential DDoS attack is identified\" is incorrect. There\u2019s not description here of how Lambda is going to monitor for traffic.</p><p><strong>INCORRECT:</strong> \"Enable VPC Flow Logs and store them in Amazon S3. Use Amazon Athena to parse the logs and identify and block potential DDoS attacks\" is incorrect. Amazon Athena is not able to block DDoS attacks, another service would be needed.</p><p><strong>INCORRECT:</strong> \"Enable access logs on the Application Load Balancer and configure Amazon CloudWatch to monitor the access logs and trigger a Lambda function when potential attacks are identified. Configure the Lambda function to modify the ALBs security group and block the attack\" is incorrect. Access logs are exported to S3 but not to CloudWatch. Also, it would not be possible to block an attack from a specific IP using a security group (while still allowing any other source access) as they do not support deny rules.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-waf-shield/\">https://digitalcloud.training/aws-waf-shield/</a></p>", "answers": ["<p>Configure an AWS WAF ACL with rate-based rules. Enable the WAF ACL on the Application Load Balancer.</p>", "<p>Create a custom AWS Lambda function that monitors for suspicious traffic and modifies a network ACL when a potential DDoS attack is identified.</p>", "<p>Enable VPC Flow Logs and store them in Amazon S3. Use Amazon Athena to parse the logs and identify and block potential DDoS attacks.</p>", "<p>Enable access logs on the Application Load Balancer and configure Amazon CloudWatch to monitor the access logs and trigger a Lambda function when potential attacks are identified. Configure the Lambda function to modify the ALBs security group and block the attack.</p>"]}, "correct_response": ["a"], "section": "AWS Security, Identity, & Compliance", "question_plain": "An application has been deployed on Amazon EC2 instances behind an Application Load Balancer (ALB). A Solutions Architect must improve the security posture of the application and minimize the impact of a DDoS attack on resources.Which of the following solutions is MOST effective?", "related_lectures": []}, {"_class": "assessment", "id": 103035909, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An automotive company plans to implement IoT sensors in manufacturing equipment that will send data to AWS in real time. The solution must receive events in an ordered manner from each asset and ensure that the data is saved for future processing.</p><p>Which solution would be MOST efficient?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Kinesis Data Streams is the ideal service for receiving streaming data. The Amazon Kinesis Client Library (KCL) delivers all records for a given partition key to the same record processor, making it easier to build multiple applications reading from the same Amazon Kinesis data stream. Therefore, a separate partition (rather than shard) should be used for each equipment asset.</p><p>Amazon Kinesis Firehose can be used to receive streaming data from Data Streams and then load the data into Amazon S3 for future processing.</p><p><strong>CORRECT: </strong>\"Use Amazon Kinesis Data Streams for real-time events with a partition for each equipment asset. Use Amazon Kinesis Data Firehose to save data to Amazon S3\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon Kinesis Data Streams for real-time events with a shard for each equipment asset. Use Amazon Kinesis Data Firehose to save data to Amazon EBS\" is incorrect. A partition should be used rather than a shard as explained above.</p><p><strong>INCORRECT:</strong> \"Use an Amazon SQS FIFO queue for real-time events with one queue for each equipment asset. Trigger an AWS Lambda function for the SQS queue to save data to Amazon EFS\" is incorrect. Amazon SQS cannot be used for real-time use cases.</p><p><strong>INCORRECT:</strong> \"Use an Amazon SQS standard queue for real-time events with one queue for each equipment asset. Trigger an AWS Lambda function from the SQS queue to save data to Amazon S3\" is incorrect. Amazon SQS cannot be used for real-time use cases.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/kinesis/data-streams/faqs/\">https://aws.amazon.com/kinesis/data-streams/faqs/</a></p><p><a href=\"https://aws.amazon.com/kinesis/data-firehose/\">https://aws.amazon.com/kinesis/data-firehose/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-kinesis/\">https://digitalcloud.training/amazon-kinesis/</a></p>", "answers": ["<p>Use Amazon Kinesis Data Streams for real-time events with a partition for each equipment asset. Use Amazon Kinesis Data Firehose to save data to Amazon S3.</p>", "<p>Use Amazon Kinesis Data Streams for real-time events with a shard for each equipment asset. Use Amazon Kinesis Data Firehose to save data to Amazon EBS.</p>", "<p>Use an Amazon SQS FIFO queue for real-time events with one queue for each equipment asset. Trigger an AWS Lambda function for the SQS queue to save data to Amazon EFS.</p>", "<p>Use an Amazon SQS standard queue for real-time events with one queue for each equipment asset. Trigger an AWS Lambda function from the SQS queue to save data to Amazon S3.</p>"]}, "correct_response": ["a"], "section": "AWS Application Integration", "question_plain": "An automotive company plans to implement IoT sensors in manufacturing equipment that will send data to AWS in real time. The solution must receive events in an ordered manner from each asset and ensure that the data is saved for future processing.Which solution would be MOST efficient?", "related_lectures": []}, {"_class": "assessment", "id": 103035911, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An IoT sensor is being rolled out to thousands of a company\u2019s existing customers. The sensors will stream high volumes of data each second to a central location. A solution must be designed to ingest and store the data for analytics. The solution must provide near-real time performance and millisecond responsiveness.</p><p>Which solution should a Solutions Architect recommend?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>A Kinesis data stream is a set of shards. Each shard contains a sequence of data records. A <strong>consumer</strong> is an application that processes the data from a Kinesis data stream. You can map a Lambda function to a shared-throughput consumer (standard iterator), or to a dedicated-throughput consumer with enhanced fan-out.</p><p>Amazon DynamoDB is the best database for this use case as it supports near-real time performance and millisecond responsiveness.</p><p><strong>CORRECT: </strong>\"Ingest the data into an Amazon Kinesis Data Stream. Process the data with an AWS Lambda function and then store the data in Amazon DynamoDB\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Ingest the data into an Amazon Kinesis Data Stream. Process the data with an AWS Lambda function and then store the data in Amazon RedShift\" is incorrect. Amazon RedShift cannot provide millisecond responsiveness.</p><p><strong>INCORRECT:</strong> \"Ingest the data into an Amazon SQS queue. Process the data using an AWS Lambda function and then store the data in Amazon RedShift\" is incorrect. Amazon SQS does not provide near real-time performance and RedShift does not provide millisecond responsiveness.</p><p><strong>INCORRECT:</strong> \"Ingest the data into an Amazon SQS queue. Process the data using an AWS Lambda function and then store the data in Amazon DynamoDB\" is incorrect. Amazon SQS does not provide near real-time performance.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-kinesis/\">https://digitalcloud.training/amazon-kinesis/</a></p>", "answers": ["<p>Ingest the data into an Amazon SQS queue. Process the data using an AWS Lambda function and then store the data in Amazon RedShift.</p>", "<p>Ingest the data into an Amazon Kinesis Data Stream. Process the data with an AWS Lambda function and then store the data in Amazon DynamoDB.</p>", "<p>Ingest the data into an Amazon SQS queue. Process the data using an AWS Lambda function and then store the data in Amazon DynamoDB.</p>", "<p>Ingest the data into an Amazon Kinesis Data Stream. Process the data with an AWS Lambda function and then store the data in Amazon RedShift.</p>"]}, "correct_response": ["b"], "section": "AWS Application Integration", "question_plain": "An IoT sensor is being rolled out to thousands of a company\u2019s existing customers. The sensors will stream high volumes of data each second to a central location. A solution must be designed to ingest and store the data for analytics. The solution must provide near-real time performance and millisecond responsiveness.Which solution should a Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 103035913, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application is running on Amazon EC2 behind an Elastic Load Balancer (ELB). Content is being published using Amazon CloudFront and you need to restrict the ability for users to circumvent CloudFront and access the content directly through the ELB.</p><p>How can you configure this solution?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>The only way to get this working is by using a VPC Security Group for the ELB that is configured to allow only the internal service IP ranges associated with CloudFront. As these are updated from time to time, you can use AWS Lambda to automatically update the addresses. This is done using a trigger that is triggered when AWS issues an SNS topic update when the addresses are changed.</p><p><strong>CORRECT: </strong>\"Create a VPC Security Group for the ELB and use AWS Lambda to automatically update the CloudFront internal service IP addresses when they change\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Origin Access Identity (OAI) and associate it with the distribution\" is incorrect. You can use an OAI to restrict access to content in Amazon S3 but not on EC2 or ELB.</p><p><strong>INCORRECT:</strong> \"Use signed URLs or signed cookies to limit access to the content\" is incorrect. Signed cookies and URLs are used to limit access to files but this does not stop people from circumventing CloudFront and accessing the ELB directly.</p><p><strong>INCORRECT:</strong> \"Use a Network ACL to restrict access to the ELB\" is incorrect. A Network ACL can be used to restrict access to an ELB but it is recommended to use security groups and this solution is incomplete as it does not account for the fact that the internal service IP ranges change over time.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/blogs/security/how-to-automatically-update-your-security-groups-for-amazon-cloudfront-and-aws-waf-by-using-aws-lambda/\">https://aws.amazon.com/blogs/security/how-to-automatically-update-your-security-groups-for-amazon-cloudfront-and-aws-waf-by-using-aws-lambda/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Create an Origin Access Identity (OAI) and associate it with the distribution</p>", "<p>Use signed URLs or signed cookies to limit access to the content</p>", "<p>Use a Network ACL to restrict access to the ELB</p>", "<p>Create a VPC Security Group for the ELB and use AWS Lambda to automatically update the CloudFront internal service IP addresses when they change</p>"]}, "correct_response": ["d"], "section": "AWS Networking & Content Delivery", "question_plain": "An application is running on Amazon EC2 behind an Elastic Load Balancer (ELB). Content is being published using Amazon CloudFront and you need to restrict the ability for users to circumvent CloudFront and access the content directly through the ELB.How can you configure this solution?", "related_lectures": []}, {"_class": "assessment", "id": 103035915, "assessment_type": "multi-select", "prompt": {"question": "<p>A website is running on Amazon EC2 instances and access is restricted to a limited set of IP ranges. A solutions architect is planning to migrate static content from the website to an Amazon S3 bucket configured as an origin for an Amazon CloudFront distribution. Access to the static content must be restricted to the same set of IP addresses.</p><p>Which combination of steps will meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>To prevent users from circumventing the controls implemented on CloudFront (using WAF or presigned URLs / signed cookies) you can use an origin access identity (OAI). An OAI is a special CloudFront user that you associate with a distribution.</p><p>The next step is to change the permissions either on your Amazon S3 bucket or on the files in your bucket so that only the origin access identity has read permission (or read and download permission). This can be implemented through a bucket policy.</p><p>To control access at the CloudFront layer the AWS Web Application Firewall (WAF) can be used. With WAF you must create an ACL that includes the IP restrictions required and then associate the web ACL with the CloudFront distribution.</p><p><strong>CORRECT: </strong>\"Create an origin access identity (OAI) and associate it with the distribution. Change the permissions in the bucket policy so that only the OAI can read the objects\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Create an AWS WAF web ACL that includes the same IP restrictions that exist in the EC2 security group. Associate this new web ACL with the CloudFront distribution\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Create an origin access identity (OAI) and associate it with the distribution. Generate presigned URLs that limit access to the OAI\" is incorrect. Presigned URLs can be used to protect access to CloudFront but they cannot be used to limit access to an OAI.</p><p><strong>INCORRECT:</strong> \"Create an AWS WAF web ACL that includes the same IP restrictions that exist in the EC2 security group. Associate this new web ACL with the Amazon S3 bucket\" is incorrect. The Web ACL should be associated with CloudFront, not S3.</p><p><strong>INCORRECT:</strong> \"Attach the existing security group that contains the IP restrictions to the Amazon CloudFront distribution\" is incorrect. You cannot attach a security group to a CloudFront distribution.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html</a></p><p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/cloudfront-features.html\">https://docs.aws.amazon.com/waf/latest/developerguide/cloudfront-features.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-waf-shield/\">https://digitalcloud.training/aws-waf-shield/</a></p>", "answers": ["<p>Create an origin access identity (OAI) and associate it with the distribution. Change the permissions in the bucket policy so that only the OAI can read the objects.</p>", "<p>Create an origin access identity (OAI) and associate it with the distribution. Generate presigned URLs that limit access to the OAI.</p>", "<p>Create an AWS WAF web ACL that includes the same IP restrictions that exist in the EC2 security group. Associate this new web ACL with the Amazon S3 bucket.</p>", "<p>Create an AWS WAF web ACL that includes the same IP restrictions that exist in the EC2 security group. Associate this new web ACL with the CloudFront distribution.</p>", "<p>Attach the existing security group that contains the IP restrictions to the Amazon CloudFront distribution.</p>"]}, "correct_response": ["a", "d"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A website is running on Amazon EC2 instances and access is restricted to a limited set of IP ranges. A solutions architect is planning to migrate static content from the website to an Amazon S3 bucket configured as an origin for an Amazon CloudFront distribution. Access to the static content must be restricted to the same set of IP addresses.Which combination of steps will meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035815, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is testing a new web application that runs on Amazon EC2 instances. A Solutions Architect is performing load testing and must be able to analyze the performance of the web application with a granularity of 1 minute.</p><p>What should the Solutions Architect do to meet this requirement?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>By default, your instance is enabled for basic monitoring. You can optionally enable detailed monitoring. After you enable detailed monitoring, the Amazon EC2 console displays monitoring graphs with a 1-minute period for the instance.</p><p>The following describes the data interval and charge for basic and detailed monitoring for instances:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-06-02_23-23-28-82670aaf7831d936e2f4a75866c1a1a1.jpg\"></p><p><strong>CORRECT: </strong>\"Enable detailed monitoring on all EC2 instances. Use Amazon CloudWatch metrics to perform the analysis\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Send Amazon CloudWatch logs to Amazon S3. Use Amazon Athena to perform the analysis\" is incorrect. You must enable detailed monitoring to get data in 1-minute periods.</p><p><strong>INCORRECT:</strong> \"Create an AWS Lambda function to fetch EC2 logs from Amazon CloudWatch Logs. Use Amazon CloudWatch metrics to perform the analysis\" is incorrect. There is no need to use a Lambda function to retrieve the logs and detailed monitoring must still be enabled.</p><p><strong>INCORRECT:</strong> \"Create an AWS CloudTrail trail and log data events. Use Amazon Athena to query the CloudTrail logs\" is incorrect. This will not assist with gathering the required data from EC2 instances. Detailed monitoring must be enabled instead.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-cloudwatch-new.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-cloudwatch-new.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Send Amazon CloudWatch logs to Amazon S3. Use Amazon Athena to perform the analysis.</p>", "<p>Enable detailed monitoring on all EC2 instances. Use Amazon CloudWatch metrics to perform the analysis.</p>", "<p>Create an AWS Lambda function to fetch EC2 logs from Amazon CloudWatch Logs. Use Amazon CloudWatch metrics to perform the analysis.</p>", "<p>Create an AWS CloudTrail trail and log data events. Use Amazon Athena to query the CloudTrail logs.</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A company is testing a new web application that runs on Amazon EC2 instances. A Solutions Architect is performing load testing and must be able to analyze the performance of the web application with a granularity of 1 minute.What should the Solutions Architect do to meet this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 103035917, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company requires a solution to allow customers to customize images that are stored in an online catalog. The image customization parameters will be sent in requests to Amazon API Gateway. The customized image will then be generated on-demand and can be accessed online.</p><p>The solutions architect requires a highly available solution. Which solution will be MOST cost-effective?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>All solutions presented are highly available. The key requirement that must be satisfied is that the solution should be cost-effective and you must choose the most cost-effective option.</p><p>Therefore, it\u2019s best to eliminate services such as Amazon EC2 and ELB as these require ongoing costs even when they\u2019re not used. Instead, a fully serverless solution should be used. AWS Lambda, Amazon S3 and CloudFront are the best services to use for these requirements.</p><p><strong>CORRECT: </strong>\"Use AWS Lambda to manipulate the original images to the requested customization. Store the original and manipulated images in Amazon S3. Configure an Amazon CloudFront distribution with the S3 bucket as the origin\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon EC2 instances to manipulate the original images into the requested customization. Store the original and manipulated images in Amazon S3. Configure an Elastic Load Balancer in front of the EC2 instances\" is incorrect. This is not the most cost-effective option as the ELB and EC2 instances will incur costs even when not used.</p><p><strong>INCORRECT:</strong> \"Use AWS Lambda to manipulate the original images to the requested customization. Store the original images in Amazon S3 and the manipulated images in Amazon DynamoDB. Configure an Elastic Load Balancer in front of the Amazon EC2 instances\" is incorrect. This is not the most cost-effective option as the ELB will incur costs even when not used. Also, Amazon DynamoDB will incur RCU/WCUs when running and is not the best choice for storing images.</p><p><strong>INCORRECT:</strong> \"Use Amazon EC2 instances to manipulate the original images into the requested customization. Store the original images in Amazon S3 and the manipulated images in Amazon DynamoDB. Configure an Amazon CloudFront distribution with the S3 bucket as the origin\" is incorrect. This is not the most cost-effective option as the EC2 instances will incur costs even when not used</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/serverless/\">https://aws.amazon.com/serverless/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Use Amazon EC2 instances to manipulate the original images into the requested customization. Store the original and manipulated images in Amazon S3. Configure an Elastic Load Balancer in front of the EC2 instances</p>", "<p>Use AWS Lambda to manipulate the original images to the requested customization. Store the original and manipulated images in Amazon S3. Configure an Amazon CloudFront distribution with the S3 bucket as the origin</p>", "<p>Use AWS Lambda to manipulate the original images to the requested customization. Store the original images in Amazon S3 and the manipulated images in Amazon DynamoDB. Configure an Elastic Load Balancer in front of the Amazon EC2 instances</p>", "<p>Use Amazon EC2 instances to manipulate the original images into the requested customization. Store the original images in Amazon S3 and the manipulated images in Amazon DynamoDB. Configure an Amazon CloudFront distribution with the S3 bucket as the origin</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A company requires a solution to allow customers to customize images that are stored in an online catalog. The image customization parameters will be sent in requests to Amazon API Gateway. The customized image will then be generated on-demand and can be accessed online.The solutions architect requires a highly available solution. Which solution will be MOST cost-effective?", "related_lectures": []}]};
        let correct = new Set();
        let incorrect = new Set();
        const explanationMap = {};
        let totalNumberOfQuestions = 0;
        const quizTitle = quizData.quiz_title;
        const quizDescription = quizData.quiz_description;
        const questionData = quizData.questions;
        const passPercent = quizData.pass_percent;
        const modalTextElement = document.getElementById("modal-text");
        const quizContainerElement = document.getElementById("quiz-container");
        const dialog = document.querySelector("dialog");
        const quizTitleElement = document.getElementById("quiz-title");
        const quizDescriptionElement = document.getElementById("quiz-description");

        function main() {
            document.title = quizTitle || "Quiz";
            quizTitleElement.innerHTML = quizTitle || "Quiz";
            quizDescriptionElement.innerHTML = quizDescription || "";
            document.getElementById("pass-percent").innerHTML = passPercent || "0";
            totalNumberOfQuestions = questionData.length;

            // Shuffle questions
            for (let i = questionData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
            }

            questionData.map(formatSingleQuestionData).forEach((q, idx) => {
                renderSingleQuestion(q, idx + 1);
            });
            updateScore();
        }

        function formatSingleQuestionData(singleQuizData) {
            const { prompt, correct_response, id } = singleQuizData;
            const answers = (prompt && prompt.answers) || [];
            const feedbacks = (prompt && prompt.feedbacks) || [];
            // Guard: correct_response might be empty or missing
            const safeCorrectResponse = Array.isArray(correct_response) && correct_response.length > 0
                ? correct_response : ["a"]; // fallback to first answer
            // Support multi-answer: correct_response is an array like ["a"] or ["a","c","d","f"]
            const isMultiAnswer = safeCorrectResponse.length > 1;
            const correctAnswerIndices = safeCorrectResponse.map(letter => {
                if (typeof letter === 'string' && letter.match(/^[a-zA-Z]$/)) {
                    return letter.toLowerCase().charCodeAt(0) - 97;
                }
                return 0; // fallback for non-letter responses
            }).filter(idx => idx >= 0 && idx < answers.length); // filter out invalid indices
            const correctAnswerIndex = correctAnswerIndices.length > 0 ? correctAnswerIndices[0] : 0;
            
            // Keep instructor-provided explanation as-is. Per-option feedbacks are rebuilt
            // AFTER answer shuffle so Option A/B/C letters match the on-screen order.
            const explanation = (prompt && prompt.explanation) || "";

            // Guard: question text might be null/undefined
            const question = (prompt && prompt.question) || "<em>(No question text available)</em>";

            return {
                id,
                question,
                answers,
                feedbacks,
                correctAnswerIndex,
                correctAnswerIndices: correctAnswerIndices.length > 0 ? correctAnswerIndices : [0],
                isMultiAnswer,
                explanation,
            };
        }

        const renderSingleQuestion = (data, num) => {
            const { id, answers, feedbacks, correctAnswerIndex, correctAnswerIndices, isMultiAnswer, question } = data;
            let { explanation } = data;
            // Skip questions with no answer options (unsupported types like fill-in-the-blank)
            if (!answers || answers.length === 0) {
                console.warn(`Question ${id} has no answers, skipping render`);
                totalNumberOfQuestions--; // don't count it
                return;
            }
            // Shuffle answers — track where correct answer ends up
            // Create index array and shuffle that
            const indexedAnswers = answers.map((text, origIdx) => ({ text, origIdx }));
            for (let i = indexedAnswers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indexedAnswers[i], indexedAnswers[j]] = [indexedAnswers[j], indexedAnswers[i]];
            }

            // Find shuffled positions of correct answers
            const shuffledCorrectIndices = correctAnswerIndices.map(ci => indexedAnswers.findIndex(a => a.origIdx === ci));
            const shuffledCorrectIndex = shuffledCorrectIndices[0]; // single-answer compat

            // Build Option A/B/C explanation from feedbacks in DISPLAY order (after shuffle),
            // not original Udemy order — otherwise "Option A" no longer matches the first choice.
            if (!explanation && Array.isArray(feedbacks) && feedbacks.length > 0) {
                const optionLetters = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
                explanation = indexedAnswers.map((item, displayIdx) => {
                    const fb = feedbacks[item.origIdx];
                    if (!fb || typeof fb !== "string" || !fb.trim()) return "";
                    const letter = optionLetters[displayIdx] || String(displayIdx + 1);
                    const isCorrect = correctAnswerIndices.includes(item.origIdx);
                    const correctTag = isCorrect ? " (Correct Answer)" : "";
                    const textColor = isCorrect ? "var(--success)" : "var(--text-secondary)";
                    const borderColor = isCorrect ? "var(--success)" : "var(--border)";
                    return `
                        <div style="margin-bottom: 16px; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.02); border-left: 3px solid ${borderColor};">
                            <strong style="color: ${textColor}; font-size: 13px; text-transform: uppercase;">Option ${letter}${correctTag}:</strong>
                            <div style="margin-top: 4px; color: var(--text-muted); font-size: 13px; line-height: 1.5;">${item.text}</div>
                            <div style="margin-top: 4px; color: var(--text-primary); font-size: 14px; line-height: 1.6;">${fb}</div>
                        </div>`;
                }).filter(Boolean).join("");
            }

            const inputType = isMultiAnswer ? 'checkbox' : 'radio';
            const optionsHTML = indexedAnswers.map((item, i) => {
                const oid = `${id}_${i}`;
                return `
                        <div class="question-lable">
                            <input type="${inputType}" id="${oid}" name="answer" value="${i}" />
                            <label for="${oid}">${item.text}</label>
                        </div>`;
            }).join("");

            const multiHint = isMultiAnswer ? `<span class="multi-answer-hint">select ${correctAnswerIndices.length}</span>` : '';

            if (explanation) explanationMap[id] = explanation;
            const container = document.createElement("div");
            container.innerHTML = `
                    <form data-correct-answer="${shuffledCorrectIndex}" data-correct-answers="${shuffledCorrectIndices.join(',')}" data-is-multi="${isMultiAnswer}" data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
                        <div class="question-header">
                            <span class="question-number">Question ${num} ${multiHint}</span>
                            ${explanation ? `<button type="button" onclick="renderExplanation('${id}')" class="explanation-btn">💡 Explanation</button>` : ''}
                        </div>
                        <div class="question-text">${question}</div>
                        <div class="options-container">${optionsHTML}</div>
                        <div style="display:flex;gap:8px;">
                            <button type="submit" class="button">Submit Answer</button>
                        </div>
