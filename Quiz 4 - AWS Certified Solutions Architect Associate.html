you will get some cost recommendations using Trusted Advisor, when working with reducing cost for compute specifically, AWS Compute Optimizer is a better choice.</p><p><strong>INCORRECT:</strong> \"Cost and Usage Reports\" is incorrect. Cost and Usage Reports are a highly detailed report of your spend and usage across your entire AWS Environment. Whilst it can be used to understand cost, it does not make recommendations.</p><p><strong>INCORRECT:</strong> \"AWS Cost Explorer\" is incorrect. Cost Explorer gives you insight into your spend and usage in a graphical format, which can be filtered and grouped by parameters like Region, instance type and can use Tags to further group resources. It does not however make any recommendations on how to reduce spend.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/compute-optimizer/faqs/\">https://aws.amazon.com/compute-optimizer/faqs/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-billing-and-pricing/\">https://digitalcloud.training/aws-billing-and-pricing/</a></p>", "answers": ["<p>AWS Trusted Advisor</p>", "<p>Cost and Usage Reports</p>", "<p>AWS Compute Optimizer</p>", "<p>AWS Cost Explorer</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "The Chief Financial Officer of a large corporation is looking for an AWS native tool which will help reduce their cloud spend. After receiving a budget alarm, the company has decided that they need to reduce their spend across their different areas of compute and need insights into their spend to decide where they can reduce cost. What is the easiest way to achieve this goal?", "related_lectures": []}, {"_class": "assessment", "id": 103035819, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect has placed an Amazon CloudFront distribution in front of their web server, which is serving up a highly accessed website, serving content globally. The Solutions Architect needs to dynamically route the user to a new URL depending on where the user is accessing from, through running a particular script. This dynamic routing will happen on every request, and as a result requires the code to run at extremely low latency, and low cost.</p><p>What solution will best achieve this goal?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>With CloudFront Functions in Amazon CloudFront, you can write lightweight functions in JavaScript for high-scale, latency-sensitive CDN customizations. Your functions can manipulate the requests and responses that flow through CloudFront, perform basic authentication and authorization, generate HTTP responses at the edge, and more. CloudFront Functions is approximately 1/6th the cost of Lambda@Edge and is extremely low latency as the functions are run on the host in the edge location, instead of the running on a Lambda function elsewhere.</p><p><strong>CORRECT: </strong>\"At the Edge Location, run your code with CloudFront Functions\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Redirect traffic by running your code within a Lambda function using Lambda@Edge\u201d is incorrect. Although you could achieve this using Lambda@Edge, the question states the need for the lowest latency possible, and comparatively the lowest latency option is CloudFront Functions.</p><p><strong>INCORRECT:</strong> \"Use Path Based Routing to route each user to the appropriate webpage behind an Application Load Balancer\u201d is incorrect. This architecture does not account for the fact that custom code needs to be run to make this happen.</p><p><strong>INCORRECT:</strong> \"Use Route 53 Geo Proximity Routing to route users\u2019 traffic to your resources based on their geographic location.'' is incorrect. This may work, however again it does not account for the fact that custom code needs to be run to make this happen.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Redirect traffic by running your code within a Lambda function using Lambda@Edge.</p>", "<p>At the Edge Location, run your code with CloudFront Functions.</p>", "<p>Use Path Based Routing to route each user to the appropriate webpage behind an Application Load Balancer.</p>", "<p>Use Route 53 Geo Proximity Routing to route users\u2019 traffic to your resources based on their geographic location.</p>"]}, "correct_response": ["b"], "section": "AWS Networking & Content Delivery", "question_plain": "A Solutions Architect has placed an Amazon CloudFront distribution in front of their web server, which is serving up a highly accessed website, serving content globally. The Solutions Architect needs to dynamically route the user to a new URL depending on where the user is accessing from, through running a particular script. This dynamic routing will happen on every request, and as a result requires the code to run at extremely low latency, and low cost.What solution will best achieve this goal?", "related_lectures": []}, {"_class": "assessment", "id": 103035821, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A telecommunications company is looking to expand its 5G coverage nationwide, and as a result needs to provision and build their own private cellular network with the help of AWS.</p><p>Which solution does AWS provide to help with this?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Private 5G is a managed service that makes it easy to deploy, operate, and scale your own private cellular network, with all required hardware and software provided by AWS.</p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2022-08-27_10-53-42-4e3810611649053688d618d44c58bd33.jpg\"><p><strong>CORRECT: </strong>\"AWS Private 5G\" is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"AWS Wavelength\" is incorrect. AWS Wavelength embeds AWS compute and storage services within 5G networks, providing mobile edge computing infrastructure for developing, deploying, and scaling ultra-low-latency applications.</p><p><strong>INCORRECT:</strong> \"AWS CloudHSM\" is incorrect. AWS CloudHSM is a cloud-based hardware security module (HSM) that enables you to easily generate and use your own encryption keys on the AWS Cloud and has nothing to do with 5G.</p><p><strong>INCORRECT:</strong> \"AWS Outposts\" is incorrect. AWS Outposts is a family of fully managed solutions delivering AWS infrastructure and services to virtually any on-premises or edge location for a truly consistent hybrid experience. It is not related to 5G.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/private5g/\">https://aws.amazon.com/private5g/</a></p>", "answers": ["<p>AWS Wavelength</p>", "<p>AWS Outposts</p>", "<p>AWS Private 5G</p>", "<p>AWS CloudHSM</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A telecommunications company is looking to expand its 5G coverage nationwide, and as a result needs to provision and build their own private cellular network with the help of AWS.Which solution does AWS provide to help with this?", "related_lectures": []}, {"_class": "assessment", "id": 103035823, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect is migrating a distributed application from their on-premises environment into AWS. This application consists of an Apache Cassandra NoSQL database, with a containerized SUSE Linux compute layer with an additional storage layer made up of multiple Microsoft SQL Server databases. Once in the cloud the company wants to have as little operational overhead as possible, with no schema conversion during the migration and the company wants to host the architecture in a highly available and durable way. </p><p><br></p><p>Which of the following groups of services will provide the solutions architect with the best solution ?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Keyspaces (for Apache Cassandra) is a scalable, highly available, and managed Apache Cassandra\u2013compatible database service. This combined with a containerized, serverless compute layer on Amazon ECS for Fargate and a RDS for Microsoft SQL Server database layer is a fully managed version of what currently exists on premises.</p><p><strong>CORRECT: </strong>\"Run the NoSQL database on Amazon Keyspaces, and the compute layer on Amazon ECS on Fargate. Use Amazon RDS for Microsoft SQL Server to host the second storage layer\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Run the NoSQL database on DynamoDB, and the compute layer on Amazon ECS on EC2. Use Amazon RDS for Microsoft SQL Server to host the second storage layer\u201d is incorrect. DynamoDB is not a managed version of DynamoDB therefore it is not the correct answer.</p><p><strong>INCORRECT:</strong> \"Run the NoSQL database on DynamoDB, and the compute layer on Amazon ECS on Fargate. Use Amazon RDS for Microsoft SQL Server to host the second storage layer\u201d is incorrect. DynamoDB is not a managed version of DynamoDB therefore it is not the correct answer.</p><p><strong>INCORRECT:</strong> \"Run the NoSQL database on Amazon Keyspaces, and the compute layer on Amazon ECS on Fargate. Use Amazon Aurora to host the second storage layer\u201d is incorrect. Amazon Aurora does not have an option to run a Microsoft SQL Server database, therefore this answer is not correct.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/keyspaces/\">https://aws.amazon.com/keyspaces/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/category/aws-cheat-sheets/aws-database/\">https://digitalcloud.training/category/aws-cheat-sheets/aws-database/</a></p>", "answers": ["<p>Run the NoSQL database on DynamoDB, and the compute layer on Amazon ECS on EC2. Use Amazon RDS for Microsoft SQL Server to host the second storage layer.</p>", "<p>Run the NoSQL database on DynamoDB, and the compute layer on Amazon ECS on Fargate. Use Amazon RDS for Microsoft SQL Server to host the second storage layer.</p>", "<p>Run the NoSQL database on Amazon Keyspaces, and the compute layer on Amazon ECS on Fargate. Use Amazon RDS for Microsoft SQL Server to host the second storage layer.</p>", "<p>Run the NoSQL database on Amazon Keyspaces, and the compute layer on Amazon ECS on Fargate. Use Amazon Aurora to host the second storage layer.</p>"]}, "correct_response": ["c"], "section": "AWS Database", "question_plain": "A Solutions Architect is migrating a distributed application from their on-premises environment into AWS. This application consists of an Apache Cassandra NoSQL database, with a containerized SUSE Linux compute layer with an additional storage layer made up of multiple Microsoft SQL Server databases. Once in the cloud the company wants to have as little operational overhead as possible, with no schema conversion during the migration and the company wants to host the architecture in a highly available and durable way. Which of the following groups of services will provide the solutions architect with the best solution ?", "related_lectures": []}, {"_class": "assessment", "id": 103035837, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is deploying an Amazon ElastiCache for Redis cluster. To enhance security a password should be required to access the database. What should the solutions architect use?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Redis authentication tokens enable Redis to require a token (password) before allowing clients to execute commands, thereby improving data security.</p><p>You can require that users enter a token on a token-protected Redis server. To do this, include the parameter --auth-token (API: AuthToken) with the correct token when you create your replication group or cluster. Also include it in all subsequent commands to the replication group or cluster.</p><p><strong>CORRECT: </strong>\"Redis AUTH command\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"AWS Directory Service\" is incorrect. This is a managed Microsoft Active Directory service and cannot add password protection to Redis.</p><p><strong>INCORRECT:</strong> \"AWS IAM Policy\" is incorrect. You cannot use an IAM policy to enforce a password on Redis.</p><p><strong>INCORRECT:</strong> \"VPC Security Group\" is incorrect. A security group protects at the network layer, it does not affect application authentication.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/auth.html\">https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/auth.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-elasticache/\">https://digitalcloud.training/amazon-elasticache/</a></p>", "answers": ["<p>AWS Directory Service</p>", "<p>AWS IAM Policy</p>", "<p>Redis AUTH command</p>", "<p>VPC Security Group</p>"]}, "correct_response": ["c"], "section": "AWS Database", "question_plain": "A company is deploying an Amazon ElastiCache for Redis cluster. To enhance security a password should be required to access the database. What should the solutions architect use?", "related_lectures": []}, {"_class": "assessment", "id": 103035839, "assessment_type": "multi-select", "prompt": {"question": "<p>To increase performance and redundancy for an application a company has decided to run multiple implementations in different AWS Regions behind network load balancers. The company currently advertise the application using two public IP addresses from separate /24 address ranges and would prefer not to change these. Users should be directed to the closest available application endpoint.</p><p>Which actions should a solutions architect take? (Select TWO.)</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>AWS Global Accelerator uses static IP addresses as fixed entry points for your application. You can migrate up to two /24 IPv4 address ranges and choose which /32 IP addresses to use when you create your accelerator.</p><p>This solution ensures the company can continue using the same IP addresses and they are able to direct traffic to the application endpoint in the AWS Region closest to the end user. Traffic is sent over the AWS global network for consistent performance.</p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2023-06-30_17-53-24-bb370bf875b707fca85b1a16e03905ad.png\"><p><strong>CORRECT: </strong>\"Create an AWS Global Accelerator and attach endpoints in each AWS Region\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Migrate both public IP addresses to the AWS Global Accelerator\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon Route 53 geolocation based routing policy\" is incorrect. With this solution new IP addresses will be required as there will be application endpoints in different regions.</p><p><strong>INCORRECT:</strong> \"Assign new static anycast IP addresses and modify any existing pointers\" is incorrect. This is unnecessary as you can bring your own IP addresses to AWS Global Accelerator and this is preferred in this scenario.</p><p><strong>INCORRECT:</strong> \"Create PTR records to map existing public IP addresses to an Alias\" is incorrect. This is not a workable solution for mapping existing IP addresses to an Amazon Route 53 Alias.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/global-accelerator/features/\">https://aws.amazon.com/global-accelerator/features/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-global-accelerator/\">https://digitalcloud.training/aws-global-accelerator/</a></p>", "answers": ["<p>Create an Amazon Route 53 geolocation based routing policy</p>", "<p>Create an AWS Global Accelerator and attach endpoints in each AWS Region</p>", "<p>Assign new static anycast IP addresses and modify any existing pointers</p>", "<p>Migrate both public IP addresses to the AWS Global Accelerator</p>", "<p>Create PTR records to map existing public IP addresses to an Alias</p>"]}, "correct_response": ["b", "d"], "section": "AWS Networking & Content Delivery", "question_plain": "To increase performance and redundancy for an application a company has decided to run multiple implementations in different AWS Regions behind network load balancers. The company currently advertise the application using two public IP addresses from separate /24 address ranges and would prefer not to change these. Users should be directed to the closest available application endpoint.Which actions should a solutions architect take? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035841, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Three Amazon VPCs are used by a company in the same region. The company has two AWS Direct Connect connections to two separate company offices and wishes to share these with all three VPCs. A Solutions Architect has created an AWS Direct Connect gateway. How can the required connectivity be configured?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>You can manage a single connection for multiple VPCs or VPNs that are in the same Region by associating a Direct Connect gateway to a transit gateway. The solution involves the following components:</p><p>- A transit gateway that has VPC attachments.</p><p>- A Direct Connect gateway.</p><p>- An association between the Direct Connect gateway and the transit gateway.</p><p>- A transit virtual interface that is attached to the Direct Connect gateway.</p><p>The following diagram depicts this configuration:</p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2023-06-30_17-55-09-1a785f673ff4f8e0d3d249ee737a98d9.jpg\"><p><strong>CORRECT: </strong>\"Associate the Direct Connect gateway to a transit gateway\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Associate the Direct Connect gateway to a virtual private gateway in each VPC\" is incorrect. For VPCs in the same region a VPG is not necessary. A transit gateway can instead be configured.</p><p><strong>INCORRECT:</strong> \"Create a VPC peering connection between the VPCs and route entries for the Direct Connect Gateway\" is incorrect. You cannot add route entries for a Direct Connect gateway to each VPC and enable routing. Use a transit gateway instead.</p><p><strong>INCORRECT:</strong> \"Create a transit virtual interface between the Direct Connect gateway and each VPC\" is incorrect. The transit virtual interface is attached to the Direct Connect gateway on the connection side, not the VPC/transit gateway side.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-gateways-intro.html\">https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-gateways-intro.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-direct-connect/\">https://digitalcloud.training/aws-direct-connect/</a></p>", "answers": ["<p>Associate the Direct Connect gateway to a transit gateway</p>", "<p>Associate the Direct Connect gateway to a virtual private gateway in each VPC</p>", "<p>Create a VPC peering connection between the VPCs and route entries for the Direct Connect Gateway</p>", "<p>Create a transit virtual interface between the Direct Connect gateway and each VPC</p>"]}, "correct_response": ["a"], "section": "AWS Networking & Content Delivery", "question_plain": "Three Amazon VPCs are used by a company in the same region. The company has two AWS Direct Connect connections to two separate company offices and wishes to share these with all three VPCs. A Solutions Architect has created an AWS Direct Connect gateway. How can the required connectivity be configured?", "related_lectures": []}, {"_class": "assessment", "id": 103035843, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A retail organization sends coupons out twice a week and this results in a predictable surge in sales traffic. The application runs on Amazon EC2 instances behind an Elastic Load Balancer. The organization is looking for ways lower costs while ensuring they meet the demands of their customers.</p><p>How can they achieve this goal?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>On-Demand Capacity Reservations enable you to reserve compute capacity for your Amazon EC2 instances in a specific Availability Zone for any duration. By creating Capacity Reservations, you ensure that you always have access to EC2 capacity when you need it, for as long as you need it. When used in combination with savings plans, you can also gain the advantages of cost reduction.</p><p><strong>CORRECT: </strong>\" Use capacity reservations with savings plans\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use a mixture of spot instances and on demand instances\" is incorrect. You can mix spot and on-demand in an auto scaling group. However, there\u2019s a risk the spot price may not be good, and this is a regular, predictable increase in traffic.</p><p><strong>INCORRECT:</strong> \"Increase the instance size of the existing EC2 instances\" is incorrect. This would add more cost all the time rather than catering for the temporary increases in traffic.</p><p><strong>INCORRECT:</strong> \"Purchase Amazon EC2 dedicated hosts\" is incorrect. This is not a way to save cost as dedicated hosts are much more expensive than shared hosts.</p><p><strong>References:</strong></p><p>https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html#capacity-reservations-differences</p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Use capacity reservations with savings plans</p>", "<p>Use a mixture of spot instances and on demand instances</p>", "<p>Increase the instance size of the existing EC2 instances</p>", "<p>Purchase Amazon EC2 dedicated hosts</p>"]}, "correct_response": ["a"], "section": "AWS Compute", "question_plain": "A retail organization sends coupons out twice a week and this results in a predictable surge in sales traffic. The application runs on Amazon EC2 instances behind an Elastic Load Balancer. The organization is looking for ways lower costs while ensuring they meet the demands of their customers.How can they achieve this goal?", "related_lectures": []}, {"_class": "assessment", "id": 103035845, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Over 500 TB of data must be analyzed using standard SQL business intelligence tools. The dataset consists of a combination of structured data and unstructured data. The unstructured data is small and stored on Amazon S3. Which AWS services are most suitable for performing analytics on the data?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Redshift is an enterprise-level, petabyte scale, fully managed data warehousing service. An Amazon Redshift data warehouse is an enterprise-class relational database query and management system. Redshift supports client connections with many types of applications, including business intelligence (BI), reporting, data, and analytics tools.</p><p>Using Amazon Redshift Spectrum, you can efficiently query and retrieve structured and semistructured data from files in Amazon S3 without having to load the data into Amazon Redshift tables. Redshift Spectrum queries employ massive parallelism to execute very fast against large datasets.</p><p><img src=\"https://digitalcloud.training/wp-content/uploads/2020/06/Picture-1-66.png\"></p><p>Used together, RedShift and RedShift spectrum are suitable for running massive analytics jobs on both the structured (RedShift data warehouse) and unstructured (Amazon S3) data.</p><p><strong>CORRECT: </strong>\"Amazon Redshift with Amazon Redshift Spectrum\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon RDS MariaDB with Amazon Athena\" is incorrect. Amazon RDS is not suitable for analytics (OLAP) use cases as it is designed for transactional (OLTP) use cases. Athena can however be used for running SQL queries on data on S3.</p><p><strong>INCORRECT:</strong> \"Amazon DynamoDB with Amazon DynamoDB Accelerator (DAX)\" is incorrect. This is an example of a non-relational DB with a caching layer and is not suitable for an OLAP use case.</p><p><strong>INCORRECT:</strong> \"Amazon ElastiCache for Redis with cluster mode enabled\" is incorrect. This is an example of an in-memory caching service. It is good for performance for transactional use cases.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/redshift/latest/dg/c_redshift_system_overview.html\">https://docs.aws.amazon.com/redshift/latest/dg/c_redshift_system_overview.html</a></p><p><a href=\"https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html\">https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-redshift/\">https://digitalcloud.training/amazon-redshift/</a></p>", "answers": ["<p>Amazon RDS MariaDB with Amazon Athena</p>", "<p>Amazon DynamoDB with Amazon DynamoDB Accelerator (DAX)</p>", "<p>Amazon ElastiCache for Redis with cluster mode enabled</p>", "<p>Amazon Redshift with Amazon Redshift Spectrum</p>"]}, "correct_response": ["d"], "section": "AWS Database", "question_plain": "Over 500 TB of data must be analyzed using standard SQL business intelligence tools. The dataset consists of a combination of structured data and unstructured data. The unstructured data is small and stored on Amazon S3. Which AWS services are most suitable for performing analytics on the data?", "related_lectures": []}, {"_class": "assessment", "id": 103035849, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application running on Amazon EC2 needs to asynchronously invoke an AWS Lambda function to perform data processing. The services should be decoupled.</p><p>Which service can be used to decouple the compute services?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>You can use a Lambda function to process Amazon Simple Notification Service notifications. Amazon SNS supports Lambda functions as a target for messages sent to a topic. This solution decouples the Amazon EC2 application from Lambda and ensures the Lambda function is invoked.</p><p><strong>CORRECT: </strong>\"Amazon SNS\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"AWS Config\" is incorrect. AWS Config is a service that is used for continuous compliance, not application decoupling.</p><p><strong>INCORRECT:</strong> \"Amazon MQ\" is incorrect. Amazon MQ is similar to SQS but is used for existing applications that are being migrated into AWS. SQS should be used for new applications being created in the cloud.</p><p><strong>INCORRECT:</strong> \"AWS Step Functions\" is incorrect. AWS Step Functions is a workflow service. It is not the best solution for this scenario.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-sns.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-sns.html</a></p><p><a href=\"https://aws.amazon.com/sns/features/\">https://aws.amazon.com/sns/features/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>AWS Config</p>", "<p>Amazon SNS</p>", "<p>Amazon MQ</p>", "<p>AWS Step Functions</p>"]}, "correct_response": ["b"], "section": "AWS Application Integration", "question_plain": "An application running on Amazon EC2 needs to asynchronously invoke an AWS Lambda function to perform data processing. The services should be decoupled.Which service can be used to decouple the compute services?", "related_lectures": []}, {"_class": "assessment", "id": 103035847, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application is being monitored using Amazon GuardDuty. A Solutions Architect needs to be notified by email of medium to high severity events. How can this be achieved?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>A CloudWatch Events rule can be used to set up automatic email notifications for Medium to High Severity findings to the email address of your choice. You simply create an Amazon SNS topic and then associate it with an Amazon CloudWatch events rule.</p><p>Note: step by step procedures for how to set this up can be found in the article linked in the references below.</p><p><strong>CORRECT: </strong>\"Create an Amazon CloudWatch events rule that triggers an Amazon SNS topic\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Configure an Amazon CloudWatch alarm that triggers based on a GuardDuty metric\" is incorrect. There is no metric for GuardDuty that can be used for specific findings.</p><p><strong>INCORRECT:</strong> \"Create an Amazon CloudWatch Logs rule that triggers an AWS Lambda function\" is incorrect. CloudWatch logs is not the right CloudWatch service to use. CloudWatch events is used for reacting to changes in service state.</p><p><strong>INCORRECT:</strong> \"Configure an Amazon CloudTrail alarm the triggers based on GuardDuty API activity\" is incorrect. CloudTrail cannot be used to trigger alarms based on GuardDuty API activity.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html\">https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudwatch/\">https://digitalcloud.training/amazon-cloudwatch/</a></p>", "answers": ["<p>Configure an Amazon CloudWatch alarm that triggers based on a GuardDuty metric</p>", "<p>Create an Amazon CloudWatch events rule that triggers an Amazon SNS topic</p>", "<p>Create an Amazon CloudWatch Logs rule that triggers an AWS Lambda function</p>", "<p>Configure an Amazon CloudTrail alarm the triggers based on GuardDuty API activity</p>"]}, "correct_response": ["b"], "section": "AWS Application Integration", "question_plain": "An application is being monitored using Amazon GuardDuty. A Solutions Architect needs to be notified by email of medium to high severity events. How can this be achieved?", "related_lectures": []}, {"_class": "assessment", "id": 103035851, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect has been tasked with re-deploying an application running on AWS to enable high availability. The application processes messages that are received in an ActiveMQ queue running on a single Amazon EC2 instance. Messages are then processed by a consumer application running on Amazon EC2. After processing the messages the consumer application writes results to a MySQL database running on Amazon EC2.</p><p>Which architecture offers the highest availability and low operational complexity?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>The correct answer offers the highest availability as it includes Amazon MQ active/standby brokers across two AZs, an Auto Scaling group across two AZ,s and a Multi-AZ Amazon RDS MySQL database deployment.</p><p>This architecture not only offers the highest availability it is also operationally simple as it maximizes the usage of managed services.</p><p><strong>CORRECT: </strong>\"Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Create an Auto Scaling group for the consumer EC2 instances across two Availability Zones. Use an Amazon RDS MySQL database with Multi-AZ enabled\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Deploy a second Active MQ server to another Availability Zone. Launch an additional consumer EC2 instance in another Availability Zone. Use MySQL database replication to another Availability Zone\" is incorrect. This architecture does not offer the highest availability as it does not use Auto Scaling. It is also not the most operationally efficient architecture as it does not use AWS managed services.</p><p><strong>INCORRECT:</strong> \"Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Launch an additional consumer EC2 instance in another Availability Zone. Use MySQL database replication to another Availability Zone\" is incorrect. This architecture does not use Auto Scaling for best HA or the RDS managed service.</p><p><strong>INCORRECT:</strong> \"Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Launch an additional consumer EC2 instance in another Availability Zone. Use Amazon RDS for MySQL with Multi-AZ enabled\" is incorrect. This solution does not use Auto Scaling.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/architecture/well-architected/\">https://aws.amazon.com/architecture/well-architected/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Deploy a second Active MQ server to another Availability Zone. Launch an additional consumer EC2 instance in another Availability Zone. Use MySQL database replication to another Availability Zone.</p>", "<p>Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Launch an additional consumer EC2 instance in another Availability Zone. Use MySQL database replication to another Availability Zone.</p>", "<p>Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Launch an additional consumer EC2 instance in another Availability Zone. Use Amazon RDS for MySQL with Multi-AZ enabled.</p>", "<p>Deploy Amazon MQ with active/standby brokers configured across two Availability Zones. Create an Auto Scaling group for the consumer EC2 instances across two Availability Zones. Use an Amazon RDS MySQL database with Multi-AZ enabled.</p>"]}, "correct_response": ["d"], "section": "AWS Application Integration", "question_plain": "A Solutions Architect has been tasked with re-deploying an application running on AWS to enable high availability. The application processes messages that are received in an ActiveMQ queue running on a single Amazon EC2 instance. Messages are then processed by a consumer application running on Amazon EC2. After processing the messages the consumer application writes results to a MySQL database running on Amazon EC2.Which architecture offers the highest availability and low operational complexity?", "related_lectures": []}, {"_class": "assessment", "id": 103035921, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company has acquired another business and needs to migrate their 50TB of data into AWS within 1 month. They also require a secure, reliable and private connection to the AWS cloud.</p><p>How are these requirements best accomplished?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Direct Connect provides a secure, reliable and private connection. However, lead times are often longer than 1 month so it cannot be used to migrate data within the timeframes. Therefore, it is better to use AWS Snowball to move the data and order a Direct Connect connection to satisfy the other requirement later on. In the meantime the organization can use an AWS VPN for secure, private access to their VPC.</p><p><strong>CORRECT: </strong>\"Migrate data using AWS Snowball. Provision an AWS VPN initially and order a Direct Connect link\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Provision an AWS Direct Connect connection and migrate the data over the link\" is incorrect due to the lead time for installation.</p><p><strong>INCORRECT:</strong> \"Launch a Virtual Private Gateway (VPG) and migrate the data over the AWS VPN\" is incorrect. A VPG is the AWS-side of an AWS VPN. A VPN does not provide a private connection and is not reliable as you can never guarantee the latency over the Internet</p><p><strong>INCORRECT:</strong> \"Provision an AWS VPN CloudHub connection and migrate the data over redundant links\" is incorrect. AWS VPN CloudHub is a service for connecting multiple sites into your VPC over VPN connections. It is not used for aggregating links and the limitations of Internet bandwidth from the company where the data is stored will still be an issue. It also uses the public Internet so is not a private or reliable connection.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/snowball/\">https://aws.amazon.com/snowball/</a></p><p><a href=\"https://aws.amazon.com/directconnect/\">https://aws.amazon.com/directconnect/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-direct-connect/\">https://digitalcloud.training/aws-direct-connect/</a></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Provision an AWS Direct Connect connection and migrate the data over the link</p>", "<p>Migrate data using AWS Snowball. Provision an AWS VPN initially and order a Direct Connect link</p>", "<p>Launch a Virtual Private Gateway (VPG) and migrate the data over the AWS VPN</p>", "<p>Provision an AWS VPN CloudHub connection and migrate the data over redundant links</p>"]}, "correct_response": ["b"], "section": "AWS Migration & Transfer", "question_plain": "A company has acquired another business and needs to migrate their 50TB of data into AWS within 1 month. They also require a secure, reliable and private connection to the AWS cloud.How are these requirements best accomplished?", "related_lectures": []}, {"_class": "assessment", "id": 103035853, "assessment_type": "multi-select", "prompt": {"question": "<p>Storage capacity has become an issue for a company that runs application servers on-premises. The servers are connected to a combination of block storage and NFS storage solutions. The company requires a solution that supports local caching without re-architecting its existing applications.</p><p>Which combination of changes can the company make to meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>In this scenario the company should use cloud storage to replace the existing storage solutions that are running out of capacity. The on-premises servers mount the existing storage using block protocols (iSCSI) and file protocols (NFS). As there is a requirement to avoid re-architecting existing applications these protocols must be used in the revised solution.</p><p>The AWS Storage Gateway volume gateway should be used to replace the block-based storage systems as it is mounted over iSCSI and the file gateway should be used to replace the NFS file systems as it uses NFS.</p><p><strong>CORRECT: </strong>\"Use an AWS Storage Gateway file gateway to replace the NFS storage\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Use an AWS Storage Gateway volume gateway to replace the block storage\" is a correct answer.</p><p><strong>INCORRECT:</strong> \"Use the mount command on servers to mount Amazon S3 buckets using NFS\" is incorrect. You cannot mount S3 buckets using NFS as it is an object-based storage system (not file-based) and uses an HTTP REST API.</p><p><strong>INCORRECT:</strong> \"Use AWS Direct Connect and mount an Amazon FSx for Windows File Server using iSCSI\" is incorrect. You cannot mount FSx for Windows File Server file systems using iSCSI, you must use SMB.</p><p><strong>INCORRECT:</strong> \"Use Amazon Elastic File System (EFS) volumes to replace the block storage\" is incorrect. You cannot use EFS to replace block storage as it uses NFS rather than iSCSI.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/storagegateway/\">https://docs.aws.amazon.com/storagegateway/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-storage-gateway/\">https://digitalcloud.training/aws-storage-gateway/</a></p>", "answers": ["<p>1. Use an AWS Storage Gateway file gateway to replace the NFS storage.</p>", "<p>1. Use the mount command on servers to mount Amazon S3 buckets using NFS.</p>", "<p>1. Use AWS Direct Connect and mount an Amazon FSx for Windows File Server using iSCSI.</p>", "<p>Use an AWS Storage Gateway volume gateway to replace the block storage.</p>", "<p>1. Use Amazon Elastic File System (EFS) volumes to replace the block storage.</p>"]}, "correct_response": ["d", "a"], "section": "AWS Storage", "question_plain": "Storage capacity has become an issue for a company that runs application servers on-premises. The servers are connected to a combination of block storage and NFS storage solutions. The company requires a solution that supports local caching without re-architecting its existing applications.Which combination of changes can the company make to meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035855, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company hosts an application on Amazon EC2 instances behind Application Load Balancers in several AWS Regions. Distribution rights for the content require that users in different geographies must be served content from specific regions.</p><p>Which configuration meets these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>To protect the distribution rights of the content and ensure that users are directed to the appropriate AWS Region based on the location of the user, the geolocation routing policy can be used with Amazon Route 53.</p><p>Geolocation routing lets you choose the resources that serve your traffic based on the geographic location of your users, meaning the location that DNS queries originate from.</p><p>When you use geolocation routing, you can localize your content and present some or all of your website in the language of your users. You can also use geolocation routing to restrict distribution of content to only the locations in which you have distribution rights.</p><p><strong>CORRECT: </strong>\"Create Amazon Route 53 records with a geolocation routing policy\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create Amazon Route 53 records with a geoproximity routing policy\" is incorrect. Use this routing policy when you want to route traffic based on the location of your resources and, optionally, shift traffic from resources in one location to resources in another.</p><p><strong>INCORRECT:</strong> \"Configure Amazon CloudFront with multiple origins and AWS WAF\" is incorrect. AWS WAF protects against web exploits but will not assist with directing users to different content (from different origins).</p><p><strong>INCORRECT:</strong> \"Configure Application Load Balancers with multi-Region routing\" is incorrect. There is no such thing as multi-Region routing for ALBs.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-route-53/\">https://digitalcloud.training/amazon-route-53/</a></p>", "answers": ["<p>Create Amazon Route 53 records with a geolocation routing policy.</p>", "<p>Create Amazon Route 53 records with a geoproximity routing policy.</p>", "<p>Configure Amazon CloudFront with multiple origins and AWS WAF.</p>", "<p>Configure Application Load Balancers with multi-Region routing.</p>"]}, "correct_response": ["a"], "section": "AWS Networking & Content Delivery", "question_plain": "A company hosts an application on Amazon EC2 instances behind Application Load Balancers in several AWS Regions. Distribution rights for the content require that users in different geographies must be served content from specific regions.Which configuration meets these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 103035857, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company plans to make an Amazon EC2 Linux instance unavailable outside of business hours to save costs. The instance is backed by an Amazon EBS volume. There is a requirement that the contents of the instance\u2019s memory must be preserved when it is made unavailable.</p><p>How can a solutions architect meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>When you hibernate an instance, Amazon EC2 signals the operating system to perform hibernation (suspend-to-disk). Hibernation saves the contents from the instance memory (RAM) to your Amazon Elastic Block Store (Amazon EBS) root volume. Amazon EC2 persists the instance's EBS root volume and any attached EBS data volumes. When you start your instance:</p><ul><li><p>The EBS root volume is restored to its previous state</p></li><li><p>The RAM contents are reloaded</p></li><li><p>The processes that were previously running on the instance are resumed</p></li><li><p>Previously attached data volumes are reattached and the instance retains its instance ID</p></li></ul><p><strong>CORRECT: </strong>\"Hibernate the instance outside business hours. Start the instance again when required\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Stop the instance outside business hours. Start the instance again when required\" is incorrect. When an instance is stopped the operating system is shut down and the contents of memory will be lost.</p><p><strong>INCORRECT:</strong> \"Use Auto Scaling to scale down the instance outside of business hours. Scale out the instance when required\" is incorrect. Auto Scaling scales does not scale up and down, it scales in by terminating instances and out by launching instances. When scaling out new instances are launched and no state will be available from terminated instances.</p><p><strong>INCORRECT:</strong> \"Terminate the instance outside business hours. Recover the instance again when required\" is incorrect. You cannot recover terminated instances, you can recover instances that have become impaired in some circumstances.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Stop the instance outside business hours. Start the instance again when required.</p>", "<p>Hibernate the instance outside business hours. Start the instance again when required.</p>", "<p>Use Auto Scaling to scale down the instance outside of business hours. Scale up the instance when required.</p>", "<p>Terminate the instance outside business hours. Recover the instance again when required.</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A company plans to make an Amazon EC2 Linux instance unavailable outside of business hours to save costs. The instance is backed by an Amazon EBS volume. There is a requirement that the contents of the instance\u2019s memory must be preserved when it is made unavailable.How can a solutions architect meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 103035859, "assessment_type": "multi-select", "prompt": {"question": "<p>Amazon EC2 instances in a development environment run between 9am and 5pm Monday-Friday. Production instances run 24/7. Which pricing models should be used to optimize cost and ensure capacity is available? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>Capacity reservations have no commitment and can be created and canceled as needed. This is ideal for the development environment as it will ensure the capacity is available. There is no price advantage but none of the other options provide a price advantage whilst also ensuring capacity is available</p><p>Reserved instances are a good choice for workloads that run continuously. This is a good option for the production environment<strong>.</strong></p><p><strong>CORRECT: </strong>\"On-demand capacity reservations for the development environment\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Use Reserved instances for the production environment\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Use Spot instances for the development environment\" is incorrect. Spot Instances are a cost-effective choice if you can be flexible about when your applications run and if your applications can be interrupted. Spot instances are not suitable for the development environment as important work may be interrupted.</p><p><strong>INCORRECT:</strong> \"Use Reserved instances for the development environment\" is incorrect as they require a long-term commitment which is not ideal for a development environment.</p><p><strong>INCORRECT:</strong> \"Use On-Demand instances for the production environment\" is incorrect. There is no long-term commitment required when you purchase On-Demand Instances. However, you do not get any discount and therefore this is the most expensive option.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/instance-purchasing-options.html\">https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/instance-purchasing-options.html</a></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Use Spot instances for the development environment</p>", "<p>Use Reserved instances for the development environment</p>", "<p>On-demand capacity reservations for the development environment</p>", "<p>Use Reserved instances for the production environment</p>", "<p>Use On-Demand instances for the production environment</p>"]}, "correct_response": ["c", "d"], "section": "AWS Compute", "question_plain": "Amazon EC2 instances in a development environment run between 9am and 5pm Monday-Friday. Production instances run 24/7. Which pricing models should be used to optimize cost and ensure capacity is available? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035861, "assessment_type": "multi-select", "prompt": {"question": "<p>A company has uploaded some highly critical data to an Amazon S3 bucket. Management are concerned about data availability and require that steps are taken to protect the data from accidental deletion. The data should still be accessible, and a user should be able to delete the data intentionally.</p><p>Which combination of steps should a solutions architect take to accomplish this? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>Multi-factor authentication (MFA) delete adds an additional step before an object can be deleted from a versioning-enabled bucket.</p><p>With MFA delete the bucket owner must include the x-amz-mfa request header in requests to permanently delete an object version or change the versioning state of the bucket.</p><p><strong>CORRECT: </strong>\"Enable versioning on the S3 bucket\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Enable MFA Delete on the S3 bucket\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Create a bucket policy on the S3 bucket\" is incorrect. A bucket policy is not required to enable MFA delete.</p><p><strong>INCORRECT:</strong> \"Enable default encryption on the S3 bucket\" is incorrect. Encryption does not protect against deletion.</p><p><strong>INCORRECT:</strong> \"Create a lifecycle policy for the objects in the S3 bucket\" is incorrect. A lifecycle policy will move data to another storage class but does not protect against deletion.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingMFADelete.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingMFADelete.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Enable versioning on the S3 bucket.</p>", "<p>Enable MFA Delete on the S3 bucket.</p>", "<p>Create a bucket policy on the S3 bucket.</p>", "<p>Enable default encryption on the S3 bucket.</p>", "<p>Create a lifecycle policy for the objects in the S3 bucket.</p>"]}, "correct_response": ["a", "b"], "section": "AWS Storage", "question_plain": "A company has uploaded some highly critical data to an Amazon S3 bucket. Management are concerned about data availability and require that steps are taken to protect the data from accidental deletion. The data should still be accessible, and a user should be able to delete the data intentionally.Which combination of steps should a solutions architect take to accomplish this? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035863, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs a large batch processing job at the end of every quarter. The processing job runs for 5 days and uses 15 Amazon EC2 instances. The processing must run uninterrupted for 5 hours per day. The company is investigating ways to reduce the cost of the batch processing job.</p><p>Which pricing model should the company choose?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>Each EC2 instance runs for 5 hours a day for 5 days per quarter or 20 days per year. This is time duration is insufficient to warrant reserved instances as these require a commitment of a minimum of 1 year and the discounts would not outweigh the costs of having the reservations unused for a large percentage of time. In this case, there are no options presented that can reduce the cost and therefore on-demand instances should be used.</p><p><strong>CORRECT: </strong>\"On-Demand Instances\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Reserved Instances\" is incorrect. Reserved instances are good for continuously running workloads that run for a period of 1 or 3 years.</p><p><strong>INCORRECT:</strong> \"Spot Instances\" is incorrect. Spot instances may be interrupted, and this is not acceptable. Note that Spot Block is deprecated and unavailable to new customers.</p><p><strong>INCORRECT:</strong> \"Dedicated Instances\" is incorrect. These do not provide any cost advantages and will be more expensive.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Reserved Instances</p>", "<p>Spot Instances</p>", "<p>On-Demand Instances</p>", "<p>Dedicated Instances</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A company runs a large batch processing job at the end of every quarter. The processing job runs for 5 days and uses 15 Amazon EC2 instances. The processing must run uninterrupted for 5 hours per day. The company is investigating ways to reduce the cost of the batch processing job.Which pricing model should the company choose?", "related_lectures": []}, {"_class": "assessment", "id": 103035865, "assessment_type": "multi-select", "prompt": {"question": "<p>A company hosts a multiplayer game on AWS. The application uses Amazon EC2 instances in a single Availability Zone and users connect over Layer 4. Solutions Architect has been tasked with making the architecture highly available and also more cost-effective.</p><p>How can the solutions architect best meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>The solutions architect must enable high availability for the architecture and ensure it is cost-effective. To enable high availability an Amazon EC2 Auto Scaling group should be created to add and remove instances across multiple availability zones.</p><p>In order to distribute the traffic to the instances the architecture should use a Network Load Balancer which operates at Layer 4. This architecture will also be cost-effective as the Auto Scaling group will ensure the right number of instances are running based on demand.</p><p><strong>CORRECT: </strong>\"Configure a Network Load Balancer in front of the EC2 instances\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Configure an Auto Scaling group to add or remove instances in multiple Availability Zones automatically\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Increase the number of instances and use smaller EC2 instance types\" is incorrect as this is not the most cost-effective option. Auto Scaling should be used to maintain the right number of active instances.</p><p><strong>INCORRECT:</strong> \"Configure an Auto Scaling group to add or remove instances in the Availability Zone automatically\" is incorrect as this is not highly available as it\u2019s a single AZ.</p><p><strong>INCORRECT:</strong> \"Configure an Application Load Balancer in front of the EC2 instances\" is incorrect as an ALB operates at Layer 7 rather than Layer 4.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html\">https://docsaws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p><p><a href=\"https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/\">https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/</a></p>", "answers": ["<p>1. Configure an Auto Scaling group to add or remove instances in the Availability Zone automatically</p>", "<p>Increase the number of instances and use smaller EC2 instance types</p>", "<p>Configure a Network Load Balancer in front of the EC2 instances</p>", "<p>Configure an Application Load Balancer in front of the EC2 instances</p>", "<p>Configure an Auto Scaling group to add or remove instances in multiple Availability Zones automatically</p>"]}, "correct_response": ["c", "e"], "section": "AWS Compute", "question_plain": "A company hosts a multiplayer game on AWS. The application uses Amazon EC2 instances in a single Availability Zone and users connect over Layer 4. Solutions Architect has been tasked with making the architecture highly available and also more cost-effective.How can the solutions architect best meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035867, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company delivers content to subscribers distributed globally from an application running on AWS. The application uses a fleet of Amazon EC2 instance in a private subnet behind an Application Load Balancer (ALB). Due to an update in copyright restrictions, it is necessary to block access for specific countries.</p><p>What is the EASIEST method to meet this requirement?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>When a user requests your content, CloudFront typically serves the requested content regardless of where the user is located. If you need to prevent users in specific countries from accessing your content, you can use the CloudFront geo restriction feature to do one of the following:</p><ul><li><p>Allow your users to access your content only if they're in one of the countries on a whitelist of approved countries.</p></li><li><p>Prevent your users from accessing your content if they're in one of the countries on a blacklist of banned countries.</p></li></ul><p>For example, if a request comes from a country where, for copyright reasons, you are not authorized to distribute your content, you can use CloudFront geo restriction to block the request.</p><p>This is the easiest and most effective way to implement a geographic restriction for the delivery of content.</p><p><strong>CORRECT: </strong>\"Use Amazon CloudFront to serve the application and deny access to blocked countries\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use a Network ACL to block the IP address ranges associated with the specific countries\" is incorrect as this would be extremely difficult to manage.</p><p><strong>INCORRECT:</strong> \"Modify the ALB security group to deny incoming traffic from blocked countries\" is incorrect as security groups cannot block traffic by country.</p><p><strong>INCORRECT:</strong> \"Modify the security group for EC2 instances to deny incoming traffic from blocked countries\" is incorrect as security groups cannot block traffic by country.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Modify the ALB security group to deny incoming traffic from blocked countries</p>", "<p>Modify the security group for EC2 instances to deny incoming traffic from blocked countries</p>", "<p>Use Amazon CloudFront to serve the application and deny access to blocked countries</p>", "<p>Use a network ACL to block the IP address ranges associated with the specific countries</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A company delivers content to subscribers distributed globally from an application running on AWS. The application uses a fleet of Amazon EC2 instance in a private subnet behind an Application Load Balancer (ALB). Due to an update in copyright restrictions, it is necessary to block access for specific countries.What is the EASIEST method to meet this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 103035869, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A website runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB) which serves as an origin for an Amazon CloudFront distribution. An AWS WAF is being used to protect against SQL injection attacks. A review of security logs revealed an external malicious IP that needs to be blocked from accessing the website.</p><p>What should a solutions architect do to protect the application?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>A new version of the AWS Web Application Firewall was released in November 2019. With AWS WAF classic you create \u201cIP match conditions\u201d, whereas with AWS WAF (new version) you create \u201cIP set match statements\u201d. Look out for wording on the exam.</p><p>The IP match condition / IP set match statement inspects the IP address of a web request's origin against a set of IP addresses and address ranges. Use this to allow or block web requests based on the IP addresses that the requests originate from.</p><p>AWS WAF supports all IPv4 and IPv6 address ranges. An IP set can hold up to 10,000 IP addresses or IP address ranges to check.</p><p><strong>CORRECT: </strong>\"Modify the configuration of AWS WAF to add an IP match condition to block the malicious IP address\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Modify the network ACL on the CloudFront distribution to add a deny rule for the malicious IP address\" is incorrect as CloudFront does not sit within a subnet so network ACLs do not apply to it.</p><p><strong>INCORRECT:</strong> \"Modify the network ACL for the EC2 instances in the target groups behind the ALB to deny the malicious IP address\" is incorrect as the source IP addresses of the data in the EC2 instances\u2019 subnets will be the ELB IP addresses.</p><p><strong>INCORRECT:</strong> \"Modify the security groups for the EC2 instances in the target groups behind the ALB to deny the malicious IP address.\" is incorrect as you cannot create deny rules with security groups.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-ipset-match.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-ipset-match.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-waf-shield/\">https://digitalcloud.training/aws-waf-shield/</a></p>", "answers": ["<p>Modify the network ACL on the CloudFront distribution to add a deny rule for the malicious IP address</p>", "<p>Modify the configuration of AWS WAF to add an IP match condition to block the malicious IP address</p>", "<p>Modify the network ACL for the EC2 instances in the target groups behind the ALB to deny the malicious IP address</p>", "<p>Modify the security groups for the EC2 instances in the target groups behind the ALB to deny the malicious IP address</p>"]}, "correct_response": ["b"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A website runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB) which serves as an origin for an Amazon CloudFront distribution. An AWS WAF is being used to protect against SQL injection attacks. A review of security logs revealed an external malicious IP that needs to be blocked from accessing the website.What should a solutions architect do to protect the application?", "related_lectures": []}, {"_class": "assessment", "id": 103035871, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A solutions architect needs to backup some application log files from an online ecommerce store to Amazon S3. It is unknown how often the logs will be accessed or which logs will be accessed the most. The solutions architect must keep costs as low as possible by using the appropriate S3 storage class.</p><p>Which S3 storage class should be implemented to meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>The S3 Intelligent-Tiering storage class is designed to optimize costs by automatically moving data to the most cost-effective access tier, without performance impact or operational overhead.</p><p>It works by storing objects in two access tiers: one tier that is optimized for frequent access and another lower-cost tier that is optimized for infrequent access. This is an ideal use case for intelligent-tiering as the access patterns for the log files are not known.</p><p><strong>CORRECT: </strong>\"S3 Intelligent-Tiering\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"S3 Standard-Infrequent Access (S3 Standard-IA)\" is incorrect as if the data is accessed often retrieval fees could become expensive.</p><p><strong>INCORRECT:</strong> \"S3 One Zone-Infrequent Access (S3 One Zone-IA)\" is incorrect as if the data is accessed often retrieval fees could become expensive.</p><p><strong>INCORRECT:</strong> \"S3 Glacier\" is incorrect as if the data is accessed often retrieval fees could become expensive. Glacier also requires more work in retrieving the data from the archive and quick access requirements can add further costs.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/s3/storage-classes/#Unknown_or_changing_access\">https://aws.amazon.com/s3/storage-classes/#Unknown_or_changing_access</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>S3 Glacier</p>", "<p>S3 Intelligent-Tiering</p>", "<p>S3 Standard-Infrequent Access (S3 Standard-IA)</p>", "<p>S3 One Zone-Infrequent Access (S3 One Zone-IA)</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A solutions architect needs to backup some application log files from an online ecommerce store to Amazon S3. It is unknown how often the logs will be accessed or which logs will be accessed the most. The solutions architect must keep costs as low as possible by using the appropriate S3 storage class.Which S3 storage class should be implemented to meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 103035873, "assessment_type": "multi-select", "prompt": {"question": "<p>A solutions architect is designing a new service that will use an Amazon API Gateway API on the frontend. The service will need to persist data in a backend database using key-value requests. Initially, the data requirements will be around 1 GB and future growth is unknown. Requests can range from 0 to over 800 requests per second.</p><p>Which combination of AWS services would meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>In this case AWS Lambda can perform the computation and store the data in an Amazon DynamoDB table. Lambda can scale concurrent executions to meet demand easily and DynamoDB is built for key-value data storage requirements and is also serverless and easily scalable. This is therefore a cost effective solution for unpredictable workloads.</p><p><strong>CORRECT: </strong>\"AWS Lambda\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Amazon DynamoDB\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"AWS Fargate\" is incorrect as containers run constantly and therefore incur costs even when no requests are being made.</p><p><strong>INCORRECT:</strong> \"Amazon EC2 Auto Scaling\" is incorrect as this uses EC2 instances which will incur costs even when no requests are being made.</p><p><strong>INCORRECT:</strong> \"Amazon RDS\" is incorrect as this is a relational database not a No-SQL database. It is therefore not suitable for key-value data storage requirements.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/lambda/features/\">https://aws.amazon.com/lambda/features/</a></p><p><a href=\"https://aws.amazon.com/dynamodb/\">https://aws.amazon.com/dynamodb/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p><p><a href=\"https://digitalcloud.training/amazon-dynamodb/\">https://digitalcloud.training/amazon-dynamodb/</a></p>", "answers": ["<p>AWS Fargate</p>", "<p>AWS Lambda</p>", "<p>Amazon DynamoDB</p>", "<p>Amazon EC2 Auto Scaling</p>", "<p>Amazon RDS</p>"]}, "correct_response": ["b", "c"], "section": "AWS Database", "question_plain": "A solutions architect is designing a new service that will use an Amazon API Gateway API on the frontend. The service will need to persist data in a backend database using key-value requests. Initially, the data requirements will be around 1 GB and future growth is unknown. Requests can range from 0 to over 800 requests per second.Which combination of AWS services would meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035875, "assessment_type": "multi-select", "prompt": {"question": "<p>A company's application is running on Amazon EC2 instances in a single Region. In the event of a disaster, a solutions architect needs to ensure that the resources can also be deployed to a second Region.</p><p>Which combination of actions should the solutions architect take to accomplish this? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>You can copy an Amazon Machine Image (AMI) within or across AWS Regions using the AWS Management Console, the AWS Command Line Interface or SDKs, or the Amazon EC2 API, all of which support the CopyImage action.</p><p>Using the copied AMI the solutions architect would then be able to launch an instance from the same EBS volume in the second Region.</p><p><strong>Note: </strong>the AMIs are stored on Amazon S3, however you cannot view them in the S3 management console or work with them programmatically using the S3 API.</p><p><strong>CORRECT: </strong>\"Copy an Amazon Machine Image (AMI) of an EC2 instance and specify the second Region for the destination\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Launch a new EC2 instance from an Amazon Machine Image (AMI) in the second Region\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Detach a volume on an EC2 instance and copy it to an Amazon S3 bucket in the second Region\" is incorrect. You cannot copy EBS volumes directly from EBS to Amazon S3.</p><p><strong>INCORRECT:</strong> \"Launch a new EC2 instance in the second Region and copy a volume from Amazon S3 to the new instance\" is incorrect. You cannot create an EBS volume directly from Amazon S3.</p><p><strong>INCORRECT:</strong> \"Copy an Amazon Elastic Block Store (Amazon EBS) volume from Amazon S3 and launch an EC2 instance in the second Region using that EBS volume\" is incorrect. You cannot create an EBS volume directly from Amazon S3.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/CopyingAMIs.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ebs/\">https://digitalcloud.training/amazon-ebs/</a></p>", "answers": ["<p>Detach a volume on an EC2 instance and copy it to an Amazon S3 bucket in the second Region</p>", "<p>Launch a new EC2 instance from an Amazon Machine Image (AMI) in the second Region</p>", "<p>Launch a new EC2 instance in the second Region and copy a volume from Amazon S3 to the new instance</p>", "<p>Copy an Amazon Machine Image (AMI) of an EC2 instance and specify the second Region for the destination</p>", "<p>Copy an Amazon Elastic Block Store (Amazon EBS) volume from Amazon S3 and launch an EC2 instance in the second Region using that EBS volume</p>"]}, "correct_response": ["b", "d"], "section": "AWS Compute", "question_plain": "A company's application is running on Amazon EC2 instances in a single Region. In the event of a disaster, a solutions architect needs to ensure that the resources can also be deployed to a second Region.Which combination of actions should the solutions architect take to accomplish this? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 103035877, "assessment_type": "multi-select", "prompt": {"question": "<p>A solutions architect is creating a document submission application for a school. The application will use an Amazon S3 bucket for storage. The solution must prevent accidental deletion of the documents and ensure that all versions of the documents are available. Users must be able to upload and modify the documents.</p><p>Which combination of actions should be taken to meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p>None of the options present a good solution for specifying permissions required to write and modify objects so that requirement needs to be taken care of separately. The other requirements are to prevent accidental deletion and the ensure that all versions of the document are available.</p><p>The two solutions for these requirements are versioning and MFA delete. Versioning will retain a copy of each version of the document and multi-factor authentication delete (MFA delete) will prevent any accidental deletion as you need to supply a second factor when attempting a delete.</p><p><strong>CORRECT: </strong>\"Enable versioning on the bucket\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Enable MFA Delete on the bucket\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Set read-only permissions on the bucket\" is incorrect as this will also prevent any writing to the bucket which is not desired.</p><p><strong>INCORRECT:</strong> \"Attach an IAM policy to the bucket\" is incorrect as users need to modify documents which will also allow delete. Therefore, a method must be implemented to just control deletes.</p><p><strong>INCORRECT:</strong> \"Encrypt the bucket using AWS SSE-S3\" is incorrect as encryption doesn\u2019t stop you from deleting an object.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html</a></p><p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingMFADelete.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingMFADelete.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Set read-only permissions on the bucket</p>", "<p>Enable versioning on the bucket</p>", "<p>Attach an IAM policy to the bucket</p>", "<p>Enable MFA Delete on the bucket</p>", "<p>Encrypt the bucket using AWS SSE-S3</p>"]}, "correct_response": ["d", "b"], "section": "AWS Storage", "question_plain": "A solutions archite
