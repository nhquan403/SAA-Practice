s in Amazon S3:</strong> This is incorrect because, while Fargate reduces infrastructure management, integrating SQS for workflow orchestration adds complexity compared to using AWS Step Functions. AWS Batch provides more specialized functionality for processing batch workloads.</p><p><strong>Use AWS Lambda and Amazon EC2 On-Demand Instances for video processing. Store the processed files in Amazon FSx for Lustre:</strong> This is incorrect because combining Lambda with EC2 adds complexity to infrastructure management and does not fully eliminate operational overhead. Additionally, FSx for Lustre is more suitable for high-performance computing scenarios rather than general-purpose storage of processed files.</p><p><strong>Use a fleet of Amazon EC2 Spot Instances to process the videos. Use AWS Step Functions for workflow management and store the processed files in Amazon Elastic File System (Amazon EFS):</strong> This is incorrect because Spot Instances are not ideal for workflows that must minimize interruptions, as they can be terminated unexpectedly. AWS Batch is a more suitable solution for managing job processing workloads with minimal operational overhead.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html\">https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html</a></p><p><a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html\">https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html</a></p>", "answers": ["<p>Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate to process the videos. Use Amazon Simple Queue Service (Amazon SQS) for workflow orchestration and store the processed files in Amazon S3.</p>", "<p>Use AWS Batch to run video processing jobs. Use AWS Step Functions to manage the workflow. Store the processed files in Amazon S3.</p>", "<p>Use AWS Lambda and Amazon EC2 On-Demand Instances for video processing. Store the processed files in Amazon FSx for Lustre.</p>", "<p>Use a fleet of Amazon EC2 Spot Instances to process the videos. Use AWS Step Functions for workflow management and store the processed files in Amazon Elastic File System (Amazon EFS).</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A media processing company is migrating its on-premises application to the AWS Cloud. The application processes high volumes of videos and generates large output files during the workflow.The company requires a scalable solution to handle an increasing number of video processing jobs. The solution should minimize manual intervention, simplify job orchestration, and eliminate the need to manage infrastructure. Operational overhead must be kept to a minimum.Which solution will fulfill these requirements with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764527, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A logistics company is running a containerized application on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster with Amazon EC2 instances as the worker nodes. The application includes a management dashboard that uses Amazon DynamoDB for real-time tracking data and a reporting service that stores large datasets in Amazon S3.</p><p>The company needs to ensure that the EKS Pods running the management dashboard can access only Amazon DynamoDB, and the EKS Pods running the reporting service can access only Amazon S3. The company uses AWS Identity and Access Management (IAM) for access control.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Create separate IAM roles with policies for Amazon S3 and DynamoDB access. Use Kubernetes service accounts with IAM Role for Service Accounts (IRSA) to assign the AmazonS3FullAccess policy to the reporting service Pods and the AmazonDynamoDBFullAccess policy to the management dashboard Pods:</strong> This is correct because IAM Role for Service Accounts (IRSA) allows the assignment of IAM roles directly to Kubernetes service accounts, which the Pods use to assume permissions. This solution enables fine-grained access control, ensuring that the Pods for the management dashboard can access only DynamoDB and the Pods for the reporting service can access only S3.</p><p><strong>Create separate IAM policies for Amazon S3 and DynamoDB access. Attach both policies to the IAM role associated with the EC2 instance profile. Use Kubernetes namespaces to restrict access for the respective Pods to Amazon S3 or DynamoDB:</strong> This is incorrect because attaching both policies to the EC2 instance profile means all Pods running on the worker nodes would inherit access to both S3 and DynamoDB, violating the requirement for restricted access. Kubernetes namespaces alone do not enforce IAM permissions.</p><p><strong>Create IAM roles with permissions for Amazon S3 and DynamoDB access. Attach the Amazon S3 role to the reporting service Pods and the DynamoDB role to the management dashboard Pods using a shared service account:</strong> This is incorrect because using a shared service account would not provide sufficient isolation between the Pods. IRSA is the correct mechanism to ensure separate access control for each service.</p><p><strong>Configure role-based access control (RBAC) within Kubernetes to define which Pods can access Amazon S3 and DynamoDB. Use Kubernetes ConfigMaps to store the IAM credentials for each service:</strong> This is incorrect because storing IAM credentials in ConfigMaps is not a secure practice. Additionally, RBAC in Kubernetes is not designed to enforce access control for AWS services. IRSA is the proper solution for managing IAM permissions at the Pod level.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html\">https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html</a></p><p><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/associate-service-account-role.html\">https://docs.aws.amazon.com/eks/latest/userguide/associate-service-account-role.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-iam/\">https://digitalcloud.training/aws-iam/</a></p>", "answers": ["<p>Create separate IAM policies for Amazon S3 and DynamoDB access. Attach both policies to the IAM role associated with the EC2 instance profile. Use Kubernetes namespaces to restrict access for the respective Pods to Amazon S3 or DynamoDB.</p>", "<p>Create separate IAM roles with policies for Amazon S3 and DynamoDB access. Use Kubernetes service accounts with IAM Role for Service Accounts (IRSA) to assign the AmazonS3FullAccess policy to the reporting service Pods and the AmazonDynamoDBFullAccess policy to the management dashboard Pods.</p>", "<p>Create IAM roles with permissions for Amazon S3 and DynamoDB access. Attach the Amazon S3 role to the reporting service Pods and the DynamoDB role to the management dashboard Pods using a shared service account.</p>", "<p>Configure role-based access control (RBAC) within Kubernetes to define which Pods can access Amazon S3 and DynamoDB. Use Kubernetes ConfigMaps to store the IAM credentials for each service.</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A logistics company is running a containerized application on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster with Amazon EC2 instances as the worker nodes. The application includes a management dashboard that uses Amazon DynamoDB for real-time tracking data and a reporting service that stores large datasets in Amazon S3.The company needs to ensure that the EKS Pods running the management dashboard can access only Amazon DynamoDB, and the EKS Pods running the reporting service can access only Amazon S3. The company uses AWS Identity and Access Management (IAM) for access control.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764529, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A logistics company processes real-time sensor data from delivery vehicles to optimize routes and track vehicle health. The current architecture includes an Auto Scaling group of Amazon EC2 instances for ingesting and storing sensor data, and a separate Auto Scaling group for analyzing and generating route optimizations based on this data.</p><p>The company has observed performance issues during peak delivery hours when the rate of data ingestion is significantly higher than the analysis and processing rate. The company wants to ensure that both systems can scale independently, and no data is lost during scaling events.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use two Amazon Simple Queue Service (Amazon SQS) queues: one for data ingestion and one for route analysis. Configure the EC2 instances to poll their respective queues and scale the Auto Scaling groups based on the ApproximateNumberOfMessages metric in each queue:</strong> This is correct because SQS decouples the ingestion and analysis processes, ensuring no data is lost during traffic spikes. Scaling the Auto Scaling groups based on the queue length allows for efficient scaling that matches the workload demand for each process.</p><p><strong>Replace the EC2-based Auto Scaling groups with AWS Lambda functions to process the incoming data and analysis tasks. Use Amazon DynamoDB to store the intermediate data and scale DynamoDB based on the traffic patterns:</strong> This is incorrect because replacing EC2 instances with Lambda introduces architectural changes and operational overhead. Additionally, DynamoDB is not required when SQS provides an efficient decoupling mechanism.</p><p><strong>Use Amazon Kinesis Data Streams to buffer the sensor data. Configure Amazon Kinesis Data Analytics to process the data and adjust the number of EC2 instances in the analysis Auto Scaling group based on the volume of data being processed:</strong> This is incorrect because Kinesis introduces additional complexity and costs and is not necessary for this use case. SQS already provides buffering and scaling capabilities tailored to this scenario.</p><p><strong>Use two Amazon SQS queues: one for data ingestion and one for route analysis. Configure Amazon EventBridge rules to monitor queue length and scale each Auto Scaling group based on the backlog of messages in their respective queues:</strong> This is incorrect because EventBridge is not the optimal mechanism for scaling Auto Scaling groups. Scaling directly based on SQS metrics is simpler and more efficient for managing workloads in this scenario.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html</a><br><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Use two Amazon Simple Queue Service (Amazon SQS) queues: one for data ingestion and one for route analysis. Configure the EC2 instances to poll their respective queues and scale the Auto Scaling groups based on the ApproximateNumberOfMessages metric in each queue.</p>", "<p>Replace the EC2-based Auto Scaling groups with AWS Lambda functions to process the incoming data and analysis tasks. Use Amazon DynamoDB to store the intermediate data and scale DynamoDB based on the traffic patterns.</p>", "<p>Use Amazon Kinesis Data Streams to buffer the sensor data. Configure Amazon Kinesis Data Analytics to process the data and adjust the number of EC2 instances in the analysis Auto Scaling group based on the volume of data being processed.</p>", "<p>Use two Amazon SQS queues: one for data ingestion and one for route analysis. Configure Amazon EventBridge rules to monitor queue length and scale each Auto Scaling group based on the backlog of messages in their respective queues.</p>"]}, "correct_response": ["a"], "section": "AWS Application Integration", "question_plain": "A logistics company processes real-time sensor data from delivery vehicles to optimize routes and track vehicle health. The current architecture includes an Auto Scaling group of Amazon EC2 instances for ingesting and storing sensor data, and a separate Auto Scaling group for analyzing and generating route optimizations based on this data.The company has observed performance issues during peak delivery hours when the rate of data ingestion is significantly higher than the analysis and processing rate. The company wants to ensure that both systems can scale independently, and no data is lost during scaling events.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764531, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A global logistics company hosts its shipment tracking system in the <strong>eu-west-1 Region</strong>. The system runs on Amazon EC2 instances, and customers access the shipment tracking API to retrieve real-time updates about their packages. Customers from Asia and South America report slower API response times compared to customers in Europe.</p><p>The company wants to improve API response times for international customers in a cost-effective manner.</p><p>Which solution will meet these requirements MOST cost-effectively?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use AWS Global Accelerator to route traffic through the closest AWS edge location to customers. Configure endpoint groups for the shipment tracking API to distribute traffic globally and reduce response times:</strong> This is correct because Global Accelerator uses AWS\u2019s global network to reduce latency by routing traffic through the nearest edge location to the customer. It ensures cost-effective performance improvement for customers in Asia and South America without requiring infrastructure duplication in multiple Regions.</p><p><strong>Establish an AWS Direct Connect connection with a public virtual interface (VIF) from each international customer's data center to the eu-west-1 Region. Route API requests over the Direct Connect connection to the shipment tracking system:</strong> This is incorrect because Direct Connect requires significant investment in physical infrastructure and is more suitable for consistent, high-bandwidth traffic rather than improving API latency for multiple international customers.</p><p><strong>Deploy Amazon CloudFront in front of the API. Configure the API response to be cached and use the CachingOptimized managed policy to improve efficiency and reduce latency for frequently requested data:</strong> This is incorrect because CloudFront is ideal for caching static or frequently accessed content. For real-time APIs where caching is not effective, CloudFront would not address latency issues for international users.</p><p><strong>Deploy EC2 instances hosting the API in Asia and South America. Use an Application Load Balancer to distribute traffic across all Regions based on the geolocation of customer requests:</strong> This is incorrect because deploying additional EC2 instances in multiple Regions increases operational costs and complexity. Global Accelerator is a more cost-effective solution that avoids duplicating infrastructure.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction.html</a><br><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-global-accelerator/\">https://digitalcloud.training/aws-global-accelerator/</a></p>", "answers": ["<p>Establish an AWS Direct Connect connection with a public virtual interface (VIF) from each international customer's data center to the <strong>eu-west-1 Region</strong>. Route API requests over the Direct Connect connection to the shipment tracking system.</p>", "<p>Deploy Amazon CloudFront in front of the API. Configure the API response to be cached and use the <strong>CachingOptimized managed policy</strong> to improve efficiency and reduce latency for frequently requested data.</p>", "<p>Use AWS Global Accelerator to route traffic through the closest AWS edge location to customers. Configure endpoint groups for the shipment tracking API to distribute traffic globally and reduce response times.</p>", "<p>Deploy EC2 instances hosting the API in Asia and South America. Use an Application Load Balancer to distribute traffic across all Regions based on the geolocation of customer requests.</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A global logistics company hosts its shipment tracking system in the eu-west-1 Region. The system runs on Amazon EC2 instances, and customers access the shipment tracking API to retrieve real-time updates about their packages. Customers from Asia and South America report slower API response times compared to customers in Europe.The company wants to improve API response times for international customers in a cost-effective manner.Which solution will meet these requirements MOST cost-effectively?", "related_lectures": []}, {"_class": "assessment", "id": 184764533, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A genetics research firm processes DNA sequencing data for multiple clients. The raw data is stored in relational databases provided by each client. The company must extract the data, apply unique transformation algorithms for each client, and store the processed results in Amazon S3.</p><p>Due to the sensitivity of the data, the company must encrypt it both during processing and at rest in Amazon S3. Each client must have their own encryption keys to meet compliance requirements. The company also wants to minimize operational overhead while implementing this solution.</p><p>Which solution will meet these requirements with the LEAST operational effort?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use AWS Glue to create individual ETL jobs for each client. Attach a security configuration that uses client-specific AWS KMS keys for server-side encryption (SSE-KMS) during processing and storage in S3:</strong> This is correct because AWS Glue simplifies ETL workflows and supports attaching security configurations to enforce client-specific encryption with KMS keys. This approach minimizes operational effort by automating the process while meeting encryption requirements.</p><p><strong>Use AWS Glue to create a single ETL pipeline for all clients. Configure the pipeline to tag each client\u2019s data and use server-side encryption with AWS KMS keys (SSE-KMS) to encrypt data based on client-specific keys before storing it in Amazon S3:</strong> This is incorrect because a single ETL pipeline complicates the tagging and encryption logic, increasing the risk of errors. Separate ETL jobs for each client provide a cleaner and more scalable solution.</p><p><strong>Deploy an Amazon EMR cluster for each client with a client-specific Hadoop configuration. Use client-side encryption (CSE) to encrypt data with customer-managed root keys during transformations and upload the results to S3:</strong> This is incorrect because deploying separate EMR clusters for each client significantly increases operational overhead and costs. AWS Glue is a more efficient solution for this workload.</p><p><strong>Deploy a centralized Amazon EMR cluster to process data for all clients. Encrypt the data in transit using TLS certificates for each client and store the data in Amazon S3 using server-side encryption with Amazon S3 managed keys (SSE-S3):</strong> This is incorrect because TLS encrypts data only in transit, not during processing. Additionally, SSE-S3 does not meet the compliance requirement of using client-specific encryption keys.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/glue/latest/dg/encryption-security-configurations.html\">https://docs.aws.amazon.com/glue/latest/dg/encryption-security-configurations.html</a><br><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html\">https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-glue/\">https://digitalcloud.training/aws-glue/</a></p>", "answers": ["<p>Use AWS Glue to create a single ETL pipeline for all clients. Configure the pipeline to tag each client\u2019s data and use server-side encryption with AWS KMS keys (SSE-KMS) to encrypt data based on client-specific keys before storing it in Amazon S3.</p>", "<p>Deploy an Amazon EMR cluster for each client with a client-specific Hadoop configuration. Use client-side encryption (CSE) to encrypt data with customer-managed root keys during transformations and upload the results to S3.</p>", "<p>Use AWS Glue to create individual ETL jobs for each client. Attach a security configuration that uses client-specific AWS KMS keys for server-side encryption (SSE-KMS) during processing and storage in S3.</p>", "<p>Deploy a centralized Amazon EMR cluster to process data for all clients. Encrypt the data in transit using TLS certificates for each client and store the data in Amazon S3 using server-side encryption with Amazon S3 managed keys (SSE-S3).</p>"]}, "correct_response": ["c"], "section": "AWS Analytics", "question_plain": "A genetics research firm processes DNA sequencing data for multiple clients. The raw data is stored in relational databases provided by each client. The company must extract the data, apply unique transformation algorithms for each client, and store the processed results in Amazon S3.Due to the sensitivity of the data, the company must encrypt it both during processing and at rest in Amazon S3. Each client must have their own encryption keys to meet compliance requirements. The company also wants to minimize operational overhead while implementing this solution.Which solution will meet these requirements with the LEAST operational effort?", "related_lectures": []}, {"_class": "assessment", "id": 184764535, "assessment_type": "multi-select", "prompt": {"question": "<p>A healthcare organization operates multiple applications on virtual machines (VMs) in its on-premises data center. Due to increasing demand for its services, the data center can no longer scale quickly enough to meet business needs. The organization has decided to migrate its non-critical workloads to AWS using a lift-and-shift strategy to expedite the process.</p><p>Which combination of steps will meet these requirements? (Select THREE.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", "", ""], "explanation": "<p><strong>Use AWS Application Migration Service to replicate the VMs to AWS. Install the AWS Replication Agent on each VM:</strong> This is correct because AWS Application Migration Service enables lift-and-shift migrations by replicating VMs from the on-premises data center to AWS. Installing the Replication Agent is the first step to initiate data replication.</p><p><strong>Complete the initial data replication from the VMs to AWS. Launch test instances to perform acceptance tests for the workloads:</strong> This is correct because testing the replicated workloads ensures the migrated VMs function as expected on AWS before the final cutover.</p><p><strong>Stop all operations on the VMs. Perform a cutover by launching the migrated instances in AWS:</strong> This is correct because stopping operations ensures a clean cutover process, allowing the organization to launch the migrated instances in AWS with minimal disruption to business operations.</p><p><strong>Use AWS Server Migration Service (AWS SMS) to automate the migration of VMs to Amazon EC2 instances:</strong> This is incorrect because AWS SMS has been deprecated in favor of AWS Application Migration Service, which provides a more streamlined and modern approach to lift-and-shift migrations.</p><p><strong>Install the AWS Systems Manager Agent on the VMs to streamline operational management during migration:</strong> This is incorrect because while the Systems Manager Agent is useful for post-migration operations and management, it is not directly involved in the lift-and-shift migration process.</p><p><strong>Use AWS App Runner to containerize the workloads before migrating them to AWS:</strong> This is incorrect because containerizing workloads introduces additional complexity and does not align with the lift-and-shift strategy described in the scenario.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/migrationhub/latest/ug/what-is-migrationhub.html\">https://docs.aws.amazon.com/migrationhub/latest/ug/what-is-migrationhub.html</a><br><a href=\"https://docs.aws.amazon.com/mgn/latest/ug/what-is-aws-mgn.html\">https://docs.aws.amazon.com/mgn/latest/ug/what-is-aws-mgn.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Use AWS Application Migration Service to replicate the VMs to AWS. Install the AWS Replication Agent on each VM.</p>", "<p>Use AWS Server Migration Service (AWS SMS) to automate the migration of VMs to Amazon EC2 instances.</p>", "<p>Complete the initial data replication from the VMs to AWS. Launch test instances to perform acceptance tests for the workloads.</p>", "<p>Install the AWS Systems Manager Agent on the VMs to streamline operational management during migration.</p>", "<p>Stop all operations on the VMs. Perform a cutover by launching the migrated instances in AWS.</p>", "<p>Use AWS App Runner to containerize the workloads before migrating them to AWS.</p>"]}, "correct_response": ["a", "c", "e"], "section": "AWS Migration & Transfer", "question_plain": "A healthcare organization operates multiple applications on virtual machines (VMs) in its on-premises data center. Due to increasing demand for its services, the data center can no longer scale quickly enough to meet business needs. The organization has decided to migrate its non-critical workloads to AWS using a lift-and-shift strategy to expedite the process.Which combination of steps will meet these requirements? (Select THREE.)", "related_lectures": []}, {"_class": "assessment", "id": 184764537, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A genomics research organization is building an application to analyze large datasets. Raw genomic data is stored in an Amazon S3 bucket, processed by multiple Amazon EC2 instances, and the results are stored in a separate S3 bucket. The application frequently transfers large amounts of data between the EC2 instances during analysis. The organization wants to reduce overall data transfer costs while maintaining efficient data processing.</p><p>What should the solutions architect do to achieve this?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Deploy all the EC2 instances in the same Availability Zone to eliminate cross-AZ data transfer charges:</strong> This is correct because data transfer between EC2 instances in the same AZ is free, while transferring data across AZs incurs additional charges. Keeping all instances in the same AZ minimizes data transfer costs while maintaining efficient processing.<br><strong>Configure an Auto Scaling group to launch the EC2 instances in multiple Regions to distribute the processing workload:</strong> This is incorrect because distributing workloads across multiple Regions increases inter-region data transfer costs, which are higher than cross-AZ costs. This approach does not address the need to reduce data transfer costs.<br><strong>Use Amazon Elastic Fabric Adapter (EFA) to enable high-speed data transfer between EC2 instances, reducing transfer costs:</strong> This is incorrect because EFAs optimize network performance for HPC (high-performance computing) workloads but do not reduce costs associated with cross-AZ or inter-AZ data transfer charges.<br><strong>Use Amazon S3 Transfer Acceleration to optimize the transfer of data between the EC2 instances and the S3 buckets:</strong> This is incorrect because S3 Transfer Acceleration is designed to speed up data transfer over long distances to S3, such as from on-premises locations or remote clients. It does not reduce costs for transfers between EC2 instances.</p><p><strong>References:</strong><br><a href=\"https://aws.amazon.com/ec2/pricing/on-demand/\">https://aws.amazon.com/ec2/pricing/on-demand/</a><br><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni-efa.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni-efa.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Configure an Auto Scaling group to launch the EC2 instances in multiple Regions to distribute the processing workload.</p>", "<p>Use Amazon Elastic Fabric Adapter (EFA) to enable high-speed data transfer between EC2 instances, reducing transfer costs.</p>", "<p>Deploy all the EC2 instances in the same Availability Zone to eliminate cross-AZ data transfer charges.</p>", "<p>Use Amazon S3 Transfer Acceleration to optimize the transfer of data between the EC2 instances and the S3 buckets.</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A genomics research organization is building an application to analyze large datasets. Raw genomic data is stored in an Amazon S3 bucket, processed by multiple Amazon EC2 instances, and the results are stored in a separate S3 bucket. The application frequently transfers large amounts of data between the EC2 instances during analysis. The organization wants to reduce overall data transfer costs while maintaining efficient data processing.What should the solutions architect do to achieve this?", "related_lectures": []}, {"_class": "assessment", "id": 184764539, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A financial services company runs a trading application on a Kubernetes cluster hosted in its on-premises data center. Due to a recent surge in trading activity, the on-premises infrastructure can no longer support the increased load. The company plans to migrate the trading application to the AWS Cloud using an Amazon Elastic Kubernetes Service (Amazon EKS) cluster.</p><p>The company wants to minimize the operational overhead by avoiding management of the underlying compute infrastructure for the new AWS architecture.</p><p>Which solution will meet these requirements with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use AWS Fargate to provide the compute capacity for the EKS cluster. Create a Fargate profile and deploy the application using the profile:</strong> This is correct because AWS Fargate eliminates the need to provision or manage EC2 instances, allowing the company to run pods without managing the underlying infrastructure. This greatly reduces operational overhead and meets the company\u2019s requirements.<br><strong>Use self-managed EC2 instances to provide the compute capacity for the EKS cluster. Deploy the application to the cluster using these instances:</strong> This is incorrect because self-managed EC2 instances require manual provisioning, patching, and scaling, which increases operational overhead compared to serverless options like Fargate.<br><strong>Use managed node groups to provide the compute capacity for the EKS cluster. Deploy the application to the cluster using the managed nodes:</strong> This is incorrect because while managed node groups reduce some operational effort compared to self-managed nodes, they still require some level of instance management, such as scaling and patching, unlike Fargate.<br><strong>Use Amazon EC2 Spot Instances with managed node groups to provide cost-effective compute capacity for the EKS cluster. Deploy the application using the Spot nodes:</strong> This is incorrect because Spot Instances, while cost-effective, introduce potential interruptions and require management of instance scaling, which adds operational complexity.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/fargate.html\">https://docs.aws.amazon.com/eks/latest/userguide/fargate.html</a><br><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html\">https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ecs-and-eks/\">https://digitalcloud.training/amazon-ecs-and-eks/</a></p>", "answers": ["<p>Use self-managed EC2 instances to provide the compute capacity for the EKS cluster. Deploy the application to the cluster using these instances.</p>", "<p>Use managed node groups to provide the compute capacity for the EKS cluster. Deploy the application to the cluster using the managed nodes.</p>", "<p>Use AWS Fargate to provide the compute capacity for the EKS cluster. Create a Fargate profile and deploy the application using the profile.</p>", "<p>Use Amazon EC2 Spot Instances with managed node groups to provide cost-effective compute capacity for the EKS cluster. Deploy the application using the Spot nodes.</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A financial services company runs a trading application on a Kubernetes cluster hosted in its on-premises data center. Due to a recent surge in trading activity, the on-premises infrastructure can no longer support the increased load. The company plans to migrate the trading application to the AWS Cloud using an Amazon Elastic Kubernetes Service (Amazon EKS) cluster.The company wants to minimize the operational overhead by avoiding management of the underlying compute infrastructure for the new AWS architecture.Which solution will meet these requirements with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764541, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A startup is prototyping a movie streaming platform on AWS. The platform consists of an Application Load Balancer, an Auto Scaling group of Amazon EC2 instances to host the frontend, and an Amazon RDS for PostgreSQL DB instance running in a Single-AZ configuration.</p><p>Users report slow response times when browsing the catalog of available movies. The movie catalog is a set of tables in the database that is updated infrequently. A solutions architect finds that the database's CPU utilization spikes significantly during catalog queries.</p><p>What should the solutions architect recommend to improve the performance of the platform during catalog searches?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Implement an Amazon ElastiCache for Redis cluster to cache catalog queries. Configure the application to use lazy loading to populate the cache:</strong> This is correct because ElastiCache provides a highly performant in-memory caching layer that can significantly reduce database load and response times for infrequently updated data like a product or movie catalog. Lazy loading ensures the cache is populated only when a query misses, reducing unnecessary overhead.</p><p><strong>Migrate the movie catalog to Amazon DynamoDB and use the DynamoDB Accelerator (DAX) service to cache queries for the catalog:</strong> This is incorrect because migrating to DynamoDB introduces unnecessary complexity and operational overhead, especially for a relational workload that involves the movie catalog. DAX is designed for NoSQL databases and is not the best fit for this use case.</p><p><strong>Enable read replicas for the RDS instance. Configure the frontend application to distribute catalog queries across the read replicas:</strong> This is incorrect because while read replicas can improve performance for read-heavy workloads, they do not reduce query latency as effectively as an in-memory caching solution like ElastiCache.</p><p><strong>Use Amazon Aurora Serverless for the movie catalog database. Configure Aurora\u2019s built-in caching to handle frequent queries efficiently:</strong> This is incorrect because switching to Aurora Serverless would involve significant changes to the database architecture. While Aurora provides caching, ElastiCache is specifically optimized for high-performance caching use cases.</p><p><strong>References:</strong><br><a href=\"https://aws.amazon.com/elasticache/\">https://aws.amazon.com/elasticache/</a><br><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-elasticache/\">https://digitalcloud.training/amazon-elasticache/</a></p>", "answers": ["<p>Migrate the movie catalog to Amazon DynamoDB and use the DynamoDB Accelerator (DAX) service to cache queries for the catalog.</p>", "<p>Implement an Amazon ElastiCache for Redis cluster to cache catalog queries. Configure the application to use lazy loading to populate the cache.</p>", "<p>Enable read replicas for the RDS instance. Configure the frontend application to distribute catalog queries across the read replicas.</p>", "<p>Use Amazon Aurora Serverless for the movie catalog database. Configure Aurora\u2019s built-in caching to handle frequent queries efficiently.</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "A startup is prototyping a movie streaming platform on AWS. The platform consists of an Application Load Balancer, an Auto Scaling group of Amazon EC2 instances to host the frontend, and an Amazon RDS for PostgreSQL DB instance running in a Single-AZ configuration.Users report slow response times when browsing the catalog of available movies. The movie catalog is a set of tables in the database that is updated infrequently. A solutions architect finds that the database's CPU utilization spikes significantly during catalog queries.What should the solutions architect recommend to improve the performance of the platform during catalog searches?", "related_lectures": []}, {"_class": "assessment", "id": 184764543, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A financial services company stores transaction records in an Amazon S3 bucket. The company runs its analytics application on a cluster of on-premises servers. The application needs temporary, secure access to the S3 bucket to analyze the data files.</p><p>The company uses AWS IAM Identity Center to manage identities and ensure adherence to the principle of least privilege. The solution must avoid long-term credential storage and provide a secure method for the application to access the S3 bucket.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use IAM Roles Anywhere to issue temporary credentials to the application. Set up a trust relationship with IAM Identity Center and configure the application to assume the role using these credentials:</strong> This is correct because IAM Roles Anywhere provides a secure and scalable method for on-premises workloads to obtain temporary AWS credentials. It avoids the use of long-term credentials and integrates with IAM Identity Center to ensure least privilege access to the S3 bucket.</p><p><strong>Create an S3 bucket policy to allow access from the public IP address range of the company\u2019s on-premises servers. Configure the application to access the S3 bucket directly:</strong> This is incorrect because opening access to a public IP address range is less secure and does not align with the principle of least privilege. It exposes the S3 bucket to potential security risks.</p><p><strong>Deploy AWS Storage Gateway File Gateway to the on-premises environment. Configure the application to access the S3 bucket through the gateway by using NFS or SMB:</strong> This is incorrect because while File Gateway can provide access to S3, it is designed for file-based workloads and adds unnecessary complexity for this use case. IAM Roles Anywhere is a simpler and more secure option for temporary credentials.</p><p><strong>Use AWS Systems Manager to store an access key and secret key for an IAM user with access to the S3 bucket. Configure the application to retrieve the credentials from Systems Manager Parameter Store when needed:</strong> This is incorrect because storing long-term credentials in Parameter Store introduces security risks. Temporary credentials from IAM Roles Anywhere are a more secure and compliant solution.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html\">https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html</a><br><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-iam/\">https://digitalcloud.training/aws-iam/</a></p>", "answers": ["<p>Create an S3 bucket policy to allow access from the public IP address range of the company\u2019s on-premises servers. Configure the application to access the S3 bucket directly.</p>", "<p>Use IAM Roles Anywhere to issue temporary credentials to the application. Set up a trust relationship with IAM Identity Center and configure the application to assume the role using these credentials.</p>", "<p>Deploy AWS Storage Gateway File Gateway to the on-premises environment. Configure the application to access the S3 bucket through the gateway by using NFS or SMB.</p>", "<p>Use AWS Systems Manager to store an access key and secret key for an IAM user with access to the S3 bucket. Configure the application to retrieve the credentials from Systems Manager Parameter Store when needed.</p>"]}, "correct_response": ["b"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A financial services company stores transaction records in an Amazon S3 bucket. The company runs its analytics application on a cluster of on-premises servers. The application needs temporary, secure access to the S3 bucket to analyze the data files.The company uses AWS IAM Identity Center to manage identities and ensure adherence to the principle of least privilege. The solution must avoid long-term credential storage and provide a secure method for the application to access the S3 bucket.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764545, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A scientific research institute stores experimental datasets in AWS. Some datasets are accessed daily for analysis, while others remain unused for weeks or months. The datasets are large and must be highly durable, but the institute wants to reduce costs without compromising availability for frequently accessed data.</p><p>The institute needs a cost-effective storage solution that adapts to these varying access patterns and ensures the highest durability.</p><p>Which storage solution meets these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use Amazon S3 Intelligent-Tiering to automatically adjust storage costs based on the frequency of data access while maintaining high durability:</strong> This is correct because S3 Intelligent-Tiering dynamically transitions objects between storage tiers, optimizing costs for infrequent access while retaining the high durability and availability required for datasets.</p><p><strong>Use Amazon EFS with lifecycle policies to move infrequently accessed files to lower-cost storage tiers:</strong> This is incorrect because Amazon EFS is optimized for file-based workloads and does not provide the same cost optimization or scalability for object storage as S3 Intelligent-Tiering.</p><p><strong>Use Amazon S3 Glacier Instant Retrieval for all datasets to achieve high durability with low-cost storage for infrequent access:</strong> This is incorrect because S3 Glacier Instant Retrieval is optimized for archival storage, not for datasets that are frequently accessed. The latency and cost of retrieval make it unsuitable for daily analysis.</p><p><strong>Use Amazon FSx for Lustre integrated with Amazon S3 to offload unused datasets and retrieve them as needed for analysis:</strong> This is incorrect because FSx for Lustre is designed for high-performance computing and workloads requiring fast processing speeds. It introduces unnecessary complexity and cost for general storage needs.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html</a><br><a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Use Amazon S3 Intelligent-Tiering to automatically adjust storage costs based on the frequency of data access while maintaining high durability.</p>", "<p>Use Amazon EFS with lifecycle policies to move infrequently accessed files to lower-cost storage tiers.</p>", "<p>Use Amazon S3 Glacier Instant Retrieval for all datasets to achieve high durability with low-cost storage for infrequent access.</p>", "<p>Use Amazon FSx for Lustre integrated with Amazon S3 to offload unused datasets and retrieve them as needed for analysis.</p>"]}, "correct_response": ["a"], "section": "AWS Storage", "question_plain": "A scientific research institute stores experimental datasets in AWS. Some datasets are accessed daily for analysis, while others remain unused for weeks or months. The datasets are large and must be highly durable, but the institute wants to reduce costs without compromising availability for frequently accessed data.The institute needs a cost-effective storage solution that adapts to these varying access patterns and ensures the highest durability.Which storage solution meets these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764547, "assessment_type": "multi-select", "prompt": {"question": "<p>A financial institution is designing the architecture for a new data processing platform on AWS. The institution uses organizational units (OUs) in AWS Organizations to manage its accounts. To comply with regulatory requirements, all Amazon EC2 instances must include a compliance-level tag with values of compliant or noncompliant. IAM users must not be allowed to create EC2 instances without this tag or modify the tag after creation.</p><p>Which combination of steps will meet these requirements? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p><strong>In AWS Organizations, create a service control policy (SCP) to deny the creation of EC2 instances if the compliance-level tag is not specified. Attach the SCP to the appropriate OU:</strong> This is correct because SCPs are used to enforce policies across accounts in an organization. By denying the creation of EC2 instances without the required tag, this SCP ensures that all instances are tagged at creation.</p><p><strong>In AWS Organizations, create a tag policy to enforce the use of the compliance-level tag with the required values. Attach the tag policy to the appropriate OU to ensure EC2 instances adhere to the tagging requirements:</strong> This is correct because tag policies enforce tagging standards for AWS resources. By attaching the tag policy to the OU, you ensure that all EC2 instances follow the defined tagging requirements.</p><p><strong>Use AWS Config to check for compliance-level tags on EC2 instances. Configure AWS Config to remediate noncompliant resources by automatically adding the required tags to EC2 instances:</strong> This is incorrect because AWS Config cannot prevent resource creation or modification. It can detect noncompliance but requires additional tools like Lambda for remediation, which introduces operational overhead.</p><p><strong>Create an IAM policy that denies the deletion of tags on EC2 instances. Assign this policy to all IAM users who manage EC2 resources in the organization's accounts:</strong> This is incorrect because IAM policies apply only at the user or role level and cannot enforce organization-wide restrictions. SCPs and tag policies are better suited for this requirement.</p><p><strong>Use AWS Lambda with an EventBridge rule to trigger a function whenever a new EC2 instance is created. Configure the function to terminate any instance that does not include the compliance-level tag with the correct values:</strong> This is incorrect because using Lambda for real-time remediation introduces operational complexity. SCPs and tag policies are more efficient and simpler to manage.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies.html</a><br><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_tag-policies.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_tag-policies.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-organizations/\">https://digitalcloud.training/aws-organizations/</a></p>", "answers": ["<p>In AWS Organizations, create a service control policy (SCP) to deny the creation of EC2 instances if the compliance-level tag is not specified. Attach the SCP to the appropriate OU.</p>", "<p>In AWS Organizations, create a tag policy to enforce the use of the compliance-level tag with the required values. Attach the tag policy to the appropriate OU to ensure EC2 instances adhere to the tagging requirements.</p>", "<p>Use AWS Config to check for compliance-level tags on EC2 instances. Configure AWS Config to remediate noncompliant resources by automatically adding the required tags to EC2 instances.</p>", "<p>Create an IAM policy that denies the deletion of tags on EC2 instances. Assign this policy to all IAM users who manage EC2 resources in the organization's accounts.</p>", "<p>Use AWS Lambda with an EventBridge rule to trigger a function whenever a new EC2 instance is created. Configure the function to terminate any instance that does not include the compliance-level tag with the correct values.</p>"]}, "correct_response": ["a", "b"], "section": "AWS Management & Governance", "question_plain": "A financial institution is designing the architecture for a new data processing platform on AWS. The institution uses organizational units (OUs) in AWS Organizations to manage its accounts. To comply with regulatory requirements, all Amazon EC2 instances must include a compliance-level tag with values of compliant or noncompliant. IAM users must not be allowed to create EC2 instances without this tag or modify the tag after creation.Which combination of steps will meet these requirements? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 184764549, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A global manufacturing company uses AWS Outposts servers to manage IoT workloads in its factories across multiple continents. The company regularly updates factory IoT software, consisting of 50 files, from a central Amazon S3 bucket in the us-east-1 Region. Factories report significant delays when downloading and applying the updates, causing downtime. The company needs to minimize the latency for distributing software updates globally while reducing operational overhead.</p><p>Which solution will meet this requirement with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Create an Amazon S3 bucket in the us-east-1 Region. Set up an Amazon CloudFront distribution with the S3 bucket as the origin. Use signed URLs to download the software updates:</strong> This is correct because CloudFront caches the software updates at edge locations around the world, significantly reducing latency. Signed URLs ensure secure access, and the solution requires minimal operational overhead. <strong>Create an Amazon S3 bucket in the us-east-1 Region. Configure Amazon S3 Transfer Acceleration for the bucket. Use the S3 Transfer Acceleration endpoint for faster downloads:</strong> This is incorrect because Transfer Acceleration optimizes file transfers only when data is uploaded or downloaded from a single bucket, which may not provide consistent latency improvements for global locations. <strong>Create an Amazon S3 bucket in the us-east-1 Region. Deploy AWS Outposts servers at the factories as S3 endpoints. Configure the servers to cache the updates locally:</strong> This is incorrect because configuring Outposts servers as S3 endpoints increases operational complexity and cost. CloudFront is a simpler and more efficient solution for this use case. <strong>Create Amazon S3 buckets in multiple Regions. Configure S3 Cross-Region Replication (CRR) between the buckets. Deploy updates from the nearest bucket to each factory location:</strong> This is incorrect because managing multiple buckets and configuring CRR requires additional effort and increases complexity compared to using a single bucket with CloudFront.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html</a><br><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Create an Amazon S3 bucket in the us-east-1 Region. Configure Amazon S3 Transfer Acceleration for the bucket. Use the S3 Transfer Acceleration endpoint for faster downloads.</p>", "<p>Create an Amazon S3 bucket in the us-east-1 Region. Set up an Amazon CloudFront distribution with the S3 bucket as the origin. Use signed URLs to download the software updates.</p>", "<p>Create an Amazon S3 bucket in the us-east-1 Region. Deploy AWS Outposts servers at the factories as S3 endpoints. Configure the servers to cache the updates locally.</p>", "<p>Create Amazon S3 buckets in multiple Regions. Configure S3 Cross-Region Replication (CRR) between the buckets. Deploy updates from the nearest bucket to each factory location.</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A global manufacturing company uses AWS Outposts servers to manage IoT workloads in its factories across multiple continents. The company regularly updates factory IoT software, consisting of 50 files, from a central Amazon S3 bucket in the us-east-1 Region. Factories report significant delays when downloading and applying the updates, causing downtime. The company needs to minimize the latency for distributing software updates globally while reducing operational overhead.Which solution will meet this requirement with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764551, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A healthcare company is migrating its on-premises Oracle database to an Amazon RDS for Oracle database. The database must meet compliance requirements to retain backups for 120 days. Additionally, the company must have the ability to restore the database to any point in time within the past 10 days. The solution must minimize operational overhead and ensure compliance with these requirements.</p><p>Which solution will meet these requirements with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Configure Amazon RDS automated backups. Set the retention period to 35 days and enable point-in-time recovery for the past 10 days. Use AWS Backup to retain additional backups for 120 days:</strong> This is correct because RDS automated backups support up to 35 days of retention and point-in-time recovery. AWS Backup can extend the retention period to 120 days without additional complexity.<br><strong>Create an Amazon RDS manual snapshot every week. Use an AWS Lambda function to delete snapshots that are older than 120 days:</strong> This is incorrect because manual snapshot management introduces operational overhead and is not as scalable or reliable as RDS automated backups combined with AWS Backup.<br><strong>Use AWS Backup to create a backup plan for Amazon RDS with a 120-day retention period. Enable point-in-time recovery by combining AWS Backup and RDS automated backups:</strong> This is incorrect because while AWS Backup can retain backups for 120 days, it cannot directly handle point-in-time recovery, which requires native RDS automated backups.<br><strong>Set up Amazon S3 Lifecycle policies to retain database exports for 120 days. Use AWS Database Migration Service (AWS DMS) to export the database to Amazon S3 every 24 hours:</strong> This is incorrect because exporting the database to S3 introduces unnecessary operational complexity and does not support point-in-time recovery.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html</a><br><a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html\">https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Configure Amazon RDS automated backups. Set the retention period to 35 days and enable point-in-time recovery for the past 10 days. Use AWS Backup to retain additional backups for 120 days.</p>", "<p>Create an Amazon RDS manual snapshot every week. Use an AWS Lambda function to delete snapshots that are older than 120 days.</p>", "<p>Use AWS Backup to create a backup plan for Amazon RDS with a 120-day retention period. Enable point-in-time recovery by combining AWS Backup and RDS automated backups.</p>", "<p>Set up Amazon S3 Lifecycle policies to retain database exports for 120 days. Use AWS Database Migration Service (AWS DMS) to export the database to Amazon S3 every 24 hours.</p>"]}, "correct_response": ["a"], "section": "AWS Database", "question_plain": "A healthcare company is migrating its on-premises Oracle database to an Amazon RDS for Oracle database. The database must meet compliance requirements to retain backups for 120 days. Additionally, the company must have the ability to restore the database to any point in time within the past 10 days. The solution must minimize operational overhead and ensure compliance with these requirements.Which solution will meet these requirements with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764553, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A research organization wants to set up an Amazon EMR cluster for multiple departments to run their big data analytics jobs. The organization needs to ensure that each department\u2019s workloads can access only the specific AWS services required for their analysis. Additionally, the organization wants to block access to Instance Metadata Service Version 2 (IMDSv2) on the EMR cluster's underlying EC2 instances.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use EMR runtime roles to enforce granular permissions for each department's workloads. Configure the EMR cluster to use these roles when submitting jobs:</strong> This is correct because EMR runtime roles allow fine-grained access control for individual workloads without exposing permissions at the instance level. Runtime roles are scoped specifically to applications, reducing the risk of unnecessary access.</p><p><strong>Configure VPC interface endpoints for each AWS service that the departments require. Route traffic from the big data workloads through these VPC endpoints:</strong> This is incorrect because while VPC interface endpoints can restrict network access, they do not enforce permissions at the application level or prevent access to IMDSv2.</p><p><strong>Assign unique EC2 IAM instance profiles to each team\u2019s workloads. Configure the instance profiles with the specific permissions needed for each department:</strong> This is incorrect because instance profiles provide permissions at the instance level rather than the workload level. This does not ensure workload isolation or restrict access to IMDSv2.</p><p><strong>Create an EMR security configuration that disables access to the Instance Metadata Service. Use this security configuration with application-specific IAM roles to submit the workloads:</strong> This is incorrect because EMR security configurations do not directly provide granular access control for individual workloads. While security configurations can restrict metadata access, they cannot enforce permissions per workload.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-roles.html\">https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-roles.html</a><br><a href=\"https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-security-configuration.html\">https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-security-configuration.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-emr/\">https://digitalcloud.training/amazon-emr/</a></p>", "answers": ["<p>Configure VPC interface endpoints for each AWS service that the departments require. Route traffic from the big data workloads through these VPC endpoints.</p>", "<p>Use EMR runtime roles to enforce granular permissions for each department's workloads. Configure the EMR cluster to use these roles when submitting jobs.</p>", "<p>Assign unique EC2 IAM instance profiles to each team\u2019s workloads. Configure the instance profiles with the specific permissions needed for each department.</p>", "<p>Create an EMR security configuration that disables access to the Instance Metadata Service. Use this security configuration with application-specific IAM roles to submit the workloads.</p>"]}, "correct_response": ["b"], "section": "AWS Analytics", "question_plain": "A research organization wants to set up an Amazon EMR cluster for multiple departments to run their big data analytics jobs. The organization needs to ensure that each department\u2019s workloads can access only the specific AWS services required for their analysis. Additionally, the organization wants to block access to Instance Metadata Service Version 2 (IMDSv2) on the EMR cluster's underlying EC2 instances.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764555, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A healthcare organization is designing a secure web application in the AWS Cloud for managing patient records. The application must securely retrieve and store multiple patient credentials, including access keys and passwords. The organization wants to use an AWS-managed service to handle these credentials. The solution must minimize operational overhead while ensuring security.</p><p>Which solution will meet these requirements with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Store the patient credentials in AWS Secrets Manager. Use the GetSecretValue API to securely retrieve the credentials in the application at runtime:</strong> This is correct because Secrets Manager is designed to securely store and retrieve credentials with minimal operational overhead. It also supports secret rotation and integrates with AWS services for secure runtime access.</p><p><strong>Store the patient credentials in AWS Systems Manager Parameter Store. Use the GetParametersByPath API to securely retrieve the credentials in the application at runtime:</strong> This is incorrect because although Parameter Store can store credentials, it does not offer native secret rotation, which increases operational overhead.</p><p><strong>Store the patient credentials in an Amazon RDS database table. Encrypt the credentials by using AWS Key Management Service (AWS KMS). Configure the application to query the RDS database to retrieve the credentials:</strong> This is incorrect because manually managing credentials in an RDS database introduces significant operational complexity and does not offer built-in secret rotation or retrieval mechanisms.</p><p><strong>Store the patient credentials in an Amazon S3 bucket. Enable server-side encryption with AWS KMS keys (SSE-KMS). Use pre-signed URLs to retrieve the credentials securely:</strong> This is incorrect because S3 is not designed for storing credentials, and managing access via pre-signed URLs increases complexity while not offering features such as secret rotation.</p><p><strong>References:</strong> <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html\">https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html</a> <a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-secrets-manager/\">https://digitalcloud.training/aws-secrets-manager/</a></p>", "answers": ["<p>Store the patient credentials in AWS Systems Manager Parameter Store. Use the GetParametersByPath API to securely retrieve the credentials in the application at runtime.</p>", "<p>Store the patient credentials in AWS Secrets Manager. Use the GetSecretValue API to securely retrieve the credentials in the application at runtime.</p>", "<p>Store the patient credentials in an Amazon RDS database table. Encrypt the credentials by using AWS Key Management Service (AWS KMS). Configure the application to query the RDS database to retrieve the credentials.</p>", "<p>Store the patient credentials in an Amazon S3 bucket. Enable server-side encryption with AWS KMS keys (SSE-KMS). Use pre-signed URLs to retrieve the credentials securely.</p>"]}, "correct_response": ["b"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A healthcare organization is designing a secure web application in the AWS Cloud for managing patient records. The application must securely retrieve and store multiple patient credentials, including access keys and passwords. The organization wants to use an AWS-managed service to handle these credentials. The solution must minimize operational overhead while ensuring security.Which solution will meet these requirements with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764557, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A financial services company operates multiple internal services across various AWS accounts. The company uses AWS Organizations to manage these accounts and needs a centralized security appliance in a networking account to inspect all inter-service communication between AWS accounts. The solution must ensure secure and efficient routing of traffic through the security appliance.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Deploy a Gateway Load Balancer (GWLB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the GWLB by using a Gateway Load Balancer endpoint in each service account:</strong> This is correct because GWLB is specifically designed to simplify the deployment of security appliances. Using GWLB endpoints in service accounts ensures efficient routing and centralized inspection of traffic.</p><p><strong>Deploy a Network Load Balancer (NLB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the NLB by using a VPC peering connection:</strong> This is incorrect because NLB is not optimized for traffic inspection. Additionally, VPC peering lacks centralized management and scalability for large organizations.</p><p><strong>Deploy an Application Load Balancer (ALB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the ALB by using a private link:</strong> This is incorrect because ALB is primarily used for HTTP/HTTPS-based applications and is not suitable for routing traffic for inspection appliances.</p><p><strong>Deploy interface VPC endpoints in the networking account for each service in the service accounts. Configure the security appliance to inspect traffic sent through the endpoints:</strong> This is incorrect because interface VPC endpoints do not inherently support routing all traffic through a centralized appliance and lack the capability for deep packet inspection.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html</a><br><a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/introducing-aws-gateway-load-balancer/\">https://aws.amazon.com/blogs/networking-and-content-delivery/introducing-aws-gateway-load-balancer/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/\">https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/</a></p>", "answers": ["<p>Deploy a Network Load Balancer (NLB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the NLB by using a VPC peering connection.</p>", "<p>Deploy an Application Load Balancer (ALB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the ALB by using a private link.</p>", "<p>Deploy a Gateway Load Balancer (GWLB) in the networking account to route traffic to the security appliance. Configure the service accounts to send traffic to the GWLB by using a Gateway Load Balancer endpoint in each service account.</p>", "<p>Deploy interface VPC endpoints in the networking account for each service in the service accounts. Configure the security appliance to inspect traffic sent through the endpoints.</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A financial services company operates multiple internal services across various AWS accounts. The company uses AWS Organizations to manage these accounts and needs a centralized security appliance in a networking account to inspect all inter-service communication between AWS accounts. The solution must ensure secure and efficient routing of traffic through the security appliance.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764559, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company operates a multi-tier application with its backend services deployed on Amazon EC2 instances in a VPC. The backend services must communicate securely with APIs of a third-party SaaS provider that is also hosted on AWS. The company wants to ensure that this communication occurs privately and minimizes exposure to the public internet.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Configure AWS PrivateLink to create a private connection between the VPC and the third-party SaaS provider's APIs:</strong> This is correct because AWS PrivateLink enables private connectivity between VPCs and supported AWS or third-party services, ensuring that traffic does not traverse the public internet.</p><p><strong>Set up an AWS Direct Connect connection between the VPC and the third-party SaaS provider to establish private communication:</strong> This is incorrect because AWS Direct Connect is used for establishing private connections between on-premises environments and AWS, not for connecting to third-party SaaS providers within AWS.</p><p><strong>Deploy a NAT gateway in the VPC to enable secure outbound communication with the third-party SaaS provider:</strong> This is incorrect because a NAT gateway facilitates outbound internet access for resources in private subnets but does not ensure private communication with third-party services.</p><p><strong>Use an AWS VPN connection to establish a secure tunnel between the VPC and the third-party SaaS provider's infrastructure:</strong> This is incorrect because VPN connections are typically used for secure communication between on-premises environments and AWS, not for private connectivity to SaaS providers hosted on AWS.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/privatelink/latest/userguide/what-is-privatelink.html\">https://docs.aws.amazon.com/privatelink/latest/userguide/what-is-privatelink.html</a><br><a href=\"https://aws.amazon.com/privatelink/\">https://aws.amazon.com/privatelink/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Set up an AWS Direct Connect connection between the VPC and the third-party SaaS provider to establish private communication.</p>", "<p>Configure AWS PrivateLink to create a private connection between the VPC and the third-party SaaS provider's APIs.</p>", "<p>Deploy a NAT gateway in the VPC to enable secure outbound communication with the third-party SaaS provider.</p>", "<p>Use an AWS VPN connection to establish a secure tunnel between the VPC and the third-party SaaS provider's infrastructure.</p>"]}, "correct_response": ["b"], "section": "AWS Networking & Content Delivery", "question_plain": "A company operates a multi-tier application with its backend services deployed on Amazon EC2 instances in a VPC. The backend services must communicate securely with APIs of a third-party SaaS provider that is also hosted on AWS. The company wants to ensure that this communication occurs privately and minimizes exposure to the public internet.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764561, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company uses an Amazon RDS for MySQL instance for its operational database. To handle the increased read-only traffic during a recent peak period, the company added a read replica. During the peak period, the CPU usage on the read replica reached 60%, and the primary instance also had 60% CPU usage. After the peak period ended, the read replica's CPU usage decreased to 25%, while the primary instance consistently remains at 60%. The company wants to optimize costs while ensuring enough capacity for future growth.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Resize the read replica to a smaller instance size and keep the primary instance unchanged:</strong> This is correct because the read replica\u2019s CPU usage is now consistently low at 25%, meaning a smaller instance size can accommodate the current workload. Keeping the primary instance unchanged ensures consistent performance for write-heavy workloads.</p><p><strong>Delete the read replica and keep the primary instance unchanged:</strong> This is incorrect because the read replica may still be needed for future peak periods or reporting and removing it could impact performance if the workload increases again.</p><p><strong>Upgrade the read replica to a larger instance size and downgrade the primary instance to a smaller instance size:</strong> This is incorrect because the primary instance already has consistent 60% CPU usage. Downgrading it could result in performance bottlenecks.</p><p><strong>Delete the read replica and upgrade the primary instance to a larger instance size:</strong> This is incorrect because increasing the primary instance size will unnecessarily increase costs, especially since the read replica can handle reporting traffic at a lower cost.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a><br><a href=\"https://aws.amazon.com/rds/features/resize/\">https://aws.amazon.com/rds/features/resize/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Delete the read replica and keep the primary instance unchanged.</p>", "<p>Resize the read replica to a smaller instance size and keep the primary instance unchanged.</p>", "<p>Upgrade the read replica to a larger instance size and downgrade the primary instance to a smaller instance size.</p>", "<p>Delete the rea
