 endpoint as the Common Name (CN) for the SSL certificate to guard against spoofing attacks.</p><p>You can download a root certificate from AWS that works for all Regions or you can download Region-specific intermediate certificates.</p><p><strong>CORRECT: </strong>\"Download the AWS-provided root certificates. Use the certificates when connecting to the RDS DB instance\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Take a snapshot of the RDS instance. Restore the snapshot to a new instance with encryption in transit enabled\" is incorrect. There is no need to do this as a certificate is created when the DB instances is launched.</p><p><strong>INCORRECT:</strong> \"Enable encryption in transit using the RDS Management console and obtain a key using AWS KMS\" is incorrect. You cannot enable/disable encryption in transit using the RDS management console or use a KMS key.</p><p><strong>INCORRECT:</strong> \"Add a self-signed certificate to the RDS DB instance. Use the certificates in all connections to the RDS DB instance\" is incorrect. You cannot use self-signed certificates with RDS.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Enable encryption in transit using the RDS Management console and obtain a key using AWS KMS.</p>", "<p>Add a self-signed certificate to the RDS DB instance. Use the certificates in all connections to the RDS DB instance.</p>", "<p>Take a snapshot of the RDS instance. Restore the snapshot to a new instance with encryption in transit enabled.</p>", "<p>Download the AWS-provided root certificates. Use the certificates when connecting to the RDS DB instance.</p>"]}, "correct_response": ["d"], "section": "AWS Database", "question_plain": "A company uses an Amazon RDS MySQL database instance to store customer order data. The security team have requested that SSL/TLS encryption in transit must be used for encrypting connections to the database from application servers. The data in the database is currently encrypted at rest using an AWS KMS key.How can a Solutions Architect enable encryption in transit?", "related_lectures": []}, {"_class": "assessment", "id": 184764483, "assessment_type": "multi-select", "prompt": {"question": "<p>An eCommerce company runs an application on Amazon EC2 instances in public and private subnets. The web application runs in a public subnet and the database runs in a private subnet. Both the public and private subnets are in a single Availability Zone.</p><p>Which combination of steps should a solutions architect take to provide high availability for this architecture? (Select TWO.)</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>High availability can be achieved by using multiple Availability Zones within the same VPC. An EC2 Auto Scaling group can then be used to launch web application instances in multiple public subnets across multiple AZs and an ALB can be used to distribute incoming load.</p><p>The database solution can be made highly available by migrating from EC2 to Amazon RDS and using a Multi-AZ deployment model. This will provide the ability to failover to another AZ in the event of a failure of the primary database or the AZ in which it runs.</p><p><strong>CORRECT: </strong>\"Create an EC2 Auto Scaling group and Application Load Balancer that spans across multiple AZs\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Create new public and private subnets in a different AZ. Migrate the database to an Amazon RDS multi-AZ deployment\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Create new public and private subnets in the same AZ but in a different Amazon VPC\" is incorrect. You cannot use multiple VPCs for this solution as it would be difficult to manage and direct traffic (you can\u2019t load balance across VPCs).</p><p><strong>INCORRECT:</strong> \"Create an EC2 Auto Scaling group in the public subnet and use an Application Load Balancer\" is incorrect. This does not achieve HA as you need multiple public subnets across multiple AZs.</p><p><strong>INCORRECT:</strong> \"Create new public and private subnets in a different AZ. Create a database using Amazon EC2 in one AZ\" is incorrect. The database solution is not HA in this answer option.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/ec2/autoscaling/\">https://aws.amazon.com/ec2/autoscaling/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Create new public and private subnets in the same AZ but in a different Amazon VPC.</p>", "<p>Create an EC2 Auto Scaling group in the public subnet and use an Application Load Balancer.</p>", "<p>Create an EC2 Auto Scaling group and Application Load Balancer that spans across multiple AZs.</p>", "<p>Create new public and private subnets in a different AZ. Create a database using Amazon EC2 in one AZ.</p>", "<p>Create new public and private subnets in a different AZ. Migrate the database to an Amazon RDS multi-AZ deployment.</p>"]}, "correct_response": ["c", "e"], "section": "AWS Database", "question_plain": "An eCommerce company runs an application on Amazon EC2 instances in public and private subnets. The web application runs in a public subnet and the database runs in a private subnet. Both the public and private subnets are in a single Availability Zone.Which combination of steps should a solutions architect take to provide high availability for this architecture? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 184764485, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs an application on six web application servers in an Amazon EC2 Auto Scaling group in a single Availability Zone. The application is fronted by an Application Load Balancer (ALB). A Solutions Architect needs to modify the infrastructure to be highly available without making any modifications to the application.</p><p>Which architecture should the Solutions Architect choose to enable high availability?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The only thing that needs to be changed in this scenario to enable HA is to split the instances across multiple Availability Zones. The architecture already uses Auto Scaling and Elastic Load Balancing so there is plenty of resilience to failure. Once the instances are running across multiple AZs there will be AZ-level fault tolerance as well.</p><p><strong>CORRECT: </strong>\"Modify the Auto Scaling group to use two instances across each of three Availability Zones\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon CloudFront distribution with a custom origin across multiple Regions\" is incorrect. CloudFront is not used to create HA for your application, it is used to accelerate access to media content.</p><p><strong>INCORRECT:</strong> \"Create a launch template that can be used to quickly create more instances in another Region\" is incorrect. Multi-AZ should be enabled rather than multi-Region.</p><p><strong>INCORRECT:</strong> \"Create an Auto Scaling group to launch three instances across each of two Regions\" is incorrect. HA can be achieved within a Region by simply enabling more AZs in the ASG. An ASG cannot launch instances in multiple Regions.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-availability-zone.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-availability-zone.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p>", "answers": ["<p>Create an Amazon CloudFront distribution with a custom origin across multiple Regions.</p>", "<p>Modify the Auto Scaling group to use two instances across each of three Availability Zones.</p>", "<p>Create a launch template that can be used to quickly create more instances in another Region.</p>", "<p>Create an Auto Scaling group to launch three instances across each of two Regions.</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A company runs an application on six web application servers in an Amazon EC2 Auto Scaling group in a single Availability Zone. The application is fronted by an Application Load Balancer (ALB). A Solutions Architect needs to modify the infrastructure to be highly available without making any modifications to the application.Which architecture should the Solutions Architect choose to enable high availability?", "related_lectures": []}, {"_class": "assessment", "id": 184764487, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A web application allows users to upload photos and add graphical elements to them. The application offers two tiers of service: free and paid. Photos uploaded by paid users should be processed before those submitted using the free tier. The photos are uploaded to an Amazon S3 bucket which uses an event notification to send the job information to Amazon SQS.</p><p>How should a Solutions Architect configure the Amazon SQS deployment to meet these requirements?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS recommend using separate queues when you need to provide prioritization of work. The logic can then be implemented at the application layer to prioritize the queue for the paid photos over the queue for the free photos.</p><p><strong>CORRECT: </strong>\"Use a separate SQS Standard queue for each tier. Configure Amazon EC2 instances to prioritize polling for the paid queue over the free queue\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use one SQS FIFO queue. Assign a higher priority to the paid photos so they are processed first\" is incorrect. FIFO queues preserve the order of messages but they do not prioritize messages within the queue. The orders would need to be placed into the queue in a priority order and there\u2019s no way of doing this as the messages are sent automatically through event notifications as they are received by Amazon S3.</p><p><strong>INCORRECT:</strong> \"Use one SQS standard queue. Use batching for the paid photos and short polling for the free photos\" is incorrect. Batching adds efficiency but it has nothing to do with ordering or priority.</p><p><strong>INCORRECT:</strong> \"Use a separate SQS FIFO queue for each tier. Set the free queue to use short polling and the paid queue to use long polling\" is incorrect. Short polling and long polling are used to control the amount of time the consumer process waits before closing the API call and trying again. Polling should be configured for efficiency of API calls and processing of messages but does not help with message prioritization.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-how-it-works.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-how-it-works.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Use one SQS standard queue. Use batching for the paid photos and short polling for the free photos.</p>", "<p>Use a separate SQS FIFO queue for each tier. Set the free queue to use short polling and the paid queue to use long polling.</p>", "<p>Use a separate SQS Standard queue for each tier. Configure Amazon EC2 instances to prioritize polling for the paid queue over the free queue.</p>", "<p>Use one SQS FIFO queue. Assign a higher priority to the paid photos so they are processed first.</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A web application allows users to upload photos and add graphical elements to them. The application offers two tiers of service: free and paid. Photos uploaded by paid users should be processed before those submitted using the free tier. The photos are uploaded to an Amazon S3 bucket which uses an event notification to send the job information to Amazon SQS.How should a Solutions Architect configure the Amazon SQS deployment to meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764489, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company has deployed a new website on Amazon EC2 instances behind an Application Load Balancer (ALB). Amazon Route 53 is used for the DNS service. The company has asked a Solutions Architect to create a backup website with support contact details that users will be directed to automatically if the primary website is down.</p><p>How should the Solutions Architect deploy this solution cost-effectively?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The most cost-effective solution is to create a static website using an Amazon S3 bucket and then use a failover routing policy in Amazon Route 53. With a failover routing policy users will be directed to the main website as long as it is responding to health checks successfully.</p><p>If the main website fails to respond to health checks (its down), Route 53 will begin to direct users to the backup website running on the Amazon S3 bucket. It\u2019s important to set the TTL on the Route 53 records appropriately to ensure that users resolve the failover address within a short time.</p><p><strong>CORRECT: </strong>\"Configure a static website using Amazon S3 and create a Route 53 failover routing policy\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Configure a static website using Amazon S3 and create a Route 53 weighted routing policy\" is incorrect. Weighted routing is used when you want to send a percentage of traffic between multiple endpoints. In this case all traffic should go to the primary until if fails, then all should go to the backup.</p><p><strong>INCORRECT:</strong> \"Deploy the backup website on EC2 and ALB in another Region and use Route 53 health checks for failover routing\" is incorrect. This is not a cost-effective solution for the backup website. It can be implemented using Route 53 failover routing which uses health checks but would be an expensive option.</p><p><strong>INCORRECT:</strong> \"Create the backup website on EC2 and ALB in another Region and create an AWS Global Accelerator endpoint\" is incorrect. Global Accelerator is used for performance as it directs traffic to the nearest healthy endpoint. It is not useful for failover in this scenario and is also a very expensive solution.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html</a></p><p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-configuring.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-configuring.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p><p><a href=\"https://digitalcloud.training/amazon-route-53/\">https://digitalcloud.training/amazon-route-53/</a></p>", "answers": ["<p>Configure a static website using Amazon S3 and create a Route 53 weighted routing policy.</p>", "<p>Deploy the backup website on EC2 and ALB in another Region and use Route 53 health checks for failover routing.</p>", "<p>Create the backup website on EC2 and ALB in another Region and create an AWS Global Accelerator endpoint.</p>", "<p>Configure a static website using Amazon S3 and create a Route 53 failover routing policy.</p>"]}, "correct_response": ["d"], "section": "AWS Networking & Content Delivery", "question_plain": "A company has deployed a new website on Amazon EC2 instances behind an Application Load Balancer (ALB). Amazon Route 53 is used for the DNS service. The company has asked a Solutions Architect to create a backup website with support contact details that users will be directed to automatically if the primary website is down.How should the Solutions Architect deploy this solution cost-effectively?", "related_lectures": []}, {"_class": "assessment", "id": 184764491, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company requires that all AWS IAM user accounts have specific complexity requirements and minimum password length.</p><p>How should a Solutions Architect accomplish this?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The easiest way to enforce this requirement is to update the password policy that applies to the entire AWS account. When you create or change a password policy, most of the password policy settings are enforced the next time your users change their passwords. However, some of the settings are enforced immediately such as the password expiration period.</p><p><strong>CORRECT: </strong>\"Set a password policy for the entire AWS account\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Set a password policy for each IAM user in the AWS account\" is incorrect. There\u2019s no need to set an individual password policy for each user, it will be easier to set the policy for everyone.</p><p><strong>INCORRECT:</strong> \"Create an IAM policy that enforces the requirements and apply it to all users\" is incorrect. As there is no specific targeting required it is easier to update the account password policy.</p><p><strong>INCORRECT:</strong> \"Use an AWS Config rule to enforce the requirements when creating user accounts\" is incorrect. You cannot use AWS Config to enforce the password requirements at the time of creating a user account.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html?icmpid=docs_iam_console\">https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-iam/\">https://digitalcloud.training/aws-iam/</a></p>", "answers": ["<p>Set a password policy for each IAM user in the AWS account.</p>", "<p>Set a password policy for the entire AWS account.</p>", "<p>Create an IAM policy that enforces the requirements and apply it to all users.</p>", "<p>Use an AWS Config rule to enforce the requirements when creating user accounts.</p>"]}, "correct_response": ["b"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A company requires that all AWS IAM user accounts have specific complexity requirements and minimum password length.How should a Solutions Architect accomplish this?", "related_lectures": []}, {"_class": "assessment", "id": 184764493, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs a dynamic website that is hosted on an on-premises server in the United States. The company is expanding to Europe and is investigating how they can optimize the performance of the website for European users. The website\u2019s backed must remain in the United States. The company requires a solution that can be implemented within a few days.</p><p>What should a Solutions Architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>A custom origin can point to an on-premises server and CloudFront is able to cache content for dynamic websites. CloudFront can provide performance optimizations for custom origins even if they are running on on-premises servers. These include persistent TCP connections to the origin, SSL enhancements such as Session tickets and OCSP stapling.</p><p>Additionally, connections are routed from the nearest Edge Location to the user across the AWS global network. If the on-premises server is connected via a Direct Connect (DX) link this can further improve performance.</p><p><strong>CORRECT: </strong>\"Use Amazon CloudFront with a custom origin pointing to the on-premises servers\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon CloudFront with Lambda@Edge to direct traffic to an on-premises origin\" is incorrect. Lambda@Edge is not used to direct traffic to on-premises origins.</p><p><strong>INCORRECT:</strong> \"Launch an Amazon EC2 instance in an AWS Region in the United States and migrate the website to it\" is incorrect. This would not necessarily improve performance for European users.</p><p><strong>INCORRECT:</strong> \"Migrate the website to Amazon S3. Use cross-Region replication between Regions and a latency-based Route 53 policy\" is incorrect. You cannot host dynamic websites on Amazon S3 (static only).</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/cloudfront/dynamic-content/\">https://aws.amazon.com/cloudfront/dynamic-content/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Use Amazon CloudFront with Lambda@Edge to direct traffic to an on-premises origin.</p>", "<p>Launch an Amazon EC2 instance in an AWS Region in the United States and migrate the website to it.</p>", "<p>Migrate the website to Amazon S3. Use cross-Region replication between Regions and a latency-based Route 53 policy.</p>", "<p>Use Amazon CloudFront with a custom origin pointing to the on-premises servers.</p>"]}, "correct_response": ["d"], "section": "AWS Storage", "question_plain": "A company runs a dynamic website that is hosted on an on-premises server in the United States. The company is expanding to Europe and is investigating how they can optimize the performance of the website for European users. The website\u2019s backed must remain in the United States. The company requires a solution that can be implemented within a few days.What should a Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764495, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs an application in an on-premises data center that collects environmental data from production machinery. The data consists of JSON files stored on network attached storage (NAS) and around 5 TB of data is collected each day. The company must upload this data to Amazon S3 where it can be processed by an analytics application. The data must be transferred securely.</p><p>Which solution offers the MOST reliable and time-efficient data transfer?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The most reliable and time-efficient solution that keeps the data secure is to use AWS DataSync and synchronize the data from the NAS device directly to Amazon S3. This should take place over an AWS Direct Connect connection to ensure reliability, speed, and security.</p><p>AWS DataSync can copy data between Network File System (NFS) shares, Server Message Block (SMB) shares, self-managed object storage, AWS Snowcone, Amazon Simple Storage Service (Amazon S3) buckets, Amazon Elastic File System (Amazon EFS) file systems, and Amazon FSx for Windows File Server file systems.</p><p><strong>CORRECT: </strong>\"AWS DataSync over AWS Direct Connect\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"AWS Database Migration Service over the Internet\" is incorrect. DMS is for migrating databases, not files.</p><p><strong>INCORRECT:</strong> \"Amazon S3 Transfer Acceleration over the Internet\" is incorrect. The Internet does not offer the reliability, speed or performance that this company requires.</p><p><strong>INCORRECT:</strong> \"Multiple AWS Snowcone devices\" is incorrect. This is not a time-efficient approach as it can take time to ship these devices in both directions.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/datasync/\">https://aws.amazon.com/datasync/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>AWS Database Migration Service over the Internet.</p>", "<p>Amazon S3 Transfer Acceleration over the Internet.</p>", "<p>AWS DataSync over AWS Direct Connect.</p>", "<p>Multiple AWS Snowcone devices.</p>"]}, "correct_response": ["c"], "section": "AWS Migration & Transfer", "question_plain": "A company runs an application in an on-premises data center that collects environmental data from production machinery. The data consists of JSON files stored on network attached storage (NAS) and around 5 TB of data is collected each day. The company must upload this data to Amazon S3 where it can be processed by an analytics application. The data must be transferred securely.Which solution offers the MOST reliable and time-efficient data transfer?", "related_lectures": []}, {"_class": "assessment", "id": 184764497, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs an application on an Amazon EC2 instance the requires 250 GB of storage space. The application is not used often and has small spikes in usage on weekday mornings and afternoons. The disk I/O can vary with peaks hitting a maximum of 3,000 IOPS. A Solutions Architect must recommend the most cost-effective storage solution that delivers the performance required.</p><p>Which configuration should the Solutions Architect recommend?</p><p>Which solution should the solutions architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>General Purpose SSD (gp2) volumes offer cost-effective storage that is ideal for a broad range of workloads. These volumes deliver single-digit millisecond latencies and the ability to burst to 3,000 IOPS for extended periods of time.</p><p>Between a minimum of 100 IOPS (at 33.33 GiB and below) and a maximum of 16,000 IOPS (at 5,334 GiB and above), baseline performance scales linearly at 3 IOPS per GiB of volume size. AWS designs gp2 volumes to deliver their provisioned performance 99% of the time. A gp2 volume can range in size from 1 GiB to 16 TiB.</p><p>In this configuration the volume will provide a baseline performance of 750 IOPS but will always be able to burst to the required 3,000 IOPS during periods of increased traffic.</p><p><strong>CORRECT: </strong>\"Amazon EBS General Purpose SSD (gp2)\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon EBS Provisioned IOPS SSD (i01)\" is incorrect. The i01 volume type will be more expensive and is not necessary for the performance levels required.</p><p><strong>INCORRECT:</strong> \"Amazon EBS Cold HDD (sc1)\" is incorrect. The sc1 volume type is not going to deliver the performance requirements as it cannot burst to 3,000 IOPS.</p><p><strong>INCORRECT:</strong> \"Amazon EBS Throughput Optimized HDD (st1)\" is incorrect. The st1 volume type is not going to deliver the performance requirements as it cannot burst to 3,000 IOPS.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ebs/\">https://digitalcloud.training/amazon-ebs/</a></p>", "answers": ["<p>Amazon EBS Cold HDD (sc1)</p>", "<p>Amazon EBS General Purpose SSD (gp2)</p>", "<p>Amazon EBS Provisioned IOPS SSD (i01)</p>", "<p>Amazon EBS Throughput Optimized HDD (st1)</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A company runs an application on an Amazon EC2 instance the requires 250 GB of storage space. The application is not used often and has small spikes in usage on weekday mornings and afternoons. The disk I/O can vary with peaks hitting a maximum of 3,000 IOPS. A Solutions Architect must recommend the most cost-effective storage solution that delivers the performance required.Which configuration should the Solutions Architect recommend?Which solution should the solutions architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764499, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company offers an online product brochure that is delivered from a static website running on Amazon S3. The company\u2019s customers are mainly in the United States, Canada, and Mexico. The company is looking to cost-effectively reduce the latency for users in these regions.</p><p>What is the most cost-effective solution to these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>With Amazon CloudFront you can set the price class to determine where in the world the content will be cached. One of the price classes is \u201cU.S, Canada and Mexico\u201d and this is where the company\u2019s users are located. Choosing this price class will result in lower costs and better performance for the company\u2019s users.</p><p><strong>CORRECT: </strong>\"Create an Amazon CloudFront distribution and set the price class to use only U.S, Canada and Mexico.\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon CloudFront distribution and set the price class to use all Edge Locations for best performance\" is incorrect. This will be more expensive as it will cache content in Edge Locations all over the world.</p><p><strong>INCORRECT:</strong> \"Create an Amazon CloudFront distribution that uses origins in U.S, Canada and Mexico\" is incorrect. The origin can be in one place, there\u2019s no need to add origins in different Regions. The price class should be used to limit the caching of the content to reduce cost.</p><p><strong>INCORRECT:</strong> \"Create an Amazon CloudFront distribution and use Lambda@Edge to run the website's data processing closer to the users\" is incorrect. Lambda@Edge will not assist in this situation as there is no data processing required, the content from the static website must simply be cached at an edge location.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PriceClass.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PriceClass.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Create an Amazon CloudFront distribution that uses origins in U.S, Canada and Mexico.</p>", "<p>Create an Amazon CloudFront distribution and use Lambda@Edge to run the website's data processing closer to the users.</p>", "<p>Create an Amazon CloudFront distribution and set the price class to use only U.S, Canada and Mexico.</p>", "<p>Create an Amazon CloudFront distribution and set the price class to use all Edge Locations for best performance.</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A company offers an online product brochure that is delivered from a static website running on Amazon S3. The company\u2019s customers are mainly in the United States, Canada, and Mexico. The company is looking to cost-effectively reduce the latency for users in these regions.What is the most cost-effective solution to these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764501, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A developer created an application that uses Amazon EC2 and an Amazon RDS MySQL database instance. The developer stored the database user name and password in a configuration file on the root EBS volume of the EC2 application instance. A Solutions Architect has been asked to design a more secure solution.</p><p>What should the Solutions Architect do to achieve this requirement?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The key problem here is having plain text credentials stored in a file. Even if you encrypt the volume there is still as security risk as the credentials are loaded by the application and passed to RDS.</p><p>The best way to secure this solution is to get rid of the credentials completely by using an IAM role instead. The IAM role can be assigned permissions to the database instance and can be attached to the EC2 instance. The instance will then obtain temporary security credentials from AWS STS which is much more secure.</p><p><strong>CORRECT: </strong>\"Create an IAM role with permission to access the database. Attach this IAM role to the EC2 instance\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Move the configuration file to an Amazon S3 bucket. Create an IAM role with permission to the bucket and attach it to the EC2 instance\" is incorrect. This just relocates the file; the contents are still unsecured and must be loaded by the application and passed to RDS. This is an insecure process.</p><p><strong>INCORRECT:</strong> \"Attach an additional volume to the EC2 instance with encryption enabled. Move the configuration file to the encrypted volume\" is incorrect. This will only encrypt the file at rest, it still must be read, and the contents passed to RDS which is insecure.</p><p><strong>INCORRECT:</strong> \"Install an Amazon-trusted root certificate on the application instance and use SSL/TLS encrypted connections to the database\" is incorrect. The file is still unsecured on the EBS volume so encrypting the credentials in an encrypted channel between the EC2 instance and RDS does not solve all security issues.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-iam/\">https://digitalcloud.training/aws-iam/</a></p>", "answers": ["<p>Move the configuration file to an Amazon S3 bucket. Create an IAM role with permission to the bucket and attach it to the EC2 instance.</p>", "<p>Attach an additional volume to the EC2 instance with encryption enabled. Move the configuration file to the encrypted volume.</p>", "<p>Install an Amazon-trusted root certificate on the application instance and use SSL/TLS encrypted connections to the database.</p>", "<p>Create an IAM role with permission to access the database. Attach this IAM role to the EC2 instance.</p>"]}, "correct_response": ["d"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A developer created an application that uses Amazon EC2 and an Amazon RDS MySQL database instance. The developer stored the database user name and password in a configuration file on the root EBS volume of the EC2 application instance. A Solutions Architect has been asked to design a more secure solution.What should the Solutions Architect do to achieve this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 184764503, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A financial services company has a web application with an application tier running in the U.S and Europe. The database tier consists of a MySQL database running on Amazon EC2 in us-west-1. Users are directed to the closest application tier using Route 53 latency-based routing. The users in Europe have reported poor performance when running queries.</p><p>Which changes should a Solutions Architect make to the database tier to improve performance?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Aurora Global Database is designed for globally distributed applications, allowing a single Amazon Aurora database to span multiple AWS regions. It replicates your data with no impact on database performance, enables fast local reads with low latency in each region, and provides disaster recovery from region-wide outages.</p><p>A global database can be configured in the European region and then the application tier in Europe will need to be configured to use the local database for reads/queries. The diagram below depicts an Aurora Global Database deployment.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_10-40-32-e096373484158f919b4e661ab7c1aa8d.jpg\"></p><p><strong>CORRECT: </strong>\"Migrate the database to an Amazon Aurora global database in MySQL compatibility mode. Configure the application tier in Europe to use the local reader endpoint\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Migrate the database to Amazon RDS for MySQL. Configure Multi-AZ in one of the European Regions\" is incorrect. You cannot configure a multi-AZ DB instance to run in another Region, it must be in the same Region but in a different Availability Zone.</p><p><strong>INCORRECT:</strong> \"Migrate the database to Amazon RedShift. Use AWS DMS to synchronize data. Configure applications to use the RedShift data warehouse for queries\" is incorrect. RedShift is a data warehouse and used for running analytics queries on data that is exported from transactional database systems. It should not be used to reduce latency for users of a database, and is not a live copy of the data.</p><p><strong>INCORRECT:</strong> \"Create an Amazon RDS Read Replica in one of the European regions. Configure the application tier in Europe to use the read replica for queries\" is incorrect. You cannot create an RDS Read Replica of a database that is running on Amazon EC2. You can only create read replicas of databases running on Amazon RDS.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/rds/aurora/global-database/\">https://aws.amazon.com/rds/aurora/global-database/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Migrate the database to Amazon RDS for MySQL. Configure Multi-AZ in one of the European Regions.</p>", "<p>Migrate the database to an Amazon Aurora global database in MySQL compatibility mode. Configure the application tier in Europe to use the local reader endpoint.</p>", "<p>Migrate the database to Amazon RedShift. Use AWS DMS to synchronize data. Configure applications to use the RedShift data warehouse for queries.</p>", "<p>Create an Amazon RDS Read Replica in one of the European regions. Configure the application tier in Europe to use the read replica for queries.</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "A financial services company has a web application with an application tier running in the U.S and Europe. The database tier consists of a MySQL database running on Amazon EC2 in us-west-1. Users are directed to the closest application tier using Route 53 latency-based routing. The users in Europe have reported poor performance when running queries.Which changes should a Solutions Architect make to the database tier to improve performance?", "related_lectures": []}, {"_class": "assessment", "id": 184764505, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs an application that uses an Amazon RDS PostgreSQL database. The database is currently not encrypted. A Solutions Architect has been instructed that due to new compliance requirements all existing and new data in the database must be encrypted. The database experiences high volumes of changes and no data can be lost.</p><p>How can the Solutions Architect enable encryption for the database without incurring any data loss?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>You cannot change the encryption status of an existing RDS DB instance. Encryption must be specified when creating the RDS DB instance. The best way to encrypt an existing database is to take a snapshot, encrypt a copy of the snapshot and restore the snapshot to a new RDS DB instance. This results in an encrypted database that is a new instance. Applications must be updated to use the new RDS DB endpoint.</p><p>In this scenario as there is a high rate of change, the databases will be out of sync by the time the new copy is created and is functional. The best way to capture the changes between the source (unencrypted) and destination (encrypted) DB is to use AWS Database Migration Service (DMS) to synchronize the data.</p><p>The slide below depicts the process for encrypting an unencrypted RDS DB instance:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_10-43-00-2b10c6ed31c5f439b4d82b7c3dbf77e5.jpg\"></p><p><strong>CORRECT: </strong>\"Create a snapshot of the existing RDS DB instance. Create an encrypted copy of the snapshot. Create a new RDS DB instance from the encrypted snapshot and update the application. Use AWS DMS to synchronize data between the source and destination RDS DBs\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create a snapshot of the existing RDS DB instance. Create an encrypted copy of the snapshot. Create a new RDS DB instance from the encrypted snapshot. Configure the application to use the new DB endpoint\" is incorrect. This answer creates an encrypted DB instance but does not synchronize the data.</p><p><strong>INCORRECT:</strong> \"Create an RDS read replica and specify an encryption key. Promote the encrypted read replica to primary. Update the application to point to the new RDS DB endpoint\" is incorrect. You cannot create an encrypted read replica of an unencrypted RDS DB. The read replica will always have the same encryption status as the RDS DB it is created from.</p><p><strong>INCORRECT:</strong> \"Update the RDS DB to Multi-AZ mode and enable encryption for the standby replica. Perform a failover to the standby instance and then delete the unencrypted RDS DB instance\" is incorrect. You also cannot have an encrypted Multi-AZ standby instance of an unencrypted RDS DB.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/encrypt-an-existing-amazon-rds-for-postgresql-db-instance.html\">https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/encrypt-an-existing-amazon-rds-for-postgresql-db-instance.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-rds/\">https://digitalcloud.training/amazon-rds/</a></p>", "answers": ["<p>Create a snapshot of the existing RDS DB instance. Create an encrypted copy of the snapshot. Create a new RDS DB instance from the encrypted snapshot. Configure the application to use the new DB endpoint.</p>", "<p>Create an RDS read replica and specify an encryption key. Promote the encrypted read replica to primary. Update the application to point to the new RDS DB endpoint.</p>", "<p>Create a snapshot of the existing RDS DB instance. Create an encrypted copy of the snapshot. Create a new RDS DB instance from the encrypted snapshot and update the application. Use AWS DMS to synchronize data between the source and destination RDS DBs.</p>", "<p>Update the RDS DB to Multi-AZ mode and enable encryption for the standby replica. Perform a failover to the standby instance and then delete the unencrypted RDS DB instance.</p>"]}, "correct_response": ["c"], "section": "AWS Database", "question_plain": "A company runs an application that uses an Amazon RDS PostgreSQL database. The database is currently not encrypted. A Solutions Architect has been instructed that due to new compliance requirements all existing and new data in the database must be encrypted. The database experiences high volumes of changes and no data can be lost.How can the Solutions Architect enable encryption for the database without incurring any data loss?", "related_lectures": []}, {"_class": "assessment", "id": 184764507, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs an application in a factory that has a small rack of physical compute resources. The application stores data on a network attached storage (NAS) device using the NFS protocol. The company requires a daily offsite backup of the application data.</p><p>Which solution can a Solutions Architect recommend to meet this requirement?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The AWS Storage Gateway Hardware Appliance is a physical, standalone, validated server configuration for on-premises deployments. It comes pre-loaded with Storage Gateway software, and provides all the required CPU, memory, network, and SSD cache resources for creating and configuring File Gateway, Volume Gateway, or Tape Gateway.</p><p>A file gateway is the correct type of appliance to use for this use case as it is suitable for mounting via the NFS and SMB protocols.</p><p><strong>CORRECT: </strong>\"Use an AWS Storage Gateway file gateway hardware appliance on premises to replicate the data to Amazon S3\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use an AWS Storage Gateway volume gateway with stored volumes on premises to replicate the data to Amazon S3\" is incorrect. Volume gateways are used for block-based storage and this solution requires NFS (file-based storage).</p><p><strong>INCORRECT:</strong> \"Use an AWS Storage Gateway volume gateway with cached volumes on premises to replicate the data to Amazon S3\" is incorrect. Volume gateways are used for block-based storage and this solution requires NFS (file-based storage).</p><p><strong>INCORRECT:</strong> \"Create an IPSec VPN to AWS and configure the application to mount the Amazon EFS file system. Run a copy job to backup the data to EFS\" is incorrect. It would be better to use a Storage Gateway which will automatically take care of synchronizing a copy of the data to AWS.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/storagegateway/hardware-appliance/\">https://aws.amazon.com/storagegateway/hardware-appliance/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-storage-gateway/\">https://digitalcloud.training/aws-storage-gateway/</a></p>", "answers": ["<p>Use an AWS Storage Gateway file gateway hardware appliance on premises to replicate the data to Amazon S3.</p>", "<p>Use an AWS Storage Gateway volume gateway with stored volumes on premises to replicate the data to Amazon S3.</p>", "<p>Use an AWS Storage Gateway volume gateway with cached volumes on premises to replicate the data to Amazon S3.</p>", "<p>Create an IPSec VPN to AWS and configure the application to mount the Amazon EFS file system. Run a copy job to backup the data to EFS.</p>"]}, "correct_response": ["a"], "section": "AWS Storage", "question_plain": "A company runs an application in a factory that has a small rack of physical compute resources. The application stores data on a network attached storage (NAS) device using the NFS protocol. The company requires a daily offsite backup of the application data.Which solution can a Solutions Architect recommend to meet this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 184764509, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is deploying a fleet of Amazon EC2 instances running Linux across multiple Availability Zones within an AWS Region. The application requires a data storage solution that can be accessed by all of the EC2 instances simultaneously. The solution must be highly scalable and easy to implement. The storage must be mounted using the NFS protocol.</p><p>Which solution meets these requirements?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon EFS provides scalable file storage for use with Amazon EC2. You can use an EFS file system as a common data source for workloads and applications running on multiple instances. The EC2 instances can run in multiple AZs within a Region and the NFS protocol is used to mount the file system.</p><p>With EFS you can create mount targets in each AZ for lower latency. The application instances in each AZ will mount the file system using the local mount target.</p><p><strong>CORRECT: </strong>\"Create an Amazon EFS file system with mount targets in each Availability Zone. Configure the application instances to mount the file system\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon S3 bucket and create an S3 gateway endpoint to allow access to the file system using the NFS protocol\" is incorrect. You cannot use NFS with S3 or with gateway endpoints.</p><p><strong>INCORRECT:</strong> \"Create an Amazon EBS volume and use EBS Multi-Attach to mount the volume to all EC2 instances across each Availability Zone\" is incorrect. You cannot use Amazon EBS Multi-Attach across multiple AZs.</p><p><strong>INCORRECT:</strong> \"Create an Amazon RDS database and store the data in a BLOB format. Point the application instances to the RDS endpoint\" is incorrect. This is not a suitable storage solution for a file system that is mounted over NFS.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEFS.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEFS.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-efs/\">https://digitalcloud.training/amazon-efs/</a></p>", "answers": ["<p>Create an Amazon S3 bucket and create an S3 gateway endpoint to allow access to the file system using the NFS protocol.</p>", "<p>Create an Amazon EFS file system with mount targets in each Availability Zone. Configure the application instances to mount the file system.</p>", "<p>Create an Amazon EBS volume and use EBS Multi-Attach to mount the volume to all EC2 instances across each Availability Zone.</p>", "<p>Create an Amazon RDS database and store the data in a BLOB format. Point the application instances to the RDS endpoint.</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A company is deploying a fleet of Amazon EC2 instances running Linux across multiple Availability Zones within an AWS Region. The application requires a data storage solution that can be accessed by all of the EC2 instances simultaneously. The solution must be highly scalable and easy to implement. The storage must be mounted using the NFS protocol.Which solution meets these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764511, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is working with a strategic partner that has an application that must be able to send messages to one of the company\u2019s Amazon SQS queues. The partner company has its own AWS account.</p><p>How can a Solutions Architect provide least privilege access to the partner?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon SQS supports resource-based policies. The best way to grant the permissions using the principle of least privilege is to use a resource-based policy attached to the SQS queue that grants the partner company\u2019s AWS account the sqs:SendMessage privilege.</p><p>The following policy is an example of how this could be configured:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_10-46-16-3d75509bc08efb886557569410905bfe.jpg\"></p><p><strong>CORRECT: </strong>\"Update the permission policy on the SQS queue to grant the sqs:SendMessage permission to the partner\u2019s AWS account\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create a user account that and grant the sqs:SendMessage permission for Amazon SQS. Share the credentials with the partner company\" is incorrect. This would provide the permissions for all SQS queues, not just the queue the partner company should be able to access.</p><p><strong>INCORRECT:</strong> \"Create a cross-account role with access to all SQS queues and use the partner's AWS account in the trust document for the role\" is incorrect. This would provide access to all SQS queues and the partner company should only be able to access one SQS queue.</p><p><strong>INCORRECT:</strong> \"Update the permission policy on the SQS queue to grant all permissions to the partner\u2019s AWS account\" is incorrect. This provides too many permissions; the partner company only needs to send messages to the queue.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-basic-examples-of-sqs-policies.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-basic-examples-of-sqs-policies.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Create a user account and grant the sqs:SendMessage permission for Amazon SQS. Share the credentials with the partner company.</p>", "<p>Create a cross-account role with access to all SQS queues and use the partner's AWS account in the trust document for the role.</p>", "<p>Update the permission policy on the SQS queue to grant all permissions to the partner\u2019s AWS account.</p>", "<p>Update the permission policy on the SQS queue to grant the sqs:SendMessage permission to the partner\u2019s AWS account.</p>"]}, "correct_response": ["d"], "section": "AWS Application Integration", "question_plain": "A company is working with a strategic partner that has an application that must be able to send messages to one of the company\u2019s Amazon SQS queues. The partner company has its own AWS account.How can a Solutions Architect provide least privilege access to the partner?", "related_lectures": []}, {"_class": "assessment", "id": 184764513, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A surveying team is using a fleet of drones to collect images of construction sites. The surveying team's laptops lack the inbuilt storage and compute capacity to transfer the images and process the data. While the team has Amazon EC2 instances for processing and Amazon S3 buckets for storage, network connectivity is intermittent and unreliable. The images need to be processed to evaluate the progress of each construction site.</p><p>What should a solutions architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS physical Snowball Edge device will provide much more inbuilt compute and storage compared to the current team\u2019s laptops. This negates the need to rely on a stable connection to process any images and solves the team's problems easily and efficiently.</p><p><strong>CORRECT: </strong>\"Process and store the images using AWS Snowball Edge devices\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"During intermittent connectivity to EC2 instances, upload images to Amazon SQS\u201d is incorrect as you would still need a reliable internet connection to upload any images to Amazon SQS.</p><p><strong>INCORRECT:</strong> \"Configure Amazon Kinesis Data Firehose to create multiple delivery streams aimed separately at the S3 buckets for storage and the EC2 instances for processing the images\" is incorrect as you would still need a reliable internet connection to upload any images to the Amazon Kinesis Service.</p><p><strong>INCORRECT:</strong> \"Cache the images locally on a hardware appliance pre-installed with AWS Storage Gateway to process the images when connectivity is restored\u201d is incorrect as you would still need reliable internet connection to upload any images to the Amazon Storage Gateway service.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html\">https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Process and store the images using AWS Snowball Edge devices.</p>", "<p>During intermittent connectivity to EC2 instances, upload images to Amazon SQS.</p>", "<p>Configure Amazon Kinesis Data Firehose to create multiple delivery streams aimed separately at the S3 buckets for storage and the EC2 instances for processing the images.</p>", "<p>Cache the images locally on a hardware appliance pre-installed with AWS Storage Gateway to process the images when connectivity is restored.</p>"]}, "correct_response": ["a"], "section": "AWS Migration & Transfer", "question_plain": "A surveying team is using a fleet of drones to collect images of construction sites. The surveying team's laptops lack the inbuilt storage and compute capacity to transfer the images and process the data. While the team has Amazon EC2 instances for processing and Amazon S3 buckets for storage, network connectivity is intermittent and unreliable. The images need to be processed to evaluate the progress of each construction site.What should a solutions architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764515, "assessment_type": "multiple-choice", "prompt": {"question": "<p>There are two applications in a company: a sender application that sends messages containing payloads, and a processing application that receives messages containing payloads. The company wants to implement an AWS service to handle messages between these two different applications. The sender application sends on average 1,000 messages each hour and the messages depending on the type sometimes take up to 2 days to be processed. If the messages fail to process, they must be retained so that they do not impact the processing of any remaining messages.</p><p>Which solution meets these requirements and is the MOST operationally efficient?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Simple Queue Service (SQS) is a fully managed message queuing service that enables you to decouple and scale microservices, distributed systems, and serverless applications. SQS eliminates the complexity and overhead associated with managing and operating message-oriented middleware and empowers developers to focus on differentiating work.</p><p><strong>CORRECT: </strong>\"Provide an Amazon Simple Queue Service (Amazon SQS) queue for the sender and processor applications. Set up a dead-letter queue to collect failed messages\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Set up a Redis database on Amazon EC2. Configure the instance to be used by both applications. The messages should be stored, processed, and deleted, respectively\u201d is incorrect, as the most operationally efficient way is to use the managed service Amazon SQS.</p><p><strong>INCORRECT:</strong> \"Receive the messages from the sender application using an Amazon Kinesis data stream. Utilize the Kinesis Client Library (KCL) to integrate the processing application\u201d is incorrect, as the most operationally efficient way is to use the managed service Amazon SQS</p><p><strong>INCORRECT:</strong> \"Subscribe the processing application to an Amazon Simple Notification Service (Amazon SNS) topic to receive notifications. Write to the SNS topic using the sender application\u201d is incorrect as Amazon SNS is not a queuing service, but a pub-sub one to many notification service and cannot be used as a queue.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/sqs/\">https://aws.amazon.com/sqs/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Set up a Redis database on Amazon EC2. Configure the instance to be used by both applications. The messages should be stored, processed, and deleted, respectively.</p>", "<p>Receive the messages from the sender application using an Amazon Kinesis data stream. Utilize the Kinesis Client Library (KCL) to integrate the processing application.</p>", "<p>Provide an Amazon Simple Queue Service (Amazon SQS) queue for the sender and processor applications. Set up a dead-letter queue to collect failed messages.</p>", "<p>Subscribe the processing application to an Amazon Simple Notification Service (Amazon SNS) topic to receive notifications. Write to the SNS topic using the sender application.</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "There are two applications in a company: a sender application that sends messages containing payloads, and a processing application that receives messages containing payloads. The company wants to implement an AWS service to handle messages between these two different applications. The sender application sends on average 1,000 messages each hour and the messages depending on the type sometimes take up to 2 days to be processed. If the messages fail to process, they must be retained so that they do not impact the processing of any remaining messages.Which solution meets these requirements and is the MOST operationally efficient?", "related_lectures": []}, {"_class": "assessment", "id": 184764517, "assessment_type": "multi-select", "prompt": {"question": "<p>An Amazon S3 bucket in the us-east-1 Region hosts the static website content of a company. The content is made available through an Amazon CloudFront origin pointing to that bucket. A second copy of the bucket is created in the ap-southeast-1 Region using cross-region replication. The chief solutions architect wants a solution that provides greater availability for the website.</p><p>Which combination of actions should a solutions architect take to increase availability? (Select TWO.)</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>You can set up CloudFront with origin failover for scenarios that require high availability. To get started, you create an <em>origin group</em> with two origins: a primary and a secondary. If the primary origin is unavailable or returns specific HTTP response status codes that indicate a failure, CloudFront automatically switches to the secondary origin.</p><p><strong>CORRECT: </strong>\"Add an origin for ap-southeast-1 to CloudFront\u201d is the correct answer (as explained above.)</p><p><strong>CORRECT: </strong>\"Using us-east-1 bucket as the primary bucket and ap-southeast-1 bucket as the secondary bucket, create a CloudFront origin group\u201d is also a correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Create an origin for CloudFront for both buckets\u201d is incorrect. This would not increase the availability of the solution on its own.</p><p><strong>INCORRECT:</strong> \"Set up failover routing in Amazon Route 53\u201d is incorrect as we are trying to enable failover in CloudFront and using Route 53 is for routing domain names.</p><p><strong>INCORRECT:</strong> \"Create a record in Amazon Route 53 pointing to the replica bucket\" is incorrect as we are trying to enable failover in CloudFront and using Route 53 is for routing domain names.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudfront/\">https://digitalcloud.training/amazon-cloudfront/</a></p>", "answers": ["<p>Create an origin for CloudFront for both buckets.</p>", "<p>Set up failover routing in Amazon Route 53.</p>", "<p>Point Amazon Route 53 to the replica bucket by creating a record.</p>", "<p>Add an origin for ap-southeast-1 to CloudFront.</p>", "<p>Using us-east-1 bucket as the primary bucket and ap-southeast-1 bucket as the secondary bucket, create a CloudFront origin group.</p>"]}, "correct_response": ["d", "e"], "section": "AWS Networking & Content Delivery", "question_plain": "An Amazon S3 bucket in the us-east-1 Region hosts the static website content of a company. The content is made available through an Amazon CloudFront origin pointing to that bucket. A second copy of the bucket is created in the ap-southeast-1 Region using cross-region replication. The chief solutions architect wants a solution that provides greater availability for the website.Which combination of actions should a solutions architect take to increase availability? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 184764519, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company needs to connect its on-premises data center network to a new virtual private cloud (VPC). There is a symmetrical internet connection of 100 Mbps in the data center network. The data transfer rate for an on-premises application is multiple gigabytes per day. Processing will be done using an Amazon Kinesis Data Firehose stream.</p><p>What should a solutions architect recommend for maximum performance?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Explanation:</strong></p><p>Using AWS PrivateLink to create an interface endpoint will allow your traffic to traverse the AWS Global Backbone to allow maximum performance and security. Also by using an AWS Direct Connect cable you can ensure you have a dedicated cable to provide maximum performance and low latency to and from AWS.</p><p><strong>CORRECT: </strong>\"Kinesis Data Firehose can be connected to the VPC using AWS PrivateLink. Install a 1 Gbps AWS Direct Connect connection between the on-premises network and AWS. To send data from on-premises to Kinesis Data Firehose, use the PrivateLink endpoint\u201d is the correct answer (as explained above.)</p><p><strong>INCORRECT:</strong> \"Establish a peering connection between the on-premises network and the VPC. Configure routing for the on-premises network to use the VPC peering connection\u201d is incorrect also because VPC peering connections can only exist between two VPCs within the AWS Cloud.</p><p><strong>INCORRECT:</strong> \"Get an AWS Snowball Edge Storage Optimized device. Data must be copied to the device after several days and shipped to AWS for expedited transfer to Kinesis Data Firehose. Repeat as necessary\u201d is incorrect. AWS Snowball Edge is designed to be more of a one-time migration service which you physically receive from AWS, and then ship it into an AWS Region of your choice.</p><p><strong>INCORRECT:</strong> \"Establish an AWS Site-to-Site VPN connection between the on-premises network and the VPC. Set up BGP routing between the customer gateway and the virtual private gateway. Send data to Kinesis Data Firehose using a VPN connection\u201d is incorrect. This is a functional solution; however a physical connection would provide a much more reliable and performant solution.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/privatelink/\">https://aws.amazon.com/privatelink/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Establish a peering connection between the on-premises network and the VPC. Configure routing for the on-premises network to use the VPC peering connection.</p>", "<p>Get an AWS Snowball Edge Storage Optimized device. Data must be copied to the device after several days and shipped to AWS for expedited transfer to Kinesis Data Firehose. Repeat as necessary.</p>", "<p>Establish an AWS Site-to-Site VPN connection between the on-premises network and the VPC. Set up BGP routing between the customer gateway and the virtual private gateway. Send data to Kinesis Data Firehose using a VPN connection.</p>", "<p>Kinesis Data Firehose can be connected to the VPC using AWS PrivateLink. Install a 1 Gbps AWS Direct Connect connection between the on-premises network and AWS. To send data from on-premises to Kinesis Data Firehose, use the PrivateLink endpoint.</p>"]}, "correct_response": ["d"], "section": "AWS Networking & Content Delivery", "question_plain": "A company needs to connect its on-premises data center network to a new virtual private cloud (VPC). There is a symmetrical internet connection of 100 Mbps in the data center network. The data transfer rate for an on-premises application is multiple gigabytes per day. Processing will be done using an Amazon Kinesis Data Firehose stream.What should a solutions architect recommend for maximum performance?", "related_lectures": []}, {"_class": "assessment", "id": 184764521, "assessment_type": "multiple-choice", "prompt": {"question": "<p>The database tier of a web application is running on a Windows server on-premises. The database is a Microsoft SQL Server database. The application owner would like to migrate the database to an Amazon RDS instance.</p><p>How can the migration be executed with minimal administrative effort and downtime?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>You can directly migrate Microsoft SQL Server from an on-premises server into Amazon RDS using the Microsoft SQL Server database engine. This can be achieved using the native Microsoft SQL Server tools, or using AWS DMS as depicted below:</p><p><br></p><img src=\"https://img-c.udemycdn.com/redactor/raw/practice_test_question_explanation/2023-06-30_17-10-28-5ac42be5b303d82ec1ea4dceda72ef02.jpg\"><p><br></p><p><strong>CORRECT: </strong>\"Use the AWS Database Migration Service (DMS) to directly migrate the database to RDS\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use the AWS Server Migration Service (SMS) to migrate the server to Amazon EC2. Use AWS Database Migration Service (DMS) to migrate the database to RDS\" is incorrect. You do not need to use the AWS SMS service to migrate the server into EC2 first. You can directly migrate the database online with minimal downtime.</p><p><strong>INCORRECT:</strong> \"Use AWS DataSync to migrate the data from the database to Amazon S3. Use AWS Database Migration Service (DMS) to migrate the database to RDS\" is incorrect. AWS DataSync is used for migrating data, not databases.</p><p><strong>INCORRECT:</strong> \"Use the AWS Database Migration Service (DMS) to directly migrate the database to RDS. Use the Schema Conversion Tool (SCT) to enable conversion from Microsoft SQL Server to Amazon RDS\" is incorrect. You do not need to use the SCT as you are migrating into the same destination database engine (RDS is just the platform).</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/migrate-an-on-premises-microsoft-sql-server-database-to-amazon-rds-for-sql-server.html\">https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/migrate-an-on-premises-microsoft-sql-server-database-to-amazon-rds-for-sql-server.html</a></p><p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.html</a></p><p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.html</a></p><p><a href=\"https://aws.amazon.com/dms/schema-conversion-tool/\">https://aws.amazon.com/dms/schema-conversion-tool/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-migration-services/\">https://digitalcloud.training/aws-migration-services/</a></p>", "answers": ["<p>Use the AWS Server Migration Service (SMS) to migrate the server to Amazon EC2.Use AWS Database Migration Service (DMS) to migrate the database to RDS</p>", "<p>Use the AWS Database Migration Service (DMS) to directly migrate the database to RDS</p>", "<p>Use AWS DataSync to migrate the data from the database to Amazon S3. Use AWS Database Migration Service (DMS) to migrate the database to RDS</p>", "<p>Use the AWS Database Migration Service (DMS) to directly migrate the database to RDS. Use the Schema Conversion Tool (SCT) to enable conversion from Microsoft SQL Server to Amazon RDS</p>"]}, "correct_response": ["b"], "section": "AWS Migration & Transfer", "question_plain": "The database tier of a web application is running on a Windows server on-premises. The database is a Microsoft SQL Server database. The application owner would like to migrate the database to an Amazon RDS instance.How can the migration be executed with minimal administrative effort and downtime?", "related_lectures": []}, {"_class": "assessment", "id": 184764523, "assessment_type": "multi-select", "prompt": {"question": "<p>A company runs an application in a private subnet within a VPC. The application is integrated with Amazon Cognito using a user pool for user authentication. The company wants to enable users to securely upload and store their documents in an Amazon S3 bucket.</p><p>What combination of steps should the company take to securely integrate the application with Amazon S3? (Select TWO.)</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", "", ""], "explanation": "<p><strong>Configure an Amazon Cognito identity pool to provide temporary credentials for Amazon S3 when users authenticate through the user pool:</strong> This is correct because an Amazon Cognito identity pool is required to grant temporary AWS credentials for accessing S3 buckets. The user pool alone does not provide direct access to AWS resources, so the identity pool integrates with the user pool to securely grant users permissions to interact with S3.</p><p><strong>Enable Amazon S3 VPC endpoints in the VPC to ensure private connectivity between the application and the S3 bucket:</strong> This is correct because the application runs in a private subnet and needs secure connectivity to Amazon S3. A VPC endpoint ensures traffic remains within the AWS network, improving security and reducing reliance on internet gateways or NAT gateways.</p><p><strong>Add a bucket policy to deny requests that do not include valid Amazon Cognito credentials:</strong> This is incorrect because bucket policies can restrict access based on certain conditions, but integrating Amazon Cognito requires granting access through IAM roles tied to identity pools, not bucket policies.</p><p><strong>Assign IAM roles directly to the S3 bucket to allow user-level access:</strong> This is incorrect because IAM roles are assigned to entities like users or identity pools, not to resources like S3 buckets. The proper method involves attaching policies to the identity pool role to grant temporary credentials.</p><p><strong>Configure the application to generate Amazon S3 access tokens directly from the Cognito user pool:</strong> This is incorrect because user pools authenticate users but do not directly provide credentials for AWS services. An identity pool is required to bridge the authentication process with AWS resource access.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/identity-pools.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/identity-pools.html</a></p><p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cognito/\">https://digitalcloud.training/amazon-cognito/</a></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Configure an Amazon Cognito identity pool to provide temporary credentials for Amazon S3 when users authenticate through the user pool.</p>", "<p>Enable Amazon S3 VPC endpoints in the VPC to ensure private connectivity between the application and the S3 bucket.</p>", "<p>Add a bucket policy to deny requests that do not include valid Amazon Cognito credentials.</p>", "<p>Assign IAM roles directly to the S3 bucket to allow user-level access.</p>", "<p>Configure the application to generate Amazon S3 access tokens directly from the Cognito user pool.</p>"]}, "correct_response": ["a", "b"], "section": "AWS Security, Identity, & Compliance", "question_plain": "A company runs an application in a private subnet within a VPC. The application is integrated with Amazon Cognito using a user pool for user authentication. The company wants to enable users to securely upload and store their documents in an Amazon S3 bucket.What combination of steps should the company take to securely integrate the application with Amazon S3? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 184764525, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A media processing company is migrating its on-premises application to the AWS Cloud. The application processes high volumes of videos and generates large output files during the workflow.</p><p>The company requires a scalable solution to handle an increasing number of video processing jobs. The solution should minimize manual intervention, simplify job orchestration, and eliminate the need to manage infrastructure. Operational overhead must be kept to a minimum.</p><p>Which solution will fulfill these requirements with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use AWS Batch to run video processing jobs. Use AWS Step Functions to manage the workflow. Store the processed files in Amazon S3:</strong> This is correct because AWS Batch automatically manages the underlying infrastructure, scales based on workload and simplifies batch job management. Combining this with AWS Step Functions enables efficient orchestration of workflows. Storing the processed files in Amazon S3 provides durability and scalability, which is ideal for managing large files. This solution minimizes operational overhead by leveraging fully managed services.</p><p><strong>Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate to process the videos. Use Amazon Simple Queue Service (Amazon SQS) for workflow orchestration and store the processed file
