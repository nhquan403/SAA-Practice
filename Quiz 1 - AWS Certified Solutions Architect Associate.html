d replica and upgrade the primary instance to a larger instance size.</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "A company uses an Amazon RDS for MySQL instance for its operational database. To handle the increased read-only traffic during a recent peak period, the company added a read replica. During the peak period, the CPU usage on the read replica reached 60%, and the primary instance also had 60% CPU usage. After the peak period ended, the read replica's CPU usage decreased to 25%, while the primary instance consistently remains at 60%. The company wants to optimize costs while ensuring enough capacity for future growth.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764563, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company has developed a non-production application that is composed of multiple microservices for each of the company's business units. A single development team maintains all the microservices. The current architecture uses a static web frontend and a Java-based backend that contains the application logic. The architecture also uses a MySQL database that the company hosts on an Amazon EC2 instance. The company needs to ensure that the application is secure, scalable, and globally available while minimizing operational overhead.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use Amazon CloudFront and Amazon S3 to host the static web frontend. Refactor the backend to use AWS Lambda functions that are invoked by Amazon API Gateway. Migrate the database to Amazon Aurora Serverless for auto-scaling:</strong></p><p>This is correct because S3 and CloudFront provide secure, globally available hosting for the static frontend. AWS Lambda and API Gateway eliminate server management, and Aurora Serverless offers a cost-effective, auto-scaling database solution.</p><p><strong>Use AWS Amplify to host the static web frontend. Refactor the backend microservices to Amazon Elastic Kubernetes Service (Amazon EKS) with auto-scaling. Migrate the database to Amazon RDS for MySQL with a read replica for high availability:</strong></p><p>This is incorrect because using Amazon EKS adds operational complexity. Amplify is better suited for modern full-stack applications, not static web hosting.</p><p><strong>Use Amazon CloudFront and Amazon S3 to host the static web frontend. Refactor the backend microservices to run on Amazon ECS on AWS Fargate. Migrate the database to Amazon DynamoDB for auto-scaling and cost optimization:</strong></p><p>This is incorrect because moving a relational database to DynamoDB requires a complete redesign, which increases migration complexity and effort.</p><p><strong>Use Amazon CloudFront and AWS Amplify to host the static web frontend. Refactor the backend to AWS Lambda functions triggered by an EventBridge bus. Migrate the database to an Amazon EC2 Reserved Instance with backups configured on Amazon S3:</strong></p><p>This is incorrect because EventBridge adds unnecessary complexity to trigger Lambda functions. Hosting a database on an EC2 Reserved Instance increases operational overhead compared to managed database services.</p><p><strong>References:</strong></p><p><br></p><p><a href=\"https://aws.amazon.com/s3/\">https://aws.amazon.com/s3/</a></p><p><br></p><p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">https://aws.amazon.com/rds/aurora/serverless/</a></p>", "answers": ["<p>Use Amazon CloudFront and Amazon S3 to host the static web frontend. Refactor the backend to use AWS Lambda functions that are invoked by Amazon API Gateway. Migrate the database to Amazon Aurora Serverless for auto-scaling.</p>", "<p>Use AWS Amplify to host the static web frontend. Refactor the backend microservices to Amazon Elastic Kubernetes Service (Amazon EKS) with auto-scaling. Migrate the database to Amazon RDS for MySQL with a read replica for high availability.</p>", "<p>Use Amazon CloudFront and Amazon S3 to host the static web frontend. Refactor the backend microservices to run on Amazon ECS on AWS Fargate. Migrate the database to Amazon DynamoDB for auto-scaling and cost optimization.</p>", "<p>Use Amazon CloudFront and AWS Amplify to host the static web frontend. Refactor the backend to AWS Lambda functions triggered by an EventBridge bus. Migrate the database to an Amazon EC2 Reserved Instance with backups configured on Amazon S3.</p>"]}, "correct_response": ["a"], "section": "AWS Networking & Content Delivery", "question_plain": "A company has developed a non-production application that is composed of multiple microservices for each of the company's business units. A single development team maintains all the microservices. The current architecture uses a static web frontend and a Java-based backend that contains the application logic. The architecture also uses a MySQL database that the company hosts on an Amazon EC2 instance. The company needs to ensure that the application is secure, scalable, and globally available while minimizing operational overhead.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764565, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A fintech company is modernizing its payments processing system to adopt a serverless microservices architecture. The company wants to decouple its services and implement an event-driven architecture to support a publish/subscribe (pub/sub) model. The system needs to notify multiple downstream services when payment events occur, ensuring scalability and low operational overhead.</p><p>Which solution will meet these requirements MOST cost-effectively?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Configure an Amazon SNS topic to receive payment events from an AWS Lambda function. Set up multiple subscribers, such as Lambda functions, to process the events:</strong> This is correct because SNS is a fully managed pub/sub messaging service that supports high-throughput, scalable delivery to multiple subscribers, which aligns with the company's requirements.</p><p><strong>Configure an Amazon EventBridge rule to capture payment events and route them to multiple AWS Lambda functions that handle downstream processing:</strong> This is incorrect because EventBridge is more suited for complex event routing scenarios and not optimized for simple pub/sub use cases compared to SNS.</p><p><strong>Use Amazon Kinesis Data Firehose to deliver payment events to multiple S3 buckets. Configure downstream services to poll the buckets for event processing:</strong> This is incorrect because Kinesis Data Firehose is designed for streaming data delivery, not for pub/sub messaging. It adds unnecessary overhead for the described use case.</p><p><strong>Use Amazon MQ as a message broker to enable publish/subscribe communication between the payment microservices and the downstream services:</strong> This is incorrect because Amazon MQ is a managed message broker service that is typically used for legacy applications requiring protocols such as JMS or AMQP. It adds more operational complexity compared to SNS.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/sns/latest/dg/welcome.html\">https://docs.aws.amazon.com/sns/latest/dg/welcome.html</a><br><a href=\"https://docs.aws.amazon.com/eventbridge/latest/userguide/what-is-amazon-eventbridge.html\">https://docs.aws.amazon.com/eventbridge/latest/userguide/what-is-amazon-eventbridge.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Configure an Amazon EventBridge rule to capture payment events and route them to multiple AWS Lambda functions that handle downstream processing.</p>", "<p>Use Amazon Kinesis Data Firehose to deliver payment events to multiple S3 buckets. Configure downstream services to poll the buckets for event processing.</p>", "<p>Configure an Amazon SNS topic to receive payment events from an AWS Lambda function. Set up multiple subscribers, such as Lambda functions, to process the events.</p>", "<p>Use Amazon MQ as a message broker to enable publish/subscribe communication between the payment microservices and the downstream services.</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A fintech company is modernizing its payments processing system to adopt a serverless microservices architecture. The company wants to decouple its services and implement an event-driven architecture to support a publish/subscribe (pub/sub) model. The system needs to notify multiple downstream services when payment events occur, ensuring scalability and low operational overhead.Which solution will meet these requirements MOST cost-effectively?", "related_lectures": []}, {"_class": "assessment", "id": 184764567, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A retail company operates a multi-tier application that includes a web server layer running on Amazon EC2 instances and a database layer hosted on Amazon RDS. The company is preparing for an annual sales event and anticipates a significant surge in traffic to its application. The operations team wants to monitor the performance of the EC2 instances and database, analyzing metrics with a granularity of 1 minute to ensure quick detection of bottlenecks during the event.</p><p>What should the solutions architect do to meet this requirement?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Enable detailed monitoring on all EC2 instances and use Amazon CloudWatch metrics for analysis:</strong> This is the correct solution because detailed monitoring provides metrics at 1-minute intervals, which allows the operations team to quickly detect and analyze potential bottlenecks during the sales event. CloudWatch natively supports metrics for both EC2 and RDS.</p><p><strong>Configure Amazon CloudWatch Logs Insights to aggregate application logs for both the EC2 instances and Amazon RDS. Use Amazon QuickSight for detailed visualization:</strong> This is incorrect because while Logs Insights is useful for log analysis, it does not directly provide 1-minute metric granularity required for real-time monitoring.</p><p><strong>Configure an Amazon CloudWatch Events rule to trigger an AWS Lambda function that collects custom metrics from the EC2 instances and Amazon RDS. Use Amazon CloudWatch dashboards to display the metrics:</strong> This is incorrect because using CloudWatch detailed monitoring is a simpler and more efficient solution compared to creating custom metrics with Lambda.</p><p><strong>Use AWS Systems Manager to collect logs from the EC2 instances and Amazon RDS. Store the logs in Amazon S3 and use Amazon Athena to query performance data:</strong> This is incorrect because this solution is not suitable for real-time monitoring and involves unnecessary operational overhead.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-cloudwatch.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-cloudwatch.html</a><br><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-cloudwatch/\">https://digitalcloud.training/amazon-cloudwatch/</a></p>", "answers": ["<p>Enable detailed monitoring on all EC2 instances and use Amazon CloudWatch metrics for analysis.</p>", "<p>Configure Amazon CloudWatch Logs Insights to aggregate application logs for both the EC2 instances and Amazon RDS. Use Amazon QuickSight for detailed visualization.</p>", "<p>Configure an Amazon CloudWatch Events rule to trigger an AWS Lambda function that collects custom metrics from the EC2 instances and Amazon RDS. Use Amazon CloudWatch dashboards to display the metrics.</p>", "<p>Use AWS Systems Manager to collect logs from the EC2 instances and Amazon RDS. Store the logs in Amazon S3 and use Amazon Athena to query performance data.</p>"]}, "correct_response": ["a"], "section": "AWS Management & Governance", "question_plain": "A retail company operates a multi-tier application that includes a web server layer running on Amazon EC2 instances and a database layer hosted on Amazon RDS. The company is preparing for an annual sales event and anticipates a significant surge in traffic to its application. The operations team wants to monitor the performance of the EC2 instances and database, analyzing metrics with a granularity of 1 minute to ensure quick detection of bottlenecks during the event.What should the solutions architect do to meet this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 184764569, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is launching a new internal platform for managing multiple independent projects. Each project will require its own dedicated AWS account for isolation. The company needs a solution that automates account creation, applies mandatory security guardrails, and centrally manages shared networking resources such as VPNs and subnets for the accounts. The solution must minimize manual effort and ensure compliance with security standards.</p><p>Which solution will meet these requirements with the LEAST operational overhead?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Use AWS Control Tower to automate account provisioning. Create a dedicated networking account with a centralized VPC. Use AWS Resource Access Manager (AWS RAM) to share subnets with project accounts. Enforce security guardrails by using AWS Control Tower guardrails</strong>: This is correct because AWS Control Tower simplifies account setup with built-in security guardrails. It minimizes operational overhead by automating VPC sharing and guardrail enforcement through AWS RAM.<br><strong>Use AWS Organizations to create project accounts manually. Deploy a VPC in a centralized networking account. Use AWS RAM to share subnets. Manually configure security policies in each account</strong>: This is incorrect because manual account setup and security configuration increase operational overhead.<br><strong>Use AWS Control Tower to set up accounts with pre-configured VPCs in each project account. Connect these VPCs to a central networking account through a transit gateway. Enforce security controls with AWS Config</strong>: This is incorrect because configuring a transit gateway and enforcing controls through AWS Config introduces more complexity than required for this use case.<br><strong>Use AWS Organizations to create accounts for each project. Deploy a shared VPC in a centralized account. Configure AWS Firewall Manager to enforce security controls. Manually configure routing for project account traffic through the shared VPC</strong>: This is incorrect because it requires more manual effort to configure routing and lacks automation in account creation and security enforcement.</p><p><strong>References:</strong></p><p><br></p><p><a href=\"https://docs.aws.amazon.com/controltower/latest/userguide/\">https://docs.aws.amazon.com/controltower/latest/userguide/</a></p><p><br></p><p><a href=\"https://docs.aws.amazon.com/ram/latest/userguide/\">https://docs.aws.amazon.com/ram/latest/userguide/</a></p>", "answers": ["<p>Use AWS Control Tower to automate account provisioning. Create a dedicated networking account with a centralized VPC. Use AWS Resource Access Manager (AWS RAM) to share subnets with project accounts. Enforce security guardrails by using AWS Control Tower guardrails.</p>", "<p>Use AWS Organizations to create project accounts manually. Deploy a VPC in a centralized networking account. Use AWS RAM to share subnets. Manually configure security policies in each account.</p>", "<p>Use AWS Control Tower to set up accounts with pre-configured VPCs in each project account. Connect these VPCs to a central networking account through a transit gateway. Enforce security controls with AWS Config.</p>", "<p>Use AWS Organizations to create accounts for each project. Deploy a shared VPC in a centralized account. Configure AWS Firewall Manager to enforce security controls. Manually configure routing for project account traffic through the shared VPC.</p>"]}, "correct_response": ["a"], "section": "AWS Management & Governance", "question_plain": "A company is launching a new internal platform for managing multiple independent projects. Each project will require its own dedicated AWS account for isolation. The company needs a solution that automates account creation, applies mandatory security guardrails, and centrally manages shared networking resources such as VPNs and subnets for the accounts. The solution must minimize manual effort and ensure compliance with security standards.Which solution will meet these requirements with the LEAST operational overhead?", "related_lectures": []}, {"_class": "assessment", "id": 184764571, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs a critical data analysis job every Friday evening. The job processes large datasets and requires at least 2 hours to complete without interruptions. The job is stateful and needs reliable compute resources. The company wants to minimize operational overhead while ensuring the job runs as scheduled.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Configure the job as a containerized task and run it on AWS Fargate using Amazon ECS. Schedule the task using Amazon EventBridge Scheduler</strong>: This is the best option because AWS Fargate provides a serverless compute engine for containers, ensuring no interruptions. EventBridge Scheduler offers an easy way to schedule tasks without requiring manual intervention.</p><p><strong>Configure the job to run in an AWS Lambda function with reserved concurrency. Use Amazon EventBridge to invoke the function on a schedule</strong>: This is incorrect because Lambda functions are not suited for stateful, long-running jobs. Lambda has a maximum execution duration of 15 minutes.</p><p><strong>Deploy the job on a dedicated Amazon EC2 On-Demand instance. Use a cron job to schedule the analysis</strong>: While this solution avoids interruptions, it requires managing and maintaining the EC2 instance, which increases operational overhead.</p><p><strong>Use an Amazon EMR cluster with Spot Instances to process the job. Use Amazon EMR Step Functions to schedule the job execution</strong>: Spot Instances are not suitable for stateful jobs because they can be interrupted. This approach also introduces additional complexity with EMR setup and management.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/scheduling_tasks.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/scheduling_tasks.html</a><br><a href=\"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-run-lambda-schedule.html\">https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-run-lambda-schedule.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ecs-and-eks/\">https://digitalcloud.training/amazon-ecs-and-eks/</a></p>", "answers": ["<p>Configure the job as a containerized task and run it on AWS Fargate using Amazon ECS. Schedule the task using Amazon EventBridge Scheduler.</p>", "<p>Configure the job to run in an AWS Lambda function with reserved concurrency. Use Amazon EventBridge to invoke the function on a schedule.</p>", "<p>Deploy the job on a dedicated Amazon EC2 On-Demand instance. Use a cron job to schedule the analysis.</p>", "<p>Use an Amazon EMR cluster with Spot Instances to process the job. Use Amazon EMR Step Functions to schedule the job execution.</p>"]}, "correct_response": ["a"], "section": "AWS Compute", "question_plain": "A company runs a critical data analysis job every Friday evening. The job processes large datasets and requires at least 2 hours to complete without interruptions. The job is stateful and needs reliable compute resources. The company wants to minimize operational overhead while ensuring the job runs as scheduled.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764573, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is launching a new photo processing service that uses machine learning (ML) models to analyze and tag images. The service consists of independent microservices for different types of image processing tasks. Each ML model loads approximately 500 MB of data from Amazon S3 into memory at startup.<br>Users will submit images through a RESTful API, which can handle individual or batch requests. Traffic patterns are unpredictable, with peaks during marketing campaigns and minimal usage during off-hours. The company needs a scalable and cost-effective solution to manage this workload.</p><p>Which solution will meet these requirements?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Send the API requests to an Amazon Simple Queue Service (Amazon SQS) queue. Deploy the ML models as Amazon Elastic Container Service (Amazon ECS) services that read messages from the queue. Use auto scaling for ECS to adjust capacity based on queue length</strong>: This solution effectively decouples the API from the backend processing with SQS, ensuring scalability during peaks. ECS services handle the asynchronous nature of requests, and auto scaling adjusts resources based on queue traffic.</p><p><strong>Route the API requests to a Network Load Balancer (NLB). Deploy the ML models as Amazon Elastic Kubernetes Service (Amazon EKS) pods. Configure auto scaling based on CPU usage for EKS nodes</strong>: While scalable, this setup is more operationally complex and does not inherently manage batch processing or asynchronous workloads as well as SQS.</p><p><strong>Route the API requests to an Application Load Balancer (ALB). Deploy the ML models as AWS Lambda functions. Use provisioned concurrency to ensure Lambda functions remain warm for high-performance batch processing</strong>: AWS Lambda is not optimal for this use case due to its constraints on memory and runtime, particularly with large ML models and batch requests.</p><p><strong>Send the API requests to an Amazon EventBridge bus. Deploy the ML models as AWS Lambda functions that EventBridge invokes. Use auto scaling to increase memory and concurrency based on the size of the event payloads</strong>: EventBridge is not suitable for handling high-frequency batch image processing tasks. AWS Lambda\u2019s limitations also make it unsuitable for this scenario.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/ecs/latest/developerguide/what-is-ecs.html\">https://docs.aws.amazon.com/ecs/latest/developerguide/what-is-ecs.html</a><br><a href=\"https://docs.aws.amazon.com/sqs/latest/dg/welcome.html\">https://docs.aws.amazon.com/sqs/latest/dg/welcome.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-application-integration-services/\">https://digitalcloud.training/aws-application-integration-services/</a></p>", "answers": ["<p>Route the API requests to a Network Load Balancer (NLB). Deploy the ML models as Amazon Elastic Kubernetes Service (Amazon EKS) pods. Configure auto scaling based on CPU usage for EKS nodes.</p>", "<p>Route the API requests to an Application Load Balancer (ALB). Deploy the ML models as AWS Lambda functions. Use provisioned concurrency to ensure Lambda functions remain warm for high-performance batch processing.</p>", "<p>Send the API requests to an Amazon Simple Queue Service (Amazon SQS) queue. Deploy the ML models as Amazon Elastic Container Service (Amazon ECS) services that read messages from the queue. Use auto scaling for ECS to adjust capacity based on queue length.</p>", "<p>Send the API requests to an Amazon EventBridge bus. Deploy the ML models as AWS Lambda functions that EventBridge invokes. Use auto scaling to increase memory and concurrency based on the size of the event payloads.</p>"]}, "correct_response": ["c"], "section": "AWS Application Integration", "question_plain": "A company is launching a new photo processing service that uses machine learning (ML) models to analyze and tag images. The service consists of independent microservices for different types of image processing tasks. Each ML model loads approximately 500 MB of data from Amazon S3 into memory at startup.Users will submit images through a RESTful API, which can handle individual or batch requests. Traffic patterns are unpredictable, with peaks during marketing campaigns and minimal usage during off-hours. The company needs a scalable and cost-effective solution to manage this workload.Which solution will meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764575, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Amazon EC2 instances in an Auto Scaling group. The application stores temporary training data on attached Amazon Elastic Block Store (Amazon EBS) volumes. The company seeks recommendations to optimize costs for the EC2 instances, the Auto Scaling group, and the EBS volumes with minimal manual intervention.</p><p><strong>Which solution will meet these requirements with the MOST operational efficiency?</strong></p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p><strong>Configure AWS Compute Optimizer to provide cost optimization recommendations for the EC2 instances, the Auto Scaling group, and the EBS volumes</strong>: This is correct because AWS Compute Optimizer offers actionable insights for cost optimization across EC2 instances, Auto Scaling groups, and EBS volumes with minimal operational overhead.</p><p><strong>Set up Amazon CloudWatch billing alerts and manually analyze metrics to identify cost-saving opportunities for the EC2 instances, the Auto Scaling group, and the EBS volumes</strong>: This option requires significant manual intervention, which reduces operational efficiency.</p><p><strong>Use AWS Cost and Usage Reports to export data to Amazon Athena. Query the data to identify inefficiencies in the EC2 instances, the Auto Scaling group, and the EBS volumes</strong>: While this approach provides insights, it requires significant manual effort to analyze the data.</p><p><strong>Use AWS Compute Optimizer for recommendations on EC2 instances and Auto Scaling groups. Use Amazon Data Lifecycle Manager to evaluate cost optimizations for the EBS volumes</strong>: This requires separate configurations for different resources, increasing complexity compared to a single AWS Compute Optimizer setup.</p><p><strong>References:</strong><br><a href=\"https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is.html\">https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is.html</a><br><a href=\"https://docs.aws.amazon.com/AmazonEBS/latest/dg/ebs-automatic-snapshot-policy.html\">https://docs.aws.amazon.com/AmazonEBS/latest/dg/ebs-automatic-snapshot-policy.html</a></p>", "answers": ["<p>Configure AWS Compute Optimizer to provide cost optimization recommendations for the EC2 instances, the Auto Scaling group, and the EBS volumes.</p>", "<p>Set up Amazon CloudWatch billing alerts and manually analyze metrics to identify cost-saving opportunities for the EC2 instances, the Auto Scaling group, and the EBS volumes.</p>", "<p>Use AWS Cost and Usage Reports to export data to Amazon Athena. Query the data to identify inefficiencies in the EC2 instances, the Auto Scaling group, and the EBS volumes.</p>", "<p>Use AWS Compute Optimizer for recommendations on EC2 instances and Auto Scaling groups. Use Amazon Data Lifecycle Manager to evaluate cost optimizations for the EBS volumes.</p>"]}, "correct_response": ["a"], "section": "AWS Compute", "question_plain": "Amazon EC2 instances in an Auto Scaling group. The application stores temporary training data on attached Amazon Elastic Block Store (Amazon EBS) volumes. The company seeks recommendations to optimize costs for the EC2 instances, the Auto Scaling group, and the EBS volumes with minimal manual intervention.Which solution will meet these requirements with the MOST operational efficiency?", "related_lectures": []}]};
        let correct = new Set();
        let incorrect = new Set();
        const explanationMap = {};
        let totalNumberOfQuestions = 0;
        const quizTitle = quizData.quiz_title;
        const quizDescription = quizData.quiz_description;
        const questionData = quizData.questions;
        const passPercent = quizData.pass_percent;
        const modalTextElement = document.getElementById("modal-text");
        const quizContainerElement = document.getElementById("quiz-container");
        const dialog = document.querySelector("dialog");
        const quizTitleElement = document.getElementById("quiz-title");
        const quizDescriptionElement = document.getElementById("quiz-description");

        function main() {
            document.title = quizTitle || "Quiz";
            quizTitleElement.innerHTML = quizTitle || "Quiz";
            quizDescriptionElement.innerHTML = quizDescription || "";
            document.getElementById("pass-percent").innerHTML = passPercent || "0";
            totalNumberOfQuestions = questionData.length;

            // Shuffle questions
            for (let i = questionData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
            }

            questionData.map(formatSingleQuestionData).forEach((q, idx) => {
                renderSingleQuestion(q, idx + 1);
            });
            updateScore();
        }

        function formatSingleQuestionData(singleQuizData) {
            const { prompt, correct_response, id } = singleQuizData;
            const answers = (prompt && prompt.answers) || [];
            const feedbacks = (prompt && prompt.feedbacks) || [];
            // Guard: correct_response might be empty or missing
            const safeCorrectResponse = Array.isArray(correct_response) && correct_response.length > 0
                ? correct_response : ["a"]; // fallback to first answer
            // Support multi-answer: correct_response is an array like ["a"] or ["a","c","d","f"]
            const isMultiAnswer = safeCorrectResponse.length > 1;
            const correctAnswerIndices = safeCorrectResponse.map(letter => {
                if (typeof letter === 'string' && letter.match(/^[a-zA-Z]$/)) {
                    return letter.toLowerCase().charCodeAt(0) - 97;
                }
                return 0; // fallback for non-letter responses
            }).filter(idx => idx >= 0 && idx < answers.length); // filter out invalid indices
            const correctAnswerIndex = correctAnswerIndices.length > 0 ? correctAnswerIndices[0] : 0;
            
            // Keep instructor-provided explanation as-is. Per-option feedbacks are rebuilt
            // AFTER answer shuffle so Option A/B/C letters match the on-screen order.
            const explanation = (prompt && prompt.explanation) || "";

            // Guard: question text might be null/undefined
            const question = (prompt && prompt.question) || "<em>(No question text available)</em>";

            return {
                id,
                question,
                answers,
                feedbacks,
                correctAnswerIndex,
                correctAnswerIndices: correctAnswerIndices.length > 0 ? correctAnswerIndices : [0],
                isMultiAnswer,
                explanation,
            };
        }

        const renderSingleQuestion = (data, num) => {
            const { id, answers, feedbacks, correctAnswerIndex, correctAnswerIndices, isMultiAnswer, question } = data;
            let { explanation } = data;
            // Skip questions with no answer options (unsupported types like fill-in-the-blank)
            if (!answers || answers.length === 0) {
                console.warn(`Question ${id} has no answers, skipping render`);
                totalNumberOfQuestions--; // don't count it
                return;
            }
            // Shuffle answers — track where correct answer ends up
            // Create index array and shuffle that
            const indexedAnswers = answers.map((text, origIdx) => ({ text, origIdx }));
            for (let i = indexedAnswers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indexedAnswers[i], indexedAnswers[j]] = [indexedAnswers[j], indexedAnswers[i]];
            }

            // Find shuffled positions of correct answers
            const shuffledCorrectIndices = correctAnswerIndices.map(ci => indexedAnswers.findIndex(a => a.origIdx === ci));
            const shuffledCorrectIndex = shuffledCorrectIndices[0]; // single-answer compat

            // Build Option A/B/C explanation from feedbacks in DISPLAY order (after shuffle),
            // not original Udemy order — otherwise "Option A" no longer matches the first choice.
            if (!explanation && Array.isArray(feedbacks) && feedbacks.length > 0) {
                const optionLetters = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
                explanation = indexedAnswers.map((item, displayIdx) => {
                    const fb = feedbacks[item.origIdx];
                    if (!fb || typeof fb !== "string" || !fb.trim()) return "";
                    const letter = optionLetters[displayIdx] || String(displayIdx + 1);
                    const isCorrect = correctAnswerIndices.includes(item.origIdx);
                    const correctTag = isCorrect ? " (Correct Answer)" : "";
                    const textColor = isCorrect ? "var(--success)" : "var(--text-secondary)";
                    const borderColor = isCorrect ? "var(--success)" : "var(--border)";
                    return `
                        <div style="margin-bottom: 16px; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.02); border-left: 3px solid ${borderColor};">
                            <strong style="color: ${textColor}; font-size: 13px; text-transform: uppercase;">Option ${letter}${correctTag}:</strong>
                            <div style="margin-top: 4px; color: var(--text-muted); font-size: 13px; line-height: 1.5;">${item.text}</div>
                            <div style="margin-top: 4px; color: var(--text-primary); font-size: 14px; line-height: 1.6;">${fb}</div>
                        </div>`;
                }).filter(Boolean).join("");
            }

            const inputType = isMultiAnswer ? 'checkbox' : 'radio';
            const optionsHTML = indexedAnswers.map((item, i) => {
                const oid = `${id}_${i}`;
                return `
                        <div class="question-lable">
                            <input type="${inputType}" id="${oid}" name="answer" value="${i}" />
                            <label for="${oid}">${item.text}</label>
                        </div>`;
            }).join("");

            const multiHint = isMultiAnswer ? `<span class="multi-answer-hint">select ${correctAnswerIndices.length}</span>` : '';

            if (explanation) explanationMap[id] = explanation;
            const container = document.createElement("div");
            container.innerHTML = `
                    <form data-correct-answer="${shuffledCorrectIndex}" data-correct-answers="${shuffledCorrectIndices.join(',')}" data-is-multi="${isMultiAnswer}" data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
                        <div class="question-header">
                            <span class="question-number">Question ${num} ${multiHint}</span>
                            ${explanation ? `<button type="button" onclick="renderExplanation('${id}')" class="explanation-btn">💡 Explanation</button>` : ''}
                        </div>
                        <div class="question-text">${question}</div>
                        <div class="options-container">${optionsHTML}</div>
                        <div style="display:flex;gap:8px;">
                            <button type="submit" class="button">Submit Answer</button>
                        </div>
                    </form>`;
            quizContainerElement.appendChild(container);
        };

        function updateScore() {
            document.getElementById("correct-answers").innerHTML = correct.size;
            document.getElementById("wrong-answers").innerHTML = incorrect.size;
            const score = totalNumberOfQuestions > 0
                ? Number((correct.size / totalNumberOfQuestions) * 100).toFixed(1)
                : 0;
            document.getElementById("current-score").innerHTML = score;
        }

        const submitButtonListener = (e) => {
            e.preventDefault();
            const form = e.target;
            const isMulti = form.dataset.isMulti === 'true';
            const questionId = form.dataset.questionId;

            if (isMulti) {
                // Multi-answer: checkboxes
                const checkedInputs = form.querySelectorAll('input[type="checkbox"]:checked');
                if (checkedInputs.length === 0) { alert("Please select at least one answer!"); return; }

                const correctAnswersSet = new Set(form.dataset.correctAnswers.split(','));
                const userAnswers = new Set(Array.from(checkedInputs).map(inp => inp.value));

                // Correct if user selected exactly the right set
                const isCorrect = correctAnswersSet.size === userAnswers.size &&
                    [...correctAnswersSet].every(v => userAnswers.has(v));

                if (isCorrect) {
                    correct.add(questionId);
                    incorrect.delete(questionId);
                } else {
                    incorrect.add(questionId);
                    correct.delete(questionId);
                }
                updateScore();

                // Clear previous states
                form.querySelectorAll(".question-lable").forEach(el => {
                    el.classList.remove("correct-answer", "incorrect-answer");
                });

                // Highlight user selections
                checkedInputs.forEach(inp => {
                    const isThisCorrect = correctAnswersSet.has(inp.value);
                    inp.closest(".question-lable").classList.add(isThisCorrect ? "correct-answer" : "incorrect-answer");
                });

                // Highlight missed correct answers
                form.querySelectorAll('input[type="checkbox"]').forEach(input => {
                    if (correctAnswersSet.has(input.value) && !userAnswers.has(input.value)) {
                        input.closest(".question-lable").classList.add("correct-answer");
                    }
                });
            } else {
                // Single-answer: radio buttons
                const selected = form.querySelector('input[type="radio"]:checked');
                if (!selected) { alert("Please select an answer!"); return; }

                const userAnswer = selected.value;
                const correctAnswer = form.dataset.correctAnswer;
                const isCorrect = userAnswer === correctAnswer;

                if (isCorrect) {
                    correct.add(questionId);
                    incorrect.delete(questionId);
                } else {
                    incorrect.add(questionId);
                    correct.delete(questionId);
                }
                updateScore();

                // Clear previous states
                form.querySelectorAll(".question-lable").forEach(el => {
                    el.classList.remove("correct-answer", "incorrect-answer");
                });
                selected.closest(".question-lable").classList.add(isCorrect ? "correct-answer" : "incorrect-answer");

                // Also highlight the correct answer if wrong
                if (!isCorrect) {
                    form.querySelectorAll('input[type="radio"]').forEach(input => {
                        if (input.value === correctAnswer) {
                            input.closest(".question-lable").classList.add("correct-answer");
                        }
                    });
                }
            }
        };

        function renderExplanation(questionId) {
            modalTextElement.innerHTML = explanationMap[questionId] || "No explanation available.";
            dialog.showModal();
            dialog.addEventListener("click", (event) => {
                if (event.target === dialog) dialog.close();
            }, { once: true });
        }
    </script>
</body>
