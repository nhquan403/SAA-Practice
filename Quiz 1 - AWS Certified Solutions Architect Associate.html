<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a25;
            --bg-input: #1e1e2a;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #e8e8ed;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-light: #818cf8;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --success-border: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-border: rgba(239, 68, 68, 0.3);
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --max-width: 820px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        /* ── Score Bar ── */
        #score-stats-container {
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0 24px;
        }

        #score-stats-container>div {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #score-stats-container span {
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        #current-score {
            color: var(--accent-light);
        }

        #correct-answers {
            color: var(--success);
        }

        #wrong-answers {
            color: var(--danger);
        }

        /* ── Quiz Meta ── */
        #quiz-meta-container {
            text-align: center;
            margin-bottom: 32px;
            padding: 32px 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.06), rgba(168, 85, 247, 0.04));
            border: 1px solid var(--border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        #quiz-meta-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        #quiz-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e8e8ed, #a5a5ba);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #quiz-description {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Quiz Container ── */
        #quiz-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Question Card ── */
        .single-question-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color var(--transition);
            overflow: hidden;
        }

        .single-question-container:hover {
            border-color: var(--border-hover);
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .question-number {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-light);
        }

        .question-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .question-text p {
            margin: 4px 0;
        }

        /* Images inside questions (Udemy embeds screenshots in prompt HTML) */
        .question-text img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            margin: 12px 0;
            display: block;
            border: 1px solid var(--border);
        }

        /* Also constrain images in option labels */
        .question-lable img,
        .question-lable label img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            vertical-align: middle;
        }

        
        /* -- Inline Code and Pre blocks -- */
        code {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
            margin: 8px 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        /* ── Options ── */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-lable {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-input);
            transition: all var(--transition);
        }

        .question-lable:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .question-lable label {
            cursor: pointer;
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* Normalize p tags inside labels (Udemy wraps answers in <p>) */
        .question-lable label p {
            margin: 0;
            display: inline;
        }

        /* Custom Radio */
        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        input[type="radio"]:checked {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 3px var(--bg-input);
        }

        input[type="radio"]:hover {
            border-color: var(--accent-light);
        }

        /* Custom Checkbox (multi-answer) */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        input[type="checkbox"]:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        input[type="checkbox"]:hover {
            border-color: var(--accent-light);
        }

        /* Multi-answer hint badge */
        .multi-answer-hint {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* ── Answer States ── */
        .correct-answer .question-lable,
        .correct-answer.question-lable {
            border-color: var(--success-border) !important;
            background: var(--success-bg) !important;
        }

        .correct-answer input[type="radio"],
        .correct-answer input[type="checkbox"] {
            border-color: var(--success) !important;
            background: var(--success) !important;
            box-shadow: inset 0 0 0 3px var(--success-bg) !important;
        }

        .incorrect-answer .question-lable,
        .incorrect-answer.question-lable {
            border-color: var(--danger-border) !important;
            background: var(--danger-bg) !important;
        }

        .incorrect-answer input[type="radio"],
        .incorrect-answer input[type="checkbox"] {
            border-color: var(--danger) !important;
            background: var(--danger) !important;
            box-shadow: inset 0 0 0 3px var(--danger-bg) !important;
        }

        /* ── Buttons ── */
        button {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .button {
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            flex-grow: 1;
            transition: all var(--transition);
            letter-spacing: 0.01em;
        }

        .button:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .button:active {
            transform: translateY(0);
        }

        .explanation-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all var(--transition);
        }

        .explanation-btn:hover {
            color: var(--accent-light);
            background: var(--accent-glow);
        }

        /* ── Modal ── */
        dialog {
            position: fixed;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 0;
            border-radius: 16px;
            width: min(90vw, 640px);
            max-height: 80vh;
            overflow: hidden;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        #modal-content {
            padding: 28px;
            line-height: 1.7;
            font-size: 14px;
            overflow-y: auto;
            max-height: 80vh;
        }

        #modal-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
        }

        #modal-content p {
            color: var(--text-secondary);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--transition);
        }

        .modal-close:hover {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            main {
                padding: 68px 16px 24px;
            }

            .single-question-container {
                padding: 20px;
                border-radius: var(--radius-sm);
            }

            #quiz-meta-container {
                padding: 24px 16px;
                border-radius: var(--radius-sm);
            }

            #quiz-title {
                font-size: 20px;
            }

            #score-stats-container {
                gap: 16px;
                font-size: 12px;
                height: 46px;
                padding: 0 12px;
            }

            .question-lable {
                padding: 10px 12px;
            }

            .question-text {
                font-size: 14px;
            }

            .question-lable label {
                font-size: 13px;
            }

            .question-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            pre {
                font-size: 12px;
                padding: 10px 12px;
            }

            dialog {
                width: min(95vw, 640px);
                max-height: 85vh;
            }

            #modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 420px) {
            main {
                padding: 60px 8px 16px;
            }

            .single-question-container {
                padding: 14px;
                gap: 12px;
            }

            #quiz-meta-container {
                padding: 18px 12px;
                margin-bottom: 20px;
            }

            #quiz-title {
                font-size: 18px;
            }

            #score-stats-container {
                gap: 10px;
                font-size: 11px;
                height: 40px;
            }

            .question-number {
                font-size: 11px;
            }

            .multi-answer-hint {
                font-size: 10px;
                padding: 1px 6px;
            }

            .question-text {
                font-size: 13px;
                line-height: 1.6;
            }

            .question-lable {
                padding: 10px;
                gap: 10px;
            }

            .question-lable label {
                font-size: 12.5px;
            }

            input[type="radio"],
            input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }

            .button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .explanation-btn {
                font-size: 12px;
            }

            pre {
                font-size: 11px;
                padding: 8px 10px;
            }

            dialog {
                width: 98vw;
                border-radius: 12px;
            }

            #modal-content {
                padding: 16px;
                font-size: 13px;
            }

            .modal-close {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
        }

        /* ── Site Footer ── */
        .site-footer {
            text-align: center;
            margin-top: 48px;
            padding: 20px 24px;
            position: relative;
            font-size: 13px;
            color: var(--text-muted);
        }

        .site-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .site-footer a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .site-footer a:hover {
            color: #fff;
            background: rgba(99, 102, 241, 0.15);
        }

        @media print {
            #score-stats-container {
                display: none;
            }

            body {
                background: #fff;
                color: #000;
            }

            .single-question-container {
                border: 1px solid #ddd;
            }

            .question-lable {
                border: 1px solid #ddd;
                background: #f9f9f9;
            }

            input[type="radio"],
            input[type="checkbox"] {
                border-color: #999;
            }

            .site-footer {
                color: #999;
            }

            .site-footer a {
                color: #6366f1;
            }

            .site-footer::before {
                background: #ddd;
            }
        }
    </style>
</head>

    <script>
        const quizData = {"quiz_id": 4493504, "quiz_description": "<p>We recommend that you retake these practice exams until you consistently <strong>score 80%</strong> or higher.</p><p>To access your<strong> free bonus learning material</strong>, visit <a href=\"https://digitalcloud.training/aws-solutions-architect-associate-resources\" rel=\"noopener noreferrer\" target=\"_blank\">https://digitalcloud.training/aws-solutions-architect-associate-resources</a></p><p><strong>REVIEWS really matter </strong>- We'd be thrilled if you could leave us a rating. Simply navigate to your course and click \"<strong>Leave a rating</strong>\" in the top right of the console.</p><p>If you have any questions or concerns, please reach out using the <strong>Q&amp;A forum</strong> or visit <a href=\"https://digitalcloud.training/aws-courses-faq\" rel=\"noopener noreferrer\" target=\"_blank\">https://digitalcloud.training/aws-courses-faq</a> to find answers to the most frequently asked questions. Please note that direct messages (on Udemy or social media) aren't monitored.</p>", "quiz_title": "AWS Certified Solutions Architect Associate", "pass_percent": 72, "questions": [{"_class": "assessment", "id": 184764447, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A new application is to be published in multiple regions around the world. The Architect needs to ensure only 2 IP addresses need to be whitelisted. The solution should intelligently route traffic for lowest latency and provide fast regional failover.</p><p>How can this be achieved?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>AWS Global Accelerator uses the vast, congestion-free AWS global network to route TCP and UDP traffic to a healthy application endpoint in the closest AWS Region to the user.</p><p>This means it will intelligently route traffic to the closest point of presence (reducing latency). Seamless failover is ensured as AWS Global Accelerator uses anycast IP address which means the IP does not change when failing over between regions so there are no issues with client caches having incorrect entries that need to expire.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_00-46-55-314c6149f4e1a3552921ab6fa213d8d8.jpg\"></p><p>This is the only solution that provides deterministic failover.</p><p><strong>CORRECT: </strong>\"Launch EC2 instances into multiple regions behind an NLB and use AWS Global Accelerator\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Launch EC2 instances into multiple regions behind an NLB with a static IP address\" is incorrect. An NLB with a static IP is a workable solution as you could configure a primary and secondary address in applications. However, this solution does not intelligently route traffic for lowest latency.</p><p><strong>INCORRECT:</strong> \"Launch EC2 instances into multiple regions behind an ALB and use a Route 53 failover routing policy\" is incorrect. A Route 53 failover routing policy uses a primary and standby configuration. Therefore, it sends all traffic to the primary until it fails a health check at which time it sends traffic to the secondary. This solution does not intelligently route traffic for lowest latency.</p><p><strong>INCORRECT:</strong> \"Launch EC2 instances into multiple regions behind an ALB and use Amazon CloudFront with a pair of static IP addresses\" is incorrect. Amazon CloudFront cannot be configured with \u201ca pair of static IP addresses\u201d.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/global-accelerator/\">https://aws.amazon.com/global-accelerator/</a></p><p><a href=\"https://aws.amazon.com/global-accelerator/faqs/\">https://aws.amazon.com/global-accelerator/faqs/</a></p><p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-global-accelerator/\">https://digitalcloud.training/aws-global-accelerator/</a></p>", "answers": ["<p>Launch EC2 instances into multiple regions behind an NLB with a static IP address</p>", "<p>Launch EC2 instances into multiple regions behind an ALB and use a Route 53 failover routing policy</p>", "<p>Launch EC2 instances into multiple regions behind an NLB and use AWS Global Accelerator</p>", "<p>Launch EC2 instances into multiple regions behind an ALB and use Amazon CloudFront with a pair of static IP addresses</p>"]}, "correct_response": ["c"], "section": "AWS Networking & Content Delivery", "question_plain": "A new application is to be published in multiple regions around the world. The Architect needs to ensure only 2 IP addresses need to be whitelisted. The solution should intelligently route traffic for lowest latency and provide fast regional failover.How can this be achieved?", "related_lectures": []}, {"_class": "assessment", "id": 184764449, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An AWS Organization has an OU with multiple member accounts in it. The company needs to restrict the ability to launch only specific Amazon EC2 instance types. How can this policy be applied across the accounts with the least effort?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>To apply the restrictions across multiple member accounts you must use a Service Control Policy (SCP) in the AWS Organization. The way you would do this is to create a deny rule that applies to anything that does not equal the specific instance type you want to allow.</p><p>The following architecture could be used to achieve this goal:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_00-48-06-e73551726ea3baf15e8e687947948cba.jpg\"></p><p><strong>CORRECT: </strong>\"Create an SCP with a deny rule that denies all but the specific instance types\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an SCP with an allow rule that allows launching the specific instance types\" is incorrect as a deny rule is required.</p><p><strong>INCORRECT:</strong> \"Create an IAM policy to deny launching all but the specific instance types\" is incorrect. With IAM you need to apply the policy within each account rather than centrally so this would require much more effort.</p><p><strong>INCORRECT:</strong> \"Use AWS Resource Access Manager to control which launch types can be used\" is incorrect. AWS Resource Access Manager (RAM) is a service that enables you to easily and securely share AWS resources with any AWS account or within your AWS Organization. It is not used for restricting access or permissions.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_example-scps.html#example-ec2-instances\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_example-scps.html#example-ec2-instances</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-organizations/\">https://digitalcloud.training/aws-organizations/</a></p>", "answers": ["<p>Create an SCP with an allow rule that allows launching the specific instance types</p>", "<p>Create an SCP with a deny rule that denies all but the specific instance types</p>", "<p>Create an IAM policy to deny launching all but the specific instance types</p>", "<p>Use AWS Resource Access Manager to control which launch types can be used</p>"]}, "correct_response": ["b"], "section": "AWS Management & Governance", "question_plain": "An AWS Organization has an OU with multiple member accounts in it. The company needs to restrict the ability to launch only specific Amazon EC2 instance types. How can this policy be applied across the accounts with the least effort?", "related_lectures": []}, {"_class": "assessment", "id": 184764451, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An application is being created that will use Amazon EC2 instances to generate and store data. Another set of EC2 instances will then analyze and modify the data. Storage requirements will be significant and will continue to grow over time. The application architects require a storage solution.</p><p>Which actions would meet these needs?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Elastic File System (Amazon EFS) provides a simple, scalable, fully managed elastic NFS file system for use with AWS Cloud services and on-premises resources. It is built to scale on-demand to petabytes without disrupting applications, growing and shrinking automatically as you add and remove files, eliminating the need to provision and manage capacity to accommodate growth.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_00-51-10-5bfba0da41e8553b6b332f2566f0f56e.jpg\"></p><p>Amazon EFS supports the Network File System version 4 (NFSv4.1 and NFSv4.0) protocol. Multiple Amazon EC2 instances can access an Amazon EFS file system at the same time, providing a common data source for workloads and applications running on more than one instance or server.</p><p>For this scenario, EFS is a great choice as it will provide a scalable file system that can be mounted by multiple EC2 instances and accessed simultaneously.</p><p><strong>CORRECT: </strong>\"Store the data in an Amazon EFS filesystem. Mount the file system on the application instances\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Store the data in an Amazon EBS volume. Mount the EBS volume on the application instances\" is incorrect. Though there is a new feature that allows (EBS multi-attach) that allows attaching multiple Nitro instances to a volume, this is not on the exam yet, and has some specific constraints.</p><p><strong>INCORRECT:</strong> \"Store the data in Amazon S3 Glacier. Update the vault policy to allow access to the application instances\" is incorrect as S3 Glacier is not a suitable storage location for live access to data, it is used for archival.</p><p><strong>INCORRECT:</strong> \"Store the data in AWS Storage Gateway. Setup AWS Direct Connect between the Gateway appliance and the EC2 instances\" is incorrect. There is no reason to store the data on-premises in a Storage Gateway, using EFS is a much better solution.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html\">https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-efs/\">https://digitalcloud.training/amazon-efs/</a></p>", "answers": ["<p>Store the data in an Amazon EBS volume. Mount the EBS volume on the application instances</p>", "<p>Store the data in an Amazon EFS filesystem. Mount the file system on the application instances</p>", "<p>Store the data in Amazon S3 Glacier. Update the vault policy to allow access to the application instances</p>", "<p>Store the data in AWS Storage Gateway. Setup AWS Direct Connect between the Gateway appliance and the EC2 instances</p>"]}, "correct_response": ["b"], "section": "AWS Database", "question_plain": "An application is being created that will use Amazon EC2 instances to generate and store data. Another set of EC2 instances will then analyze and modify the data. Storage requirements will be significant and will continue to grow over time. The application architects require a storage solution.Which actions would meet these needs?", "related_lectures": []}, {"_class": "assessment", "id": 184764453, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is migrating from an on-premises infrastructure to the AWS Cloud. One of the company's applications stores files on a Windows file server farm that uses Distributed File System Replication (DFSR) to keep data in sync. A solutions architect needs to replace the file server farm.</p><p>Which service should the solutions architect use?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon FSx for Windows File Server provides fully managed, highly reliable file storage that is accessible over the industry-standard Server Message Block (SMB) protocol.</p><p>Amazon FSx is built on Windows Server and provides a rich set of administrative features that include end-user file restore, user quotas, and Access Control Lists (ACLs).</p><p>Additionally, Amazon FSX for Windows File Server supports Distributed File System Replication (DFSR) in Single-AZ deployments as can be seen in the feature comparison table below.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-17_14-56-37-c7a7eff7f9da52f8dadafb160c3ac4c0.JPG\"></p><p><strong>CORRECT: </strong>\"Amazon FSx\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon EFS\" is incorrect as EFS only supports Linux systems.</p><p><strong>INCORRECT:</strong> \"Amazon S3\" is incorrect as this is not a suitable replacement for a Microsoft filesystem.</p><p><strong>INCORRECT:</strong> \"AWS Storage Gateway\" is incorrect as this service is primarily used for connecting on-premises storage to cloud storage. It consists of a software device installed on-premises and can be used with SMB shares but it actually stores the data on S3. It is also used for migration. However, in this case the company need to replace the file server farm and Amazon FSx is the best choice for this job.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html\">https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-fsx/\">https://digitalcloud.training/amazon-fsx/</a></p>", "answers": ["<p>Amazon EFS</p>", "<p>Amazon FSx</p>", "<p>Amazon S3</p>", "<p>AWS Storage Gateway</p>"]}, "correct_response": ["b"], "section": "AWS Storage", "question_plain": "A company is migrating from an on-premises infrastructure to the AWS Cloud. One of the company's applications stores files on a Windows file server farm that uses Distributed File System Replication (DFSR) to keep data in sync. A solutions architect needs to replace the file server farm.Which service should the solutions architect use?", "related_lectures": []}, {"_class": "assessment", "id": 184764455, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A solutions architect is creating a system that will run analytics on financial data for several hours a night 5 days a week. The analysis is expected to run for the same duration and cannot be interrupted once it is started. The system will be required for a minimum of 1 year.</p><p>What should the solutions architect configure to ensure the EC2 instances are available when they are needed?</p>", "relatedLectureIds": [], "links": [], "feedbacks": ["", "", "", ""], "explanation": "<p>On-Demand Capacity Reservations enable you to reserve compute capacity for your Amazon EC2 instances in a specific Availability Zone for any duration. This gives you the ability to create and manage Capacity Reservations independently from the billing discounts offered by Savings Plans or Regional Reserved Instances.</p><p>By creating Capacity Reservations, you ensure that you always have access to EC2 capacity when you need it, for as long as you need it. You can create Capacity Reservations at any time, without entering a one-year or three-year term commitment, and the capacity is available immediately.</p><p>The table below shows the difference between capacity reservations and other options:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2022-01-10_20-24-52-810be510ec31f342fd622453a1ebec94.png\"></p><p><strong>CORRECT: </strong>\"On-Demand Capacity Reservations\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Regional Reserved Instances\" is incorrect. This type of reservation does not reserve capacity.</p><p><strong>INCORRECT:</strong> \"On-Demand Instances\" is incorrect. This does not provide any kind of capacity reservation.</p><p><strong>INCORRECT:</strong> \"Savings Plans\" is incorrect. This pricing option does not provide a capacity reservation.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-scheduled-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-scheduled-instances.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Savings Plans</p>", "<p>On-Demand Instances</p>", "<p>Regional Reserved Instances</p>", "<p>On-Demand Capacity Reservations</p>"]}, "correct_response": ["d"], "section": "AWS Compute", "question_plain": "A solutions architect is creating a system that will run analytics on financial data for several hours a night 5 days a week. The analysis is expected to run for the same duration and cannot be interrupted once it is started. The system will be required for a minimum of 1 year.What should the solutions architect configure to ensure the EC2 instances are available when they are needed?", "related_lectures": []}, {"_class": "assessment", "id": 184764457, "assessment_type": "multi-select", "prompt": {"question": "<p>An Amazon VPC contains several Amazon EC2 instances. The instances need to make API calls to Amazon DynamoDB. A solutions architect needs to ensure that the API calls do not traverse the internet.</p><p>How can this be accomplished? (Select TWO.)</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Amazon DynamoDB and Amazon S3 support gateway endpoints, not interface endpoints. With a gateway endpoint you create the endpoint in the VPC, attach a policy allowing access to the service, and then specify the route table to create a route table entry in.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_01-00-45-ac665c89acb1641afb831f1eb795210e.jpg\"></p><p><strong>CORRECT: </strong>\"Create a route table entry for the endpoint\" is a correct answer.</p><p><strong>CORRECT: </strong>\"Create a gateway endpoint for DynamoDB\" is also a correct answer.</p><p><strong>INCORRECT:</strong> \"Create a new DynamoDB table that uses the endpoint\" is incorrect as it is not necessary to create a new DynamoDB table.</p><p><strong>INCORRECT:</strong> \"Create an ENI for the endpoint in each of the subnets of the VPC\" is incorrect as an ENI is used by an interface endpoint, not a gateway endpoint.</p><p><strong>INCORRECT:</strong> \"Create a VPC peering connection between the VPC and DynamoDB\" is incorrect as you cannot create a VPC peering connection between a VPC and a public AWS service as public services are outside of VPCs.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpce-gateway.html\">https://docs.aws.amazon.com/vpc/latest/userguide/vpce-gateway.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Create a route table entry for the endpoint</p>", "<p>Create a gateway endpoint for DynamoDB</p>", "<p>Create a new DynamoDB table that uses the endpoint</p>", "<p>Create an ENI for the endpoint in each of the subnets of the VPC</p>", "<p>Create a VPC peering connection between the VPC and DynamoDB</p>"]}, "correct_response": ["a", "b"], "section": "AWS Networking & Content Delivery", "question_plain": "An Amazon VPC contains several Amazon EC2 instances. The instances need to make API calls to Amazon DynamoDB. A solutions architect needs to ensure that the API calls do not traverse the internet.How can this be accomplished? (Select TWO.)", "related_lectures": []}, {"_class": "assessment", "id": 184764459, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A retail company with many stores and warehouses is implementing IoT sensors to gather monitoring data from devices in each location. The data will be sent to AWS in real time. A solutions architect must provide a solution for ensuring events are received in order for each device and ensure that data is saved for future processing.</p><p>Which solution would be MOST efficient?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Kinesis Data Streams collect and process data in real time. A <em>Kinesis data stream</em> is a set of <a href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html#shard\">shards</a>. Each shard has a sequence of data records. Each data record has a <a href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html#sequence-number\">sequence number</a> that is assigned by Kinesis Data Streams. A <em>shard</em> is a uniquely identified sequence of data records in a stream.</p><p>A <em>partition key</em> is used to group data by shard within a stream. Kinesis Data Streams segregates the data records belonging to a stream into multiple shards. It uses the partition key that is associated with each data record to determine which shard a given data record belongs to.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_01-04-57-65202de89627ab9ac70ef6b89817c981.jpg\"></p><p>For this scenario, the solutions architect can use a partition key for each device. This will ensure the records for that device are grouped by shard and the shard will ensure ordering. Amazon S3 is a valid destination for saving the data records.</p><p><strong>CORRECT: </strong>\"Use Amazon Kinesis Data Streams for real-time events with a partition key for each device. Use Amazon Kinesis Data Firehose to save data to Amazon S3\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon Kinesis Data Streams for real-time events with a shard for each device. Use Amazon Kinesis Data Firehose to save data to Amazon EBS\" is incorrect as you cannot save data to EBS from Kinesis.</p><p><strong>INCORRECT:</strong> \"Use an Amazon SQS FIFO queue for real-time events with one queue for each device. Trigger an AWS Lambda function for the SQS queue to save data to Amazon EFS\" is incorrect as SQS is not the most efficient service for streaming, real time data.</p><p><strong>INCORRECT:</strong> \"Use an Amazon SQS standard queue for real-time events with one queue for each device. Trigger an AWS Lambda function from the SQS queue to save data to Amazon S3\" is incorrect as SQS is not the most efficient service for streaming, real time data.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html\">https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-kinesis/\">https://digitalcloud.training/amazon-kinesis/</a></p>", "answers": ["<p>Use Amazon Kinesis Data Streams for real-time events with a partition key for each device. Use Amazon Kinesis Data Firehose to save data to Amazon S3</p>", "<p>Use Amazon Kinesis Data Streams for real-time events with a shard for each device. Use Amazon Kinesis Data Firehose to save data to Amazon EBS</p>", "<p>Use an Amazon SQS FIFO queue for real-time events with one queue for each device. Trigger an AWS Lambda function for the SQS queue to save data to Amazon EFS</p>", "<p>Use an Amazon SQS standard queue for real-time events with one queue for each device. Trigger an AWS Lambda function from the SQS queue to save data to Amazon S3</p>"]}, "correct_response": ["a"], "section": "AWS Analytics", "question_plain": "A retail company with many stores and warehouses is implementing IoT sensors to gather monitoring data from devices in each location. The data will be sent to AWS in real time. A solutions architect must provide a solution for ensuring events are received in order for each device and ensure that data is saved for future processing.Which solution would be MOST efficient?", "related_lectures": []}, {"_class": "assessment", "id": 184764461, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An insurance company has a web application that serves users in the United Kingdom and Australia. The application includes a database tier using a MySQL database hosted in eu-west-2. The web tier runs from eu-west-2 and ap-southeast-2. Amazon Route 53 geoproximity routing is used to direct users to the closest web tier. It has been noted that Australian users receive slow response times to queries.</p><p>Which changes should be made to the database tier to improve performance?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The issue here is latency with read queries being directed from Australia to UK which is great physical distance. A solution is required for improving read performance in Australia.</p><p>An Aurora global database consists of one primary AWS Region where your data is mastered, and up to five read-only, secondary AWS Regions. Aurora replicates data to the secondary AWS Regions with typical latency of under a second. You issue write operations directly to the primary DB instance in the primary AWS Region.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/2020-05-21_01-05-41-0e623951d5ed62017a22f93bb14c6c67.jpg\"></p><p>This solution will provide better performance for users in the Australia Region for queries. Writes must still take place in the UK Region but read performance will be greatly improved.</p><p><strong>CORRECT: </strong>\"Migrate the database to an Amazon Aurora global database in MySQL compatibility mode. Configure read replicas in ap-southeast-2\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Migrate the database to Amazon RDS for MySQL. Configure Multi-AZ in the Australian Region\" is incorrect. The database is located in UK. If the database is migrated to Australia then the reverse problem will occur. Multi-AZ does not assist with improving query performance across Regions.</p><p><strong>INCORRECT:</strong> \"Migrate the database to Amazon DynamoDB. Use DynamoDB global tables to enable replication to additional Regions\" is incorrect as a relational database running on MySQL is unlikely to be compatible with DynamoDB.</p><p><strong>INCORRECT:</strong> \"Deploy MySQL instances in each Region. Deploy an Application Load Balancer in front of MySQL to reduce the load on the primary instance\" is incorrect as you can only put ALBs in front of the web tier, not the DB tier.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-aurora/\">https://digitalcloud.training/amazon-aurora/</a></p>", "answers": ["<p>Migrate the database to Amazon RDS for MySQL. Configure Multi-AZ in the Australian Region</p>", "<p>Migrate the database to Amazon DynamoDB. Use DynamoDB global tables to enable replication to additional Regions</p>", "<p>Deploy MySQL instances in each Region. Deploy an Application Load Balancer in front of MySQL to reduce the load on the primary instance</p>", "<p>Migrate the database to an Amazon Aurora global database in MySQL compatibility mode. Configure read replicas in ap-southeast-2</p>"]}, "correct_response": ["d"], "section": "AWS Database", "question_plain": "An insurance company has a web application that serves users in the United Kingdom and Australia. The application includes a database tier using a MySQL database hosted in eu-west-2. The web tier runs from eu-west-2 and ap-southeast-2. Amazon Route 53 geoproximity routing is used to direct users to the closest web tier. It has been noted that Australian users receive slow response times to queries.Which changes should be made to the database tier to improve performance?", "related_lectures": []}, {"_class": "assessment", "id": 184764463, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company is investigating methods to reduce the expenses associated with on-premises backup infrastructure. The Solutions Architect wants to reduce costs by eliminating the use of physical backup tapes. It is a requirement that existing backup applications and workflows should continue to function.</p><p>What should the Solutions Architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The AWS Storage Gateway Tape Gateway enables you to replace using physical tapes on premises with virtual tapes in AWS without changing existing backup workflows. Tape Gateway emulates physical tape libraries, removes the cost and complexity of managing physical tape infrastructure, and provides more durability than physical tapes.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2020-11-27_09-45-15-153ae046c9838c5d880c4f0fce858218.jpg\"></p><p><strong>CORRECT: </strong>\"Connect the backup applications to an AWS Storage Gateway using an iSCSI-virtual tape library (VTL)\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Amazon EFS file system and connect the backup applications using the NFS protocol\" is incorrect. The NFS protocol is used by AWS Storage Gateway File Gateways but these do not provide virtual tape functionality that is suitable for replacing the existing backup infrastructure.</p><p><strong>INCORRECT:</strong> \"Create an Amazon EFS file system and connect the backup applications using the iSCSI protocol\" is incorrect. The NFS protocol is used by AWS Storage Gateway File Gateways but these do not provide virtual tape functionality that is suitable for replacing the existing backup infrastructure.</p><p><strong>INCORRECT:</strong> \"Connect the backup applications to an AWS Storage Gateway using the NFS protocol\" is incorrect. The iSCSI protocol is used by AWS Storage Gateway Volume Gateways but these do not provide virtual tape functionality that is suitable for replacing the existing backup infrastructure.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/storagegateway/vtl/\">https://aws.amazon.com/storagegateway/vtl/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-storage-gateway/\">https://digitalcloud.training/aws-storage-gateway/</a></p>", "answers": ["<p>Connect the backup applications to an AWS Storage Gateway using an iSCSI-virtual tape library (VTL).</p>", "<p>Create an Amazon EFS file system and connect the backup applications using the NFS protocol.</p>", "<p>Create an Amazon EFS file system and connect the backup applications using the iSCSI protocol.</p>", "<p>Connect the backup applications to an AWS Storage Gateway using the iSCSI protocol.</p>"]}, "correct_response": ["a"], "section": "AWS Storage", "question_plain": "A company is investigating methods to reduce the expenses associated with on-premises backup infrastructure. The Solutions Architect wants to reduce costs by eliminating the use of physical backup tapes. It is a requirement that existing backup applications and workflows should continue to function.What should the Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764465, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Microsoft Windows file server farm uses Distributed File System Replication (DFSR) to synchronize data in an on-premises environment. The infrastructure is being migrated to the AWS Cloud.</p><p>Which service should the solutions architect use to replace the file server farm?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon FSx for Windows file server supports DFS namespaces and DFS replication. This is the best solution for replacing the on-premises infrastructure. Note the limitations for deployment:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2020-11-27_09-52-13-238b160c6f54f8650622a66a33fc34a4.jpg\"></p><p><strong>CORRECT: </strong>\"Amazon FSx\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon EFS\" is incorrect. You cannot replace a Windows file server farm with EFS as it uses a completely different protocol.</p><p><strong>INCORRECT:</strong> \"Amazon EBS\" is incorrect. Amazon EBS provides block-based volumes that are attached to EC2 instances. It cannot be used for replacing a shared Windows file server farm using DFSR.</p><p><strong>INCORRECT:</strong> \"AWS Storage Gateway\" is incorrect. This service is used for providing cloud storage solutions for on-premises servers. In this case the infrastructure is being migrated into the AWS Cloud.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html\">https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-fsx/\">https://digitalcloud.training/amazon-fsx/</a></p>", "answers": ["<p>Amazon EFS</p>", "<p>Amazon EBS</p>", "<p>AWS Storage Gateway</p>", "<p>Amazon FSx</p>"]}, "correct_response": ["d"], "section": "AWS Storage", "question_plain": "A Microsoft Windows file server farm uses Distributed File System Replication (DFSR) to synchronize data in an on-premises environment. The infrastructure is being migrated to the AWS Cloud.Which service should the solutions architect use to replace the file server farm?", "related_lectures": []}, {"_class": "assessment", "id": 184764467, "assessment_type": "multiple-choice", "prompt": {"question": "<p>An eCommerce application consists of three tiers. The web tier includes EC2 instances behind an Application Load balancer, the middle tier uses EC2 instances and an Amazon SQS queue to process orders, and the database tier consists of an Auto Scaling DynamoDB table. During busy periods customers have complained about delays in the processing of orders. A Solutions Architect has been tasked with reducing processing times.</p><p>Which action will be MOST effective in accomplishing this requirement?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The most likely cause of the processing delays is insufficient instances in the middle tier where the order processing takes place. The most effective solution to reduce processing times in this case is to scale based on the backlog per instance (number of messages in the SQS queue) as this reflects the amount of work that needs to be done.</p><p><strong>CORRECT: </strong>\"Use Amazon EC2 Auto Scaling to scale out the middle tier instances based on the SQS queue depth\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Replace the Amazon SQS queue with Amazon Kinesis Data Firehose\" is incorrect. The issue is not the efficiency of queuing messages but the processing of the messages. In this case scaling the EC2 instances to reflect the workload is a better solution.</p><p><strong>INCORRECT:</strong> \"Use Amazon DynamoDB Accelerator (DAX) in front of the DynamoDB backend tier\" is incorrect. The DynamoDB table is configured with Auto Scaling so this is not likely to be the bottleneck in order processing.</p><p><strong>INCORRECT:</strong> \"Add an Amazon CloudFront distribution with a custom origin to cache the responses for the web tier\" is incorrect. This will cache media files to speed up web response times but not order processing times as they take place in the middle tier.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2-auto-scaling/\">https://digitalcloud.training/amazon-ec2-auto-scaling/</a></p>", "answers": ["<p>Replace the Amazon SQS queue with Amazon Kinesis Data Firehose.</p>", "<p>Use Amazon EC2 Auto Scaling to scale out the middle tier instances based on the SQS queue depth.</p>", "<p>Use Amazon DynamoDB Accelerator (DAX) in front of the DynamoDB backend tier.</p>", "<p>Add an Amazon CloudFront distribution with a custom origin to cache the responses for the web tier.</p>"]}, "correct_response": ["b"], "section": "AWS Application Integration", "question_plain": "An eCommerce application consists of three tiers. The web tier includes EC2 instances behind an Application Load balancer, the middle tier uses EC2 instances and an Amazon SQS queue to process orders, and the database tier consists of an Auto Scaling DynamoDB table. During busy periods customers have complained about delays in the processing of orders. A Solutions Architect has been tasked with reducing processing times.Which action will be MOST effective in accomplishing this requirement?", "related_lectures": []}, {"_class": "assessment", "id": 184764469, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company runs containerized applications for many application workloads in an on-premise data center. The company is planning to deploy containers to AWS and the chief architect has mandated that the same configuration and administrative tools must be used across all containerized environments. The company also wishes to remain cloud agnostic to safeguard against the impact of future changes in cloud strategy.</p><p>How can a Solutions Architect design a managed solution that will align with open-source software?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon EKS is a managed service that can be used to run Kubernetes on AWS. Kubernetes is an open-source system for automating the deployment, scaling, and management of containerized applications. Applications running on Amazon EKS are fully compatible with applications running on any standard Kubernetes environment, whether running in on-premises data centers or public clouds. This means that you can easily migrate any standard Kubernetes application to Amazon EKS without any code modification.</p><p>This solution ensures that the same open-source software is used for automating the deployment, scaling, and management of containerized applications both on-premises and in the AWS Cloud.</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2020-11-27_09-55-33-2abdd31ee10dd8c28e19ec75e2a29309.jpg\"></p><p><strong>CORRECT: </strong>\"Launch the containers on Amazon Elastic Kubernetes Service (EKS) and EKS worker nodes\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Launch the containers on a fleet of Amazon EC2 instances in a cluster placement group\" is incorrect</p><p><strong>INCORRECT:</strong> \"Launch the containers on Amazon Elastic Container Service (ECS) with AWS Fargate instances\" is incorrect</p><p><strong>INCORRECT:</strong> \"Launch the containers on Amazon Elastic Container Service (ECS) with Amazon EC2 instance worker nodes\" is incorrect</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html\">https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ecs-and-eks/\">https://digitalcloud.training/amazon-ecs-and-eks/</a></p>", "answers": ["<p>Launch the containers on Amazon Elastic Kubernetes Service (EKS) and EKS worker nodes.</p>", "<p>Launch the containers on a fleet of Amazon EC2 instances in a cluster placement group.</p>", "<p>Launch the containers on Amazon Elastic Container Service (ECS) with AWS Fargate instances.</p>", "<p>Launch the containers on Amazon Elastic Container Service (ECS) with Amazon EC2 instance worker nodes.</p>"]}, "correct_response": ["a"], "section": "AWS Compute", "question_plain": "A company runs containerized applications for many application workloads in an on-premise data center. The company is planning to deploy containers to AWS and the chief architect has mandated that the same configuration and administrative tools must be used across all containerized environments. The company also wishes to remain cloud agnostic to safeguard against the impact of future changes in cloud strategy.How can a Solutions Architect design a managed solution that will align with open-source software?", "related_lectures": []}, {"_class": "assessment", "id": 184764471, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company has two accounts for perform testing and each account has a single VPC: VPC-TEST1 and VPC-TEST2. The operations team require a method of securely copying files between Amazon EC2 instances in these VPCs. The connectivity should not have any single points of failure or bandwidth constraints.</p><p>Which solution should a Solutions Architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>A VPC peering connection is a networking connection between two VPCs that enables you to route traffic between them using private IPv4 addresses or IPv6 addresses. Instances in either VPC can communicate with each other as if they are within the same network.</p><p>You can create a VPC peering connection between your own VPCs, or with a VPC in another AWS account. The VPCs can be in different regions (also known as an inter-region VPC peering connection).</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_09-50-39-d2cdb66079d7dfcc2c83b098f21eafa2.jpg\"></p><p><strong>CORRECT: </strong>\"Create a VPC peering connection between VPC-TEST1 and VPC-TEST2\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create a VPC gateway endpoint for each EC2 instance and update route tables\" is incorrect. You cannot create VPC gateway endpoints for Amazon EC2 instances. These are used with DynamoDB and S3 only.</p><p><strong>INCORRECT:</strong> \"Attach a virtual private gateway to VPC-TEST1 and VPC-TEST2 and enable routing\" is incorrect. You cannot create an AWS Managed VPN connection between two VPCs.</p><p><strong>INCORRECT:</strong> \"Attach a Direct Connect gateway to VPC-TEST1 and VPC-TEST2 and enable routing\" is incorrect. Direct Connect gateway is used to connect a Direct Connect connection to multiple VPCs, it is not useful in this scenario as there is no Direct Connect connection.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html\">https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-vpc/\">https://digitalcloud.training/amazon-vpc/</a></p>", "answers": ["<p>Create a VPC gateway endpoint for each EC2 instance and update route tables.</p>", "<p>Attach a virtual private gateway to VPC-TEST1 and VPC-TEST2 and enable routing.</p>", "<p>Attach a Direct Connect gateway to VPC-TEST1 and VPC-TEST2 and enable routing.</p>", "<p>Create a VPC peering connection between VPC-TEST1 and VPC-TEST2.</p>"]}, "correct_response": ["d"], "section": "AWS Networking & Content Delivery", "question_plain": "A company has two accounts for perform testing and each account has a single VPC: VPC-TEST1 and VPC-TEST2. The operations team require a method of securely copying files between Amazon EC2 instances in these VPCs. The connectivity should not have any single points of failure or bandwidth constraints.Which solution should a Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764473, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A Solutions Architect has deployed an application on several Amazon EC2 instances across three private subnets. The application must be made accessible to internet-based clients with the least amount of administrative effort.</p><p>How can the Solutions Architect make the application available on the internet?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>To make the application instances accessible on the internet the Solutions Architect needs to place them behind an internet-facing Elastic Load Balancer. The way you add instances in private subnets to a public facing ELB is to add public subnets in the same AZs as the private subnets to the ELB. You can then add the instances and to the ELB and they will become targets for load balancing.</p><p>An example of this architecture is shown below:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_10-09-08-4d552faa7e6a02f1057665490b64d36b.jpg\"></p><p><strong>CORRECT: </strong>\"Create an Application Load Balancer and associate three public subnets from the same Availability Zones as the private instances. Add the private instances to the ALB\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Create an Application Load Balancer and associate three private subnets from the same Availability Zones as the private instances. Add the private instances to the ALB\" is incorrect. Public subnets in the same AZs as the private subnets must be added to make this configuration work.</p><p><strong>INCORRECT:</strong> \"Create an Amazon Machine Image (AMI) of the instances in the private subnet and launch new instances from the AMI in public subnets. Create an Application Load Balancer and add the public instances to the ALB\" is incorrect. There is no need to use an AMI to create new instances in a public subnet. You can add instances in private subnets to a public-facing ELB.</p><p><strong>INCORRECT:</strong> \"Create a NAT gateway in a public subnet. Add a route to the NAT gateway to the route tables of the three private subnets\" is incorrect. A NAT gateway is used for outbound traffic not inbound traffic and cannot make the application available to internet-based clients.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/public-load-balancer-private-ec2/\">https://aws.amazon.com/premiumsupport/knowledge-center/public-load-balancer-private-ec2/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/\">https://digitalcloud.training/aws-elastic-load-balancing-aws-elb/</a></p>", "answers": ["<p>Create an Amazon Machine Image (AMI) of the instances in the private subnet and launch new instances from the AMI in public subnets. Create an Application Load Balancer and add the public instances to the ALB.</p>", "<p>Create an Application Load Balancer and associate three public subnets from the same Availability Zones as the private instances. Add the private instances to the ALB.</p>", "<p>Create an Application Load Balancer and associate three private subnets from the same Availability Zones as the private instances. Add the private instances to the ALB.</p>", "<p>Create a NAT gateway in a public subnet. Add a route to the NAT gateway to the route tables of the three private subnets.</p>"]}, "correct_response": ["b"], "section": "AWS Compute", "question_plain": "A Solutions Architect has deployed an application on several Amazon EC2 instances across three private subnets. The application must be made accessible to internet-based clients with the least amount of administrative effort.How can the Solutions Architect make the application available on the internet?", "related_lectures": []}, {"_class": "assessment", "id": 184764475, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A video production company is planning to move some of its workloads to the AWS Cloud. The company will require around 5 TB of storage for video processing with the maximum possible I/O performance. They also require over 400 TB of extremely durable storage for storing video files and 800 TB of storage for long-term archival.</p><p>Which combinations of services should a Solutions Architect use to meet these requirements?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>The best I/O performance can be achieved by using instance store volumes for the video processing. This is safe to use for use cases where the data can be recreated from the source files so this is a good use case.</p><p>For storing data durably Amazon S3 is a good fit as it provides 99.999999999% of durability. For archival the video files can then be moved to Amazon S3 Glacier which is a low cost storage option that is ideal for long-term archival.</p><p><strong>CORRECT: </strong>\"Amazon EC2 instance store for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Amazon EBS for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage\" is incorrect. EBS is not going to provide as much I/O performance as an instance store volume so is not the best choice for this use case.</p><p><strong>INCORRECT:</strong> \"Amazon EC2 instance store for maximum performance, Amazon EFS for durable data storage, and Amazon S3 for archival storage\" is incorrect. EFS does not provide as much durability as Amazon S3 and will not be as cost-effective.</p><p><strong>INCORRECT:</strong> \"Amazon EBS for maximum performance, Amazon EFS for durable data storage, and Amazon S3 Glacier for archival storage\" is incorrect. EBS and EFS are not the best choices here as described above.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p><p><a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-s3-and-glacier/\">https://digitalcloud.training/amazon-s3-and-glacier/</a></p>", "answers": ["<p>Amazon EC2 instance store for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage.</p>", "<p>Amazon EBS for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage.</p>", "<p>Amazon EC2 instance store for maximum performance, Amazon EFS for durable data storage, and Amazon S3 for archival storage.</p>", "<p>Amazon EBS for maximum performance, Amazon EFS for durable data storage, and Amazon S3 Glacier for archival storage.</p>"]}, "correct_response": ["a"], "section": "AWS Storage", "question_plain": "A video production company is planning to move some of its workloads to the AWS Cloud. The company will require around 5 TB of storage for video processing with the maximum possible I/O performance. They also require over 400 TB of extremely durable storage for storing video files and 800 TB of storage for long-term archival.Which combinations of services should a Solutions Architect use to meet these requirements?", "related_lectures": []}, {"_class": "assessment", "id": 184764477, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company provides a REST-based interface to an application that allows a partner company to send data in near-real time. The application then processes the data that is received and stores it for later analysis. The application runs on Amazon EC2 instances.</p><p>The partner company has received many 503 Service Unavailable Errors when sending data to the application and the compute capacity reaches its limits and is unable to process requests when spikes in data volume occur.</p><p>Which design should a Solutions Architect implement to improve scalability?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon Kinesis enables you to ingest, buffer, and process streaming data in real-time. Kinesis can handle any amount of streaming data and process data from hundreds of thousands of sources with very low latencies. This is an ideal solution for data ingestion.</p><p>To ensure the compute layer can scale to process increasing workloads, the EC2 instances should be replaced by AWS Lambda functions. Lambda can scale seamlessly by running multiple executions in parallel.</p><p><strong>CORRECT: </strong>\"Use Amazon Kinesis Data Streams to ingest the data. Process the data using AWS Lambda functions\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use Amazon API Gateway in front of the existing application. Create a usage plan with a quota limit for the partner company\" is incorrect. A usage plan will limit the amount of data that is received and cause more errors to be received by the partner company.</p><p><strong>INCORRECT:</strong> \"Use Amazon SQS to ingest the data. Configure the EC2 instances to process messages from the SQS queue\" is incorrect. Amazon Kinesis Data Streams should be used for near-real time or real-time use cases instead of Amazon SQS.</p><p><strong>INCORRECT:</strong> \"Use Amazon SNS to ingest the data and trigger AWS Lambda functions to process the data in near-real time\" is incorrect. SNS is not a near-real time solution for data ingestion. SNS is used for sending notifications.</p><p><strong>References:</strong></p><p><a href=\"https://aws.amazon.com/kinesis/\">https://aws.amazon.com/kinesis/</a></p><p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-scaling.html\">https://docs.aws.amazon.com/lambda/latest/dg/invocation-scaling.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/aws-lambda/\">https://digitalcloud.training/aws-lambda/</a></p><p><a href=\"https://digitalcloud.training/amazon-kinesis/\">https://digitalcloud.training/amazon-kinesis/</a></p>", "answers": ["<p>Use Amazon API Gateway in front of the existing application. Create a usage plan with a quota limit for the partner company.</p>", "<p>Use Amazon Kinesis Data Streams to ingest the data. Process the data using AWS Lambda functions.</p>", "<p>Use Amazon SQS to ingest the data. Configure the EC2 instances to process messages from the SQS queue.</p>", "<p>Use Amazon SNS to ingest the data and trigger AWS Lambda functions to process the data in near-real time.</p>"]}, "correct_response": ["b"], "section": "AWS Analytics", "question_plain": "A company provides a REST-based interface to an application that allows a partner company to send data in near-real time. The application then processes the data that is received and stores it for later analysis. The application runs on Amazon EC2 instances.The partner company has received many 503 Service Unavailable Errors when sending data to the application and the compute capacity reaches its limits and is unable to process requests when spikes in data volume occur.Which design should a Solutions Architect implement to improve scalability?", "related_lectures": []}, {"_class": "assessment", "id": 184764479, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A persistent database must be migrated from an on-premises server to an Amazon EC2 instances. The database requires 64,000 IOPS and, if possible, should be stored on a single Amazon EBS volume.</p><p>Which solution should a Solutions Architect recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon EC2 Nitro-based systems are not required for this solution but do offer advantages in performance that will help to maximize the usage of the EBS volume. For the data storage volume an i01 volume can support up to 64,000 IOPS so a single volume with sufficient capacity (50 IOPS per GiB) can be deliver the requirements.</p><p>The current list of EBS volume types is in the table below:</p><p><img src=\"https://img-c.udemycdn.com/redactor/raw/test_question_description/2021-02-25_10-17-09-93913bab7527ec0862c9e21624ba7869.jpg\"></p><p><strong>CORRECT: </strong>\"Create a Nitro-based Amazon EC2 instance with an Amazon EBS Provisioned IOPS SSD (i01) volume attached. Provision 64,000 IOPS for the volume\" is the correct answer.</p><p><strong>INCORRECT:</strong> \"Use an instance from the I3 I/O optimized family and leverage instance store storage to achieve the IOPS requirement\" is incorrect.</p><p><strong>INCORRECT:</strong> \"Create an Amazon EC2 instance with four Amazon EBS General Purpose SSD (gp2) volumes attached. Max out the IOPS on each volume and use a RAID 0 stripe set\" is incorrect. This is not a good use case for gp2 volumes. It is much better to use io1 which also meets the requirement of having a single volume with 64,000 IOPS.</p><p><strong>INCORRECT:</strong> \"Create an Amazon EC2 instance with two Amazon EBS Provisioned IOPS SSD (i01) volumes attached. Provision 32,000 IOPS per volume and create a logical volume using the OS that aggregates the capacity\" is incorrect. There is no need to create two volumes and aggregate capacity through the OS, the Solutions Architect can simply create a single volume with 64,000 IOPS.</p><p><strong>References:</strong></p><p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p><p><strong>Save time with our AWS cheat sheets:</strong></p><p><a href=\"https://digitalcloud.training/amazon-ec2/\">https://digitalcloud.training/amazon-ec2/</a></p>", "answers": ["<p>Use an instance from the I3 I/O optimized family and leverage instance store storage to achieve the IOPS requirement.</p>", "<p>Create an Amazon EC2 instance with four Amazon EBS General Purpose SSD (gp2) volumes attached. Max out the IOPS on each volume and use a RAID 0 stripe set.</p>", "<p>Create a Nitro-based Amazon EC2 instance with an Amazon EBS Provisioned IOPS SSD (i01) volume attached. Provision 64,000 IOPS for the volume.</p>", "<p>Create an Amazon EC2 instance with two Amazon EBS Provisioned IOPS SSD (i01) volumes attached. Provision 32,000 IOPS per volume and create a logical volume using the OS that aggregates the capacity.</p>"]}, "correct_response": ["c"], "section": "AWS Compute", "question_plain": "A persistent database must be migrated from an on-premises server to an Amazon EC2 instances. The database requires 64,000 IOPS and, if possible, should be stored on a single Amazon EBS volume.Which solution should a Solutions Architect recommend?", "related_lectures": []}, {"_class": "assessment", "id": 184764481, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company uses an Amazon RDS MySQL database instance to store customer order data. The security team have requested that SSL/TLS encryption in transit must be used for encrypting connections to the database from application servers. The data in the database is currently encrypted at rest using an AWS KMS key.</p><p>How can a Solutions Architect enable encryption in transit?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Amazon RDS creates an SSL certificate and installs the certificate on the DB instance when Amazon RDS provisions the instance. These certificates are signed by a certificate authority. The SSL certificate includes the DB instance
